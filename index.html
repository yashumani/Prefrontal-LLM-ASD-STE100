<section class="slide type-cover" id="static-opening-thesis"><div class="cover-grid"><div><p class="eyebrow">Prefrontal · the context product</p><h1>Approve context once. Reuse it with control.</h1><p class="lead">Turn business knowledge into approved, linked context for the analytics and AI applications you already use.</p><div class="items"><article class="item"><h3>One reusable context layer</h3><p>Build on Looker, LookML, Zenlytics and custom apps.</p></article><article class="item"><h3>A funded proof of value</h3><p>Start with one workflow. Measure the return before expansion.</p></article></div></div><div class="industry-hero-visual"><figure class="mechanism-figure"><svg viewBox="0 0 720 510" role="img" aria-labelledby="industry-product-1-title industry-product-1-desc" class="motion-diagram industry-svg industry-svg-atlas product-map" preserveAspectRatio="xMidYMid meet"><title id="industry-product-1-title">Prefrontal connects cost, performance, accuracy and trust through governed context</title><desc id="industry-product-1-desc">Four product objectives surround one proposed governed context layer. Cost, performance, accuracy and trust need agreed pilot measurements. This diagram reports no achieved result.</desc><defs><marker id="industry-product-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #147dfa)"/></marker></defs><path d="M360 38V475M35 255H685" stroke="#254963" stroke-dasharray="2 8" fill="none"/><circle cx="360" cy="255" r="151" fill="none" stroke="#254963" stroke-dasharray="3 8"/><circle cx="360" cy="255" r="118" fill="none" stroke="#345e78"/><g class="m-edge m-stage" data-step="0"><path id="industry-product-1-cost" d="M270 94 C348 94 302 172 336 206" fill="none" stroke="var(--cost, #000000)" stroke-width="2.5" marker-end="url(#industry-product-1-arrow)"/></g><g class="m-edge m-stage" data-step="1"><path id="industry-product-1-performance" d="M450 94 C372 94 41 <section class="slide type-problem" id="static-fragmented-context"><p class="eyebrow">Leadership · the recurring cost</p><h2>Your AI keeps paying to understand the same work.</h2><p class="lead">Your stack already models data. The proposal addresses context that teams still reconcile across tools, owners and versions.</p><div class="items"><article class="item"><h3>Preparation</h3><p>People connect existing metric definitions to evidence, exceptions and ownership.</p></article><article class="item"><h3>Reconciliation</h3><p>People resolve conflicting versions and missing conditions.</p></article><article class="item"><h3>Review and rework</h3><p>People check unsupported or unsuitable outputs.</p></article><article class="item"><h3>Change management</h3><p>Teams reconnect context when models or tools change.</p></article></div><p class="slide-note">These are problem hypotheses. Establish their frequency and cost in the selected workflow.</p></section>
<section class="slide type-product-flow" id="static-product-overview"><p class="eyebrow">Leadership · what you would buy</p><h2>One governed context service. Many consumers.</h2><p class="lead">The product accepts submissions, governs meaning, organizes linked records and delivers permitted context.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-2-title context-product-flow-2-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-2-title">The product in one view</title><desc id="context-product-flow-2-desc">People and agent loops submit evidence in one structured template. The original source remains available. A responsible human checks meaning, evidence and access. Approval binds to the exact version. The context agent organizes approved records. Stable IDs connect the layers. New meaning returns to review. The delivery server checks the caller and the requested records. Your applications decide how to use permitted outputs. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-2-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="submit" data-step="0" data-stage="Submit context" data-stage-detail="People and agent loops submit evidence in one structured template. The original source remains available."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Submit context</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Evidence + owner</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">One review template</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-2-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-2-arrow)"/></g><g class="m-node m-stage" data-node="approve" data-step="1" data-stage="Approve meaning" data-stage-detail="A responsible human checks meaning, evidence and access. Approval binds to the exact version."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Approve meaning</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Human review</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Exact record version</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-2-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-2-arrow)"/></g><g class="m-node m-stage" data-node="organize" data-step="2" data-stage="Build linked layers" data-stage-detail="The context agent organizes approved records. Stable IDs connect the layers. New meaning returns to review."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Build linked layers</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Stable IDs + versions</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Facts, measures, meaning</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-2-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-2-arrow)"/></g><g class="m-node m-stage" data-node="serve" data-step="3" data-stage="Serve context" data-stage-detail="The delivery server checks the caller and the requested records. Your applications decide how to use permitted outputs."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Serve context</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Access + validity checks</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Your apps consume it</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Reusable asset</h3><p>Link approved source definitions to reusable records. Preserve native query execution.</p></article><article class="item"><h3>Clear product boundary</h3><p>Your applications consume context and control their own actions.</p></article></div><p class="slide-note">Proposed workflow. Human approval and access controls must work before context reaches a consumer.</p></section>
<section class="slide type-leadership-case" id="static-investment-case"><p class="eyebrow">Leadership · why fund this</p><h2>The product must earn back its overhead.</h2><p class="lead">Reuse the current stack. Fund a bounded pilot only when accepted value can repay the added setup and operations.</p><div class="leadership-case"><div class="investment-hurdle"><span class="design-label">ILLUSTRATIVE BREAK-EVEN REQUIREMENT · USD</span><strong class="hurdle-amount" data-hurdle="perAttempt" data-value="1.1333333333333333">$1.13</strong><p class="hurdle-unit">required benefit per attempt in year one</p><p class="hurdle-assumptions">1,000 accepted tasks/month · 80% accepted attempts · $1,000 monthly overhead · $5,000 setup over 12 months</p><div class="hurdle-support"><span data-hurdle="attempts" data-value="1250">1,250 attempts per month</span><span data-hurdle="monthlyRequired" data-value="1416.6666666666667">$1,416.67 required benefit per month</span><span data-hurdle="handlingMinutes" data-value="1.1333333333333333">1.13 handling minutes per attempt at $60/hour</span></div><p class="hurdle-definition">Benefit may come from lower operating cost or separately evidenced business value. Avoid counting the same benefit twice.</p></div><div class="executive-lenses"><article class="executive-lens" data-lens="cost" style="--sector:#000000"><h3>Cost</h3><p>Control cost per accepted task</p></article><article class="executive-lens" data-lens="performance" style="--sector:#6F7171"><h3>Performance</h3><p>Keep routine work responsive</p></article><article class="executive-lens" data-lens="accuracy" style="--sector:#EE001E"><h3>Accuracy</h3><p>Preserve the meaning behind the answer</p></article><article class="executive-lens" data-lens="trust" style="--sector:#C2001A"><h3>Trust</h3><p>Make control visible</p></article></div></div><p class="slide-note">Illustrative hurdle, not a price quote or forecast. The pilot must establish whether the required benefit is achievable.</p></section>
<section class="slide type-architecture" id="static-full-architecture"><p class="eyebrow">Developer view · the whole product</p><h2>From a submission to a permitted context output.</h2><p class="lead">One workflow connects human governance, stable identities, linked layers and secure delivery. Feedback starts a new submission.</p><figure class="mechanism-figure"><div class="diagram-viewport architecture-viewport" tabindex="0" role="region" aria-label="Full architecture workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1260 550" class="motion-diagram architecture-svg" role="img" aria-labelledby="context-architecture-3-title context-architecture-3-desc" preserveAspectRatio="xMidYMid meet"><title id="context-architecture-3-title">Full proposed Prefrontal product: submissions, human governance, canonical IDs, model harness, four layers, MCP delivery and feedback</title><desc id="context-architecture-3-desc">Preserve the original. Check schema, evidence and STE-inspired meaning. Human reviewers approve, reject or request changes to the exact version. Resolve canonical identities and versions. The harness asks the chosen model for typed decisions. It places approved records; new meaning returns through preparation and review. Organize Data, Metric, Ontology and Interpretation records in a controlled workspace. Derived objects retain their own IDs and references to approved input versions. Publish a complete validated release. The MCP server checks caller and record access. Consumers receive IDs, evidence and current versions, and control their own actions. Consumer feedback and new agent interpretations start submissions. Human approval never happens automatically. Expiry, withdrawal or access changes invalidate dependent outputs. Solid arrows: approved processing and delivery. Dashed arrows: revision or new submission. IDs connect layers; IDs grant no permission.</desc><defs><marker id="context-architecture-3-arrow" viewBox="0 0 10 10" refX="8" <section class="slide type-product-flow" id="static-existing-stack"><p class="eyebrow">Integration · reuse the current investment</p><h2>Govern context across your existing stack.</h2><p class="lead">Keep LookML as the approved metric source. Add portable context governance across Looker, Zenlytics and custom apps.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-4-title context-product-flow-4-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-4-title">Proposed integration with the current analytics stack</title><desc id="context-product-flow-4-desc">LookML defines dimensions, measures and relationships. Reference the approved model, Explore, view and field, or certified SQL. Keep native query execution. A metric passport links canonical identity, source revision, population, grain, unit, time window, exceptions and access. Human review approves the exact version. An adapter translates between contracts. Verify the actual API or MCP interface, caller identity, source permissions, expiry and revocation. An adapter does not inherit permissions automatically. Consumers receive permitted context through their verified interface. A custom app can support submission and review. The consumer controls its own query and action execution. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-4-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="existing-source" data-step="0" data-stage="LookML source" data-stage-detail="LookML defines dimensions, measures and relationships. Reference the approved model, Explore, view and field, or certified SQL. Keep native query execution."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">LookML source</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Existing definitions</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Approved Git revision</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-4-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-4-arrow)"/></g><g class="m-node m-stage" data-node="shared-record" data-step="1" data-stage="Context passport" data-stage-detail="A metric passport links canonical identity, source revision, population, grain, unit, time window, exceptions and access. Human review approves the exact version."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Context passport</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Proposed shared record</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Owner + version + evidence</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-4-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-4-arrow)"/></g><g class="m-node m-stage" data-node="verified-adapter" data-step="2" data-stage="Delivery adapter" data-stage-detail="An adapter translates between contracts. Verify the actual API or MCP interface, caller identity, source permissions, expiry and revocation. An adapter does not inherit permissions automatically."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Delivery adapter</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">API / MCP as supported</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Verify access + freshness</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-4-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-4-arrow)"/></g><g class="m-node m-stage" data-node="existing-consumer" data-step="3" data-stage="Existing consumers" data-stage-detail="Consumers receive permitted context through their verified interface. A custom app can support submission and review. The consumer controls its own query and action execution."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Existing consumers</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Looker + Zenlytics</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Custom apps</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Existing foundation</h3><p>Looker and LookML provide modeled analytics. Zenlytics and custom apps already serve your workflows.</p></article><article class="item"><h3>Proposed addition</h3><p>Shared record contracts, approval history and permitted delivery. Verify each adapter before use.</p></article></div><p class="slide-note">Reported current stack. Adapters and live integration remain unverified. Native query execution stays in Looker and the warehouse.</p></section>
<section class="slide type-submission" id="static-submission-template"><p class="eyebrow">Developer view · the input contract</p><h2>Make every submission reviewable.</h2><p class="lead">Use one structured envelope. Let the interface show it as a table. Keep the original source beside the proposed record.</p><div class="submission-layout"><div class="submission-table-region" tabindex="0" role="region" aria-label="Illustrative submission review table"><table class="submission-table"><caption>One proposed record · original evidence remains attached</caption><thead><tr><th scope="col">Field</th><th scope="col">Illustrative value</th><th scope="col">Reviewer check</th></tr></thead><tbody><tr><th scope="row">Submission + workspace</th><td>sub-017 · workspace-ops</td><td>Resolve scope and duplicates.</td></tr><tr><th scope="row">Kind + proposed meaning</th><td>Policy · keep reports for 30 days</td><td>Preserve the dispute exception.</td></tr><tr><th scope="row">Source + version</th><td>policy-v3 · paragraph 4</td><td>Read the original evidence.</td></tr><tr><th scope="row">Validity + uncertainty</th><td>From 2026-09-01 · no conflict declared</td><td>Verify dates and conflicting evidence.</td></tr><tr><th scope="row">Owner + access</th><td>Records owner · operations readers</td><td>Confirm reviewer and permitted audience.</td></tr><tr><th scope="row">Proposed links</th><td>Data / interpretation · input IDs</td><td>Review new IDs and derived meaning.</td></tr></tbody></table></div><div class="items"><article class="item"><h3>Preserve meaning</h3><p>Retain dates, units, negation, exceptions and uncertainty.</p></article><article class="item"><h3>Check before review</h3><p>Reject malformed input. Hold unsupported or conflicting claims.</p></article></div></div><p class="slide-note">Illustrative schema and record. Source content supplies evidence; it cannot change system policy.</p></section>
<section class="slide type-ste" id="static-meaning-preserving-ste"><p class="eyebrow">Developer view · the writing layer</p><h2>Clear language carries the original meaning.</h2><p class="lead">Use STE-inspired text to help people review context. Structured fields carry the checks that prose cannot enforce.</p><div class="ste-example"><div class="example-panel"><span class="label">ORIGINAL · ILLUSTRATIVE</span><p>Reports should be retained for a period of 30 days, except where a dispute remains open, in which case retention continues until the review concludes.</p></div><div class="example-panel"><span class="label">STE-INSPIRED VIEW</span><p>Keep reports for 30 days. If a dispute remains open, keep the report until the review ends.</p></div></div><div class="items"><article class="item"><h3>Keep two views</h3><p>Store the original text and the clearer review view.</p></article><article class="item"><h3>Keep every condition</h3><p>Preserve the 30-day rule and the dispute exception.</p></article><article class="item"><h3>Review the transformation</h3><p>A fluent rewrite can still change meaning.</p></article><article class="item"><h3>Use one term</h3><p>Use the same term for the same governed concept.</p></article></div><p class="slide-note">ASD-STE100 is a controlled writing specification. STE-inspired prose does not establish full compliance or factual correctness.</p></section>
<section class="slide type-governance" id="static-human-review-routes"><p class="eyebrow">Developer view · human authority</p><h2>Approval is a decision about an exact version.</h2><p class="lead">A responsible reviewer accepts, rejects or requests changes. The model can propose a record; it cannot approve its own meaning.</p><div class="items"><article class="item"><h3>Evidence review</h3><p>Check sources, dates, scope and unsupported statements.</p></article><article class="item"><h3>Meaning review</h3><p>Check definitions, units, assumptions and conflicts.</p></article><article class="item"><h3>Access review</h3><p>Confirm workspace, permitted audience and purpose.</p></article><article class="item"><h3>Version-bound approval</h3><p>Bind the reviewer decision to the submitted content hash.</p></article><article class="item"><h3>Derived claims</h3><p>Send new interpretation through preparation and review.</p></article><article class="item"><h3>Release ownership</h3><p>An accountable owner accepts release and pilot evidence.</p></article></div><p class="slide-note">HITL means human in the loop. All new or changed meaning requires review in this proposed admission workflow.</p></section>
<section class="slide type-contract" id="static-context-contract"><p class="eyebrow">Developer view · identity and version</p><h2>Stable identities connect every layer.</h2><p class="lead">A canonical ID names one governed object. A version names its state. Evidence references explain where that state came from.</p><div class="diagram-grid"><pre class="contract-card">canonical_id: interpretation:reports-retention
version: 3
workspace: operations
source: policy-v3, paragraph 4
valid_from: 2026-09-01
status: approved
claim: Keep reports for 30 days.
exception: Keep disputed reports
           until review ends.
input_refs: [data:reports-policy@3]
review: owner + exact content hash
access: operations-readers

IDs identify records. IDs grant no access.</pre><div class="items"><article class="item"><h3>Resolve identity</h3><p>Match the existing object before creating another canonical ID.</p></article><article class="item"><h3>Bind the semantic source</h3><p>For metrics, map the LookML model, Explore, view and measure to a Git revision.</p></article><article class="item"><h3>Version the meaning</h3><p>Keep the owner, approval, population, grain, unit, time window and exceptions with each version.</p></article><article class="item"><h3>Enforce permissions</h3><p>An ID locates a record. Recheck access for each consumer and source query.</p></article></div></div><p class="slide-note">A metric passport is a governed record of a metric definition and its source binding. Reference the approved LookML formula; avoid a competing copy.</p></section>
<section class="slide type-product-flow" id="static-semantic-layers"><p class="eyebrow">Developer view · the context workspace</p><h2>Separate facts, measures, concepts and interpretation.</h2><p class="lead">Each layer answers a different question. Canonical IDs join the layers inside a controlled workspace.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-5-title context-product-flow-5-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-5-title">Four semantic layers share governed identities</title><desc id="context-product-flow-5-desc">The Data layer records source facts, fields and values. It preserves source versions, dates and units. The Metric layer references the approved LookML measure or certified SQL revision. It records population, grain, unit and period, and links Data IDs. It does not replace native calculation logic. An ontology defines concepts and their relationships. It connects aliases to governed entity IDs. The Interpretation layer explains what the records mean under stated assumptions. Reviewers approve new derived claims. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-5-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="data" data-step="0" data-stage="Data" data-stage-detail="The Data layer records source facts, fields and values. It preserves source versions, dates and units."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Data</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Facts + source fields</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Values + evidence</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-5-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-5-arrow)"/></g><g class="m-node m-stage" data-node="metric" data-step="1" data-stage="Metric" data-stage-detail="The Metric layer references the approved LookML measure or certified SQL revision. It records population, grain, unit and period, and links Data IDs. It does not replace native calculation logic."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Metric</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Formula + population</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Unit + time window</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-5-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-5-arrow)"/></g><g class="m-node m-stage" data-node="ontology" data-step="2" data-stage="Ontology" data-stage-detail="An ontology defines concepts and their relationships. It connects aliases to governed entity IDs."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Ontology</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Concepts + relations</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Names + entity IDs</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-5-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-5-arrow)"/></g><g class="m-node m-stage" data-node="interpretation" data-step="3" data-stage="Interpretation" data-stage-detail="The Interpretation layer explains what the records mean under stated assumptions. Reviewers approve new derived claims."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Interpretation</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Meaning + assumptions</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Limits + review</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Semantic layers</h3><p>These are categories of meaning, not a requirement for four databases.</p></article><article class="item"><h3>Governed links</h3><p>Derived records reference approved input IDs and versions.</p></article></div><p class="slide-note">The arrows show relationships between categories. They do not require every submission to pass through all four layers.</p></section>
<section class="slide type-router" id="static-bounded-decision-router"><p class="eyebrow">Developer view · your model and harness</p><h2>Typed decisions. Human authority.</h2><p class="lead">A harness is application code that checks model outputs and limits allowed operations.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-router-6-title context-router-6-desc" class="motion-diagram motion-diagram-router" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-router-6-title">A chosen model returns typed decisions inside an externally governed harness</title><desc id="context-router-6-desc">The application asks a defined judgment. A chosen model returns Choice, yes/no or rubric Score. The harness checks the schema, evidence and allowed operations. A model output cannot grant permission or approve new meaning. Calibration requires evaluation. This is a proposed decision interface.</desc><defs><marker id="context-router-6-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker><marker id="context-router-6-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><rect x="16" y="118" width="488" height="251" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="64" y="108" width="392" height="24" rx="12" fill="var(--canvas, #eaf2f8)" stroke="none" stroke-width="1.5" /><text x="260" y="127" text-anchor="middle" fill="var(--ink, #000000)" font-family="Consolas, monospace" font-size="15" font-weight="600">GUARD POLICY · OUTSIDE THE MODEL</text><g class="m-edge m-stage" data-step="1"><path id="context-router-6-request-decision" d="M260 95 L260 152" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-router-6-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-router-6-decision-memory" d="M260 218 V247 H96 V283" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-router-6-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-router-6-decision-tool" d="M260 218 L260 283" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-router-6-arrow)"/></g><g class="m-edge m-stage" data-step="4"><path id="context-router-6-decision-reasoning" d="M260 218 V247 H424 V283" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-router-6-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Define the judgment" data-stage-detail="Specify the question, allowed output values and evidence. Keep policy authority outside the model."><rect x="111" y="34" width="298" height="61" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="260" y="59" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Defined judgment</text><text x="260" y="81" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Evidence · schema · allowed values</text></g><g class="m-node m-stage" data-step="1" data-stage="Bounded model interface" data-stage-detail="The chosen model returns a typed judgment. Application code validates the schema, evidence and allowed operations."><rect x="132" y="152" width="256" height="66" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="260" y="177" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Model + harness</text><text x="260" y="199" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Checked typed outputs</text></g><g class="m-node m-stage" data-step="2" data-stage="Choice signal" data-stage-detail="Select one label from an allowed list, such as a semantic layer. A selected label is a proposal rather than human approval."><rect x="27" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="96" y="308" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Choice</text><text x="96" y="330" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">One category</text></g><g class="m-node m-stage" data-step="3" data-stage="Yes/no signal" data-stage-detail="Judge a defined condition against evidence. Deterministic application policy still enforces authorization."><rect x="191" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="260" y="307" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Yes / no</text><text x="260" y="330" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Defined condition</text></g><g class="m-node m-stage" data-step="4" data-stage="Rubric score" data-stage-detail="Rate a property against stated criteria. A score is not automatically a probability. Reported probabilities require calibration checks."><rect x="355" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="424" y="308" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Rubric score</text><text x="424" y="330" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Stated criteria</text></g><text x="260" y="362" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">A model cannot grant itself permission.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Choice</h3><p>Select one category from an allowed list.</p></article><article class="item"><h3>Yes / no</h3><p>Judge a defined condition. Policy checks still enforce access.</p></article><article class="item"><h3>Rubric score</h3><p>Rate a property against stated criteria. A score is not a probability.</p></article><article class="item"><h3>Calibration</h3><p>Check reported probabilities against observed outcomes before using risk thresholds.</p></article></div></div><p class="slide-note">For familiar questions, deliver certified query references for native execution after access checks. New questions use expert drafts and review. The three decision types remain proposed; JEV parity and calibration are unverified.</p></section>
<section class="slide type-memory" id="static-layered-memory"><p class="eyebrow">Developer view · durable memory</p><h2>Keep records durable. Keep task context bounded.</h2><p class="lead">A context vault is a workspace with controlled records and access rules. A consumer receives a permitted view, not the whole vault.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-memory-7-title context-memory-7-desc" class="motion-diagram motion-diagram-memory" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-memory-7-title">Four memory layers with correction and invalidation</title><desc id="context-memory-7-desc">Original sources supply structured memory, rebuildable indexes and summaries, and the working task context. Correction or invalidation starts by checking the source, preserves original records, and rebuilds affected derived views under existing access and retention rules. Authority applies at every layer; a rebuilt view cannot grant permission. This is an unimplemented architecture proposal.</desc><defs><marker id="context-memory-7-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker><marker id="context-memory-7-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><text x="260" y="26" text-anchor="middle" fill="var(--ink, #000000)" font-family="Consolas, monospace" font-size="15" font-weight="600">AUTHORITY ENFORCED AT EVERY LAYER</text><path d="M48 53 H31 V351 H48" fill="none" stroke="var(--gold, #efb94e)" stroke-width="3"/><g class="m-edge m-stage" data-step="1"><path id="context-memory-7-source-structured" d="M246 298 L246 271" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-memory-7-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-memory-7-structured-views" d="M246 216 L246 189" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-memory-7-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-memory-7-views-context" d="M246 134 L246 107" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-memory-7-arrow)"/></g><g class="m-edge m-stage" data-step="4"><path id="context-memory-7-correction" d="M420 80 H487 V326 H420" fill="none" stroke="var(--gold, #efb94e)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#context-memory-7-gold)"/></g><g class="m-node m-stage" data-step="0" data-stage="Original sources" data-stage-detail="Keep permitted source records under explicit retention rules. Preserve their versions to check generated memory."><rect x="71" y="298" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="245.5" y="323" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Original sources</text><text x="245.5" y="345" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Owned records · versions</text></g><g class="m-node m-stage" data-step="1" data-stage="Structured memory" data-stage-detail="Link claims, dates, status, and unresolved conflicts to source evidence. A model&apos;s assertion is not proof."><rect x="71" y="216" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="245.5" y="241" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Structured memory</text><text x="245.5" y="263" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Claims · provenance · status</text></g><g class="m-node m-stage" data-step="2" data-stage="Rebuildable views" data-stage-detail="Derive indexes, summaries, and caches from structured memory. Invalidate them when sources or access change."><rect x="71" y="134" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="245.5" y="159" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Rebuildable views</text><text x="245.5" y="181" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Indexes · summaries · caches</text></g><g class="m-node m-stage" data-step="3" data-stage="Working context" data-stage-detail="Select permitted evidence for the current goal and constraints. Keep it within the model&apos;s input limit."><rect x="71" y="52" width="349" height="55" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="245.5" y="77" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Working context</text><text x="245.5" y="99" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Goal + selected evidence</text></g><text x="450" y="203" transform="rotate(90 450 203)" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15">Correct / invalidate</text><g class="m-node m-stage" data-step="4" data-stage="Correct or invalidate" data-stage-detail="Check the source while preserving original records, then rebuild affected derived views under existing access and retention rules."><rect x="424" y="276" width="80" height="32" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" /><text x="464" y="289" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="500">Check source</text><text x="464" y="301" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="500">Rebuild views</text></g><text x="260" y="372" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Rebuilding a view cannot grant permission.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Canonical records</h3><p>Keep sources, approved versions, status and review history.</p></article><article class="item"><h3>Derived views</h3><p>Build search indexes, graphs or caches when a use case needs them.</p></article><article class="item"><h3>Working context</h3><p>Load relevant subject matter expert (SME) knowledge within the request budget.</p></article><article class="item"><h3>Corrections</h3><p>Invalidate dependent views when inputs expire, change or lose access.</p></article></div></div><p class="slide-note">The semantic layers describe meaning. This storage lifecycle describes persistence and retrieval. A cache is never an approval authority.</p></section>
<section class="slide type-product-flow" id="static-secure-delivery"><p class="eyebrow">Developer view · output contract</p><h2>Deliver context through an explicit access boundary.</h2><p class="lead">The MCP server exposes permitted context. The server must enforce the product’s record and workspace policies.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-8-title context-product-flow-8-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-8-title">A context request crosses explicit access checks</title><desc id="context-product-flow-8-desc">Authenticate the caller. Resolve the requested workspace and purpose. Authentication establishes identity. Authorization decides which records the caller may access. Check current approval, expiry and withdrawal. Return only permitted records and evidence references. Include version, validity and unresolved limits. Enforce a response budget. MCP means Model Context Protocol. It connects the server to consuming applications. Application actions remain under consumer authority. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-8-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="identify" data-step="0" data-stage="Identify caller" data-stage-detail="Authenticate the caller. Resolve the requested workspace and purpose. Authentication establishes identity."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Identify caller</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">User + workspace</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Purpose + request</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-8-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-8-arrow)"/></g><g class="m-node m-stage" data-node="authorize" data-step="1" data-stage="Authorize records" data-stage-detail="Authorization decides which records the caller may access. Check current approval, expiry and withdrawal."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Authorize records</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Per-record permissions</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Current approved versions</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-8-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-8-arrow)"/></g><g class="m-node m-stage" data-node="assemble" data-step="2" data-stage="Assemble output" data-stage-detail="Return only permitted records and evidence references. Include version, validity and unresolved limits. Enforce a response budget."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Assemble output</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">IDs + versions + evidence</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Bounded context bundle</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-8-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-8-arrow)"/></g><g class="m-node m-stage" data-node="consume" data-step="3" data-stage="Deliver through MCP" data-stage-detail="MCP means Model Context Protocol. It connects the server to consuming applications. Application actions remain under consumer authority."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Deliver through MCP</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Context exchange</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Independent consumer</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Structured output</h3><p>Return IDs, versions, evidence, validity and unresolved limits.</p></article><article class="item"><h3>Access at use</h3><p>Recheck permissions for each resource or tool request.</p></article></div><p class="slide-note">MCP defines context exchange. Authentication and application authorization still require implementation. The protocol alone does not make a product secure.</p></section>
<section class="slide type-product-flow" id="static-controlled-evolution"><p class="eyebrow">Developer view · adapting to new technology</p><h2>Keep the knowledge. Qualify each replacement.</h2><p class="lead">Versioned contracts let us evaluate new models, retrieval systems and interfaces while preserving governed context.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-9-title context-product-flow-9-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-9-title">Replace components through a qualification gate</title><desc id="context-product-flow-9-desc">Treat governed records and their contracts as durable assets. A new adapter must preserve meaning, evidence and access rules. Introduce a candidate behind the same interface. Record its version and configuration. Do not assume a familiar interface preserves behavior. Evaluate the candidate on held-out cases, boundary failures and complete task cost. Keep development cases separate. Release only after the owner accepts the evidence. Retain the prior compatible release on failure. Invalidate affected caches when dependencies change. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-9-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="contract" data-step="0" data-stage="Keep the contract" data-stage-detail="Treat governed records and their contracts as durable assets. A new adapter must preserve meaning, evidence and access rules."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Keep the contract</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">IDs + meaning + evidence</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Access + version rules</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-9-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-9-arrow)"/></g><g class="m-node m-stage" data-node="candidate" data-step="1" data-stage="Connect a candidate" data-stage-detail="Introduce a candidate behind the same interface. Record its version and configuration. Do not assume a familiar interface preserves behavior."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Connect a candidate</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Model, index or adapter</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Versioned configuration</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-9-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-9-arrow)"/></g><g class="m-node m-stage" data-node="evaluate" data-step="2" data-stage="Compare outcomes" data-stage-detail="Evaluate the candidate on held-out cases, boundary failures and complete task cost. Keep development cases separate."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Compare outcomes</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Held-out cases + failures</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Full cost + quality</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-9-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-9-arrow)"/></g><g class="m-node m-stage" data-node="release" data-step="3" data-stage="Release or retain" data-stage-detail="Release only after the owner accepts the evidence. Retain the prior compatible release on failure. Invalidate affected caches when dependencies change."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Release or retain</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Owner acceptance</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Rollback + invalidation</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Durable asset</h3><p>Meaning, evidence and approved identities survive component changes.</p></article><article class="item"><h3>Qualification cost</h3><p>Budget evaluation, migration, rollback and maintenance.</p></article></div><p class="slide-note">Adaptability is a design objective. No architecture can guarantee that future technology will never surpass it.</p></section>
<section class="slide type-problem" id="static-operating-cost"><p class="eyebrow">The investment · where the money goes</p><h2>Count the whole operating process.</h2><p class="lead">A context layer can add review, storage and maintenance cost. It creates value only when accepted outcomes repay that cost.</p><div class="items"><article class="item"><h3>Setup</h3><p>Record contract, source mapping, adapters, deployment and acceptance tests.</p></article><article class="item"><h3>Recurring platform</h3><p>Tokens, warehouse queries, storage, tools, delivery and monitoring.</p></article><article class="item"><h3>Human operations</h3><p>Submission review, conflict resolution, corrections and incident handling.</p></article><article class="item"><h3>Maintenance</h3><p>Licenses, seats, source updates, access changes, upgrades and recovery.</p></article></div><p class="slide-note">Separate existing allocated costs from incremental spending. Include both consistently in the baseline and candidate. Count each cost once.</p></section>
<section class="slide type-governance" id="static-cost-discipline"><p class="eyebrow">Cost design · qualify each saving</p><h2>Spend less only when the accepted result stays sound.</h2><p class="lead">The updated plan supplies optimization candidates. Test them against the current workflow before claiming a benefit.</p><div class="items"><article class="item"><h3>Reuse approved code or SQL</h3><p>Use deterministic logic for defined rules. Keep certified queries unchanged. Review expert drafts before reuse.</p></article><article class="item"><h3>Bound context and output</h3><p>Limit permitted context, tokens, output, steps and retries. Batch work only when its deadline permits.</p></article><article class="item"><h3>Reuse valid context</h3><p>Check cache version, expiry, access and invalidation. Measure hit rate, writes, reads and storage.</p></article><article class="item"><h3>Qualify the model route</h3><p>Use a smaller model only if it passes the task gates. Escalate uncertain results.</p></article><article class="item"><h3>Control warehouse cost</h3><p>Estimate query work. For BigQuery on-demand queries, test maximum bytes billed. A row limit alone may not bound scans.</p></article><article class="item"><h3>Count every cost once</h3><p>Track tokens, queries, seats, licenses and human review. Assign budget owners. Separate existing and incremental costs.</p></article></div><p class="slide-note">These are proposed controls. The supplied v6 best practices remain unapproved team guidance. No percentage saving, vendor price or achieved product improvement is claimed.</p></section>
<section class="slide type-pitch-calculator" id="static-value-assumptions"><p class="eyebrow">The investment · editable worksheet</p><h2>Change the assumptions. Inspect the return.</h2><p class="lead">Compare the same accepted-task target. The starting example assumes no improvement and therefore shows added cost.</p><div class="business-case-static"><div class="business-case-grid"><table class="assumption-table"><caption>Invented example assumptions · USD</caption><tbody><tr><th scope="row">Accepted tasks / month</th><td data-assumption="target" data-value="1000">1000</td></tr><tr><th scope="row">Handling cost / hour ($)</th><td data-assumption="hourly" data-value="60">60</td></tr><tr><th scope="row">One-time setup ($)</th><td data-assumption="setup" data-value="5000">5000</td></tr><tr><th scope="row">Current digital cost / attempt ($)</th><td data-assumption="baselineCost" data-value="1.2">1.2</td></tr><tr><th scope="row">Proposed digital cost / attempt ($)</th><td data-assumption="candidateCost" data-value="1.2">1.2</td></tr><tr><th scope="row">Current handling minutes / attempt</th><td data-assumption="baselineMinutes" data-value="4">4</td></tr><tr><th scope="row">Proposed handling minutes / attempt</th><td data-assumption="candidateMinutes" data-value="4">4</td></tr><tr><th scope="row">Current accepted attempts (%)</th><td data-assumption="baselineAcceptance" data-value="80">80</td></tr><tr><th scope="row">Proposed accepted attempts (%)</th><td data-assumption="candidateAcceptance" data-value="80">80</td></tr><tr><th scope="row">Current fixed cost / month ($)</th><td data-assumption="baselineFixed" data-value="0">0</td></tr><tr><th scope="row">Proposed fixed cost / month ($)</th><td data-assumption="candidateFixed" data-value="1000">1000</td></tr></tbody></table><div class="business-case-results" data-outcome="higher-cost"><div class="business-case-result"><span>Current recurring / month</span><strong data-result="baseline" data-value="6500">$6,500.00</strong></div><div class="business-case-result"><span>Proposed recurring / month</span><strong data-result="candidate" data-value="7500">$7,500.00</strong></div><div class="business-case-result"><span>Recurring difference / month</span><strong data-result="difference" data-value="-1000">-$1,000.00</strong></div><div class="business-case-result"><span>Year-one net difference</span><strong data-result="yearOne" data-value="-17000">-$17,000.00</strong></div><div class="business-case-result"><span>Current cost / accepted task</span><strong data-result="baselineUnit" data-value="6.5">$6.50</strong></div><div class="business-case-result"><span>Proposed cost / accepted task</span><strong data-result="candidateUnit" data-value="7.5">$7.50</strong></div></div></div><p class="business-case-definition">Compare the same monthly target of accepted tasks. Acceptance means the owner confirms the task and quality criteria.</p><p class="business-case-formula">Attempts = accepted target / acceptance rate. Recurring cost = attempts × (digital cost + handling minutes × hourly rate / 60) + fixed cost. Year-one net = 12 × monthly difference − setup.</p><p class="business-case-scope">Digital cost includes model tokens, retrieval, warehouse queries, tools and variable infrastructure per attempt. Handling includes review, rework and escalation. Fixed cost includes seats, licenses, adapters and operations. Compare existing and incremental costs consistently; count each once. Setup stays separate.</p><p class="business-case-note">Invented example assumptions, not a quote or measured savings. The neutral starting case assumes no improvement. Rates and workload stay constant for the annual estimate. Validate the inputs and all quality gates.</p></div><p class="slide-note">Invented assumptions in USD. Test a positive case and a higher-cost case. Financial results never override quality or permission gates.</p></section>
<section class="slide type-pitch-proof" id="static-pilot-acceptance"><p class="eyebrow">The investment · decision evidence</p><h2>Agree the proof before paying for scale.</h2><p class="lead">Run a baseline and a candidate on the same workload. Use held-out cases and complete cost evidence.</p><div class="proof-grid"><article class="proof-card" data-lens="cost"><h3>Cost</h3><h4>Measure</h4><p>Recurring cost per accepted task; one-time setup; maintenance effort.</p><h4>Trial</h4><p>Compare the same accepted-task target. Record token and query charges, allocated and incremental licenses, adapters, operations and human handling without double counting.</p><h4>Expansion gate</h4><p class="proof-decision">Expand only when the agreed economic case holds after full cost readback.</p></article><article class="proof-card" data-lens="performance"><h3>Performance</h3><h4>Measure</h4><p>Median and p95 completion time; throughput; retries; recovery time.</p><h4>Trial</h4><p>Measure submit-to-approved-delivery latency and consuming-task completion separately. Include review queues and p95 at agreed load.</p><h4>Expansion gate</h4><p class="proof-decision">Meet the owner’s service target without hiding failed, queued or held tasks.</p></article><article class="proof-card" data-lens="accuracy"><h3>Accuracy</h3><h4>Measure</h4><p>Task acceptance; source correctness; stale/conflict detection; abstention.</p><h4>Trial</h4><p>Test held-out questions against approved LookML definitions and owner-reviewed gold truth. Check grain, unit, time window and exceptions.</p><h4>Expansion gate</h4><p class="proof-decision">Meet agreed quality gates. Investigate failures before expanding scope.</p></article><article class="proof-card" data-lens="trust"><h3>Trust</h3><h4>Measure</h4><p>Scope isolation; permission enforcement; evidence coverage; reviewer decisions.</p><h4>Trial</h4><p>Test source and consumer access, revoked permissions, hostile instructions, cross-vault retrieval and exact-version audit readback.</p><h4>Expansion gate</h4><p class="proof-decision">Hold release for a material access failure. Assess user confidence separately.</p></article></div><p class="slide-note">Proposed pilot measurements. No product result has been measured. An accepted task passes owner criteria. p95 covers 95% of measured completion times.</p></section>
<section class="slide type-upgrade" id="static-upgrade-example"><p class="eyebrow">The demo · contract rehearsal</p><h2>See what a component change must preserve.</h2><p class="lead">Run four browser scenarios on one record. Inspect evidence loss, exception loss and expanded permission.</p><div class="diagram-grid"><pre class="contract-card">canonical_id: interpretation:reports-retention
version: 3
workspace: operations
source: policy-v3, paragraph 4
valid_from: 2026-09-01
status: approved
claim: Keep reports for 30 days.
exception: Keep disputed reports
           until review ends.
input_refs: [data:reports-policy@3]
