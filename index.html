<section class="slide type-product-flow" id="static-product-overview"><p class="eyebrow">Leadership · what you would buy</p><h2>One governed context service. Many consumers.</h2><p class="lead">The product accepts submissions, governs meaning, organizes linked records and delivers permitted context.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-3-title context-product-flow-3-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-3-title">The product in one view</title><desc id="context-product-flow-3-desc">People and agent loops submit evidence in one structured template. The original source remains available. A responsible human checks meaning, evidence and access. Approval binds to the exact version. The context agent organizes approved records. Stable IDs connect the layers. New meaning returns to review. The delivery server checks the caller and the requested records. Your applications decide how to use permitted outputs. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-3-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="submit" data-step="0" data-stage="Submit context" data-stage-detail="People and agent loops submit evidence in one structured template. The original source remains available."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Submit context</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Evidence + owner</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">One review template</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-3-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-3-arrow)"/></g><g class="m-node m-stage" data-node="approve" data-step="1" data-stage="Approve meaning" data-stage-detail="A responsible human checks meaning, evidence and access. Approval binds to the exact version."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Approve meaning</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Human review</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Exact record version</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-3-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-3-arrow)"/></g><g class="m-node m-stage" data-node="organize" data-step="2" data-stage="Build linked layers" data-stage-detail="The context agent organizes approved records. Stable IDs connect the layers. New meaning returns to review."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Build linked layers</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-siz <section class="slide type-leadership-case" id="static-investment-case"><p class="eyebrow">Leadership · why fund this</p><h2>The product must earn back its overhead.</h2><p class="lead">Reuse the current stack. Fund a bounded pilot only when accepted value can repay the added setup and operations.</p><div class="leadership-case"><div class="investment-hurdle"><span class="design-label">ILLUSTRATIVE BREAK-EVEN REQUIREMENT · USD</span><strong class="hurdle-amount" data-hurdle="perAttempt" data-value="1.1333333333333333">$1.13</strong><p class="hurdle-unit">required benefit per attempt in year one</p><p class="hurdle-assumptions">1,000 accepted tasks/month · 80% accepted attempts · $1,000 monthly overhead · $5,000 setup over 12 months</p><div class="hurdle-support"><span data-hurdle="attempts" data-value="1250">1,250 attempts per month</span><span data-hurdle="monthlyRequired" data-value="1416.6666666666667">$1,416.67 required benefit per month</span><span data-hurdle="handlingMinutes" data-value="1.1333333333333333">1.13 handling minutes per attempt at $60/hour</span></div><p class="hurdle-definition">Benefit may come from lower operating cost or separately evidenced business value. Avoid counting the same benefit twice.</p></div><div class="executive-lenses"><article class="executive-lens" data-lens="cost" style="--sector:#000000"><h3>Cost</h3><p>Control cost per accepted task</p></article><article class="executive-lens" data-lens="performance" style="--sector:#6F7171"><h3>Performance</h3><p>Keep routine work responsive</p></article><article class="executive-lens" data-lens="accuracy" style="--sector:#EE001E"><h3>Accuracy</h3><p>Preserve the meaning behind the answer</p></article><article class="executive-lens" data-lens="trust" style="--sector:#C2001A"><h3>Trust</h3><p>Make control visible</p></article></div></div><p class="slide-note">Illustrative hurdle, not a price quote or forecast. The pilot must establish whether the required benefit is achievable.</p></section>
<section class="slide type-architecture" id="static-full-architecture"><p class="eyebrow">Developer view · the whole product</p><h2>From a submission to a permitted context output.</h2><p class="lead">One workflow connects human governance, stable identities, linked layers and secure delivery. Feedback starts a new submission.</p><figure class="mechanism-figure"><div class="diagram-viewport architecture-viewport" tabindex="0" role="region" aria-label="Full architecture workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1260 550" class="motion-diagram architecture-svg" role="img" aria-labelledby="context-architecture-4-title context-architecture-4-desc" preserveAspectRatio="xMidYMid meet"><title id="context-architecture-4-title">Full proposed Prefrontal product: submissions, human governance, canonical IDs, model harness, four layers, MCP delivery and feedback</title><desc id="context-architecture-4-desc">Preserve the original. Check schema, evidence and STE-inspired meaning. Human reviewers approve, reject or request changes to the exact version. Resolve canonical identities and versions. The harness asks the chosen model for typed decisions. It places approved records; new meaning returns through preparation and review. Organize Data, Metric, Ontology and Interpretation records in a controlled workspace. Derived objects retain their own IDs and references to approved input versions. Publish a complete validated release. The MCP server checks caller and record access. Consumers receive IDs, evidence and current versions, and control their own actions. Consumer feedback and new agent interpretations start submissions. Human approval never happens automatically. Expiry, withdrawal or access changes invalidate dependent outputs. Solid arrows: approved processing and delivery. Dashed arrows: revision or new submission. IDs connect layers; IDs grant no permission.</desc><defs><marker id="context-architecture-4-arrow" viewBox="0 0 10 10" refX="8" <section class="slide type-product-flow" id="static-existing-stack"><p class="eyebrow">Integration · reuse the current investment</p><h2>Govern context across your existing stack.</h2><p class="lead">Keep LookML as the approved metric source. Add portable context governance across Looker, Zenlytics and custom apps.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-5-title context-product-flow-5-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-5-title">Proposed integration with the current analytics stack</title><desc id="context-product-flow-5-desc">LookML defines dimensions, measures and relationships. Reference the approved model, Explore, view and field, or certified SQL. Keep native query execution. A metric passport links canonical identity, source revision, population, grain, unit, time window, exceptions and access. Human review approves the exact version. An adapter translates between contracts. Verify the actual API or MCP interface, caller identity, source permissions, expiry and revocation. An adapter does not inherit permissions automatically. Consumers receive permitted context through their verified interface. A custom app can support submission and review. The consumer controls its own query and action execution. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-5-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="existing-source" data-step="0" data-stage="LookML source" data-stage-detail="LookML defines dimensions, measures and relationships. Reference the approved model, Explore, view and field, or certified SQL. Keep native query execution."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">LookML source</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Existing definitions</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Approved Git revision</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-5-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-5-arrow)"/></g><g class="m-node m-stage" data-node="shared-record" data-step="1" data-stage="Context passport" data-stage-detail="A metric passport links canonical identity, source revision, population, grain, unit, time window, exceptions and access. Human review approves the exact version."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Context passport</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Proposed shared record</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Owner + version + evidence</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-5-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-5-arrow)"/></g><g class="m-node m-stage" data-node="verified-adapter" data-step="2" data-stage="Delivery adapter" data-stage-detail="An adapter translates between contracts. Verify the actual API or MCP interface, caller identity, source permissions, expiry and revocation. An adapter does not inherit permissions automatically."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Delivery adapter</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">API / MCP as supported</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Verify access + freshness</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-5-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-5-arrow)"/></g><g class="m-node m-stage" data-node="existing-consumer" data-step="3" data-stage="Existing consumers" data-stage-detail="Consumers receive permitted context through their verified interface. A custom app can support submission and review. The consumer controls its own query and action execution."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Existing consumers</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Looker + Zenlytics</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Custom apps</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Existing foundation</h3><p>Looker and LookML provide modeled analytics. Zenlytics and custom apps already serve your workflows.</p></article><article class="item"><h3>Proposed addition</h3><p>Shared record contracts, approval history and permitted delivery. Verify each adapter before use.</p></article></div><p class="slide-note">Reported current stack. Adapters and live integration remain unverified. Native query execution stays in Looker and the warehouse.</p></section>
<section class="slide type-infographic has-infographic" id="static-context-capabilities"><p class="eyebrow">Product scope · eight context capabilities</p><h2>Eight capabilities. One context service.</h2><p class="lead">The supplied plan names eight capabilities. These diagrams show how the proposed product would support them.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 340" class="motion-diagram infographic-svg infographic-matrix" role="img" aria-labelledby="context-infographic-6-title context-infographic-6-desc" preserveAspectRatio="xMidYMid meet"><title id="context-infographic-6-title">Eight capabilities in the supplied context plan</title><desc id="context-infographic-6-desc">Proposed product support. Platform and operational acceptance remain to verify. Reference one approved metric definition. Link it to canonical identity, owner and source revision. Deliver approved query references for native execution. Recheck authorization, data validity and execution conditions. Load relevant subject matter expert (SME) knowledge within the request budget. Route defined work through a qualified path. Escalate new or uncertain meaning for review. Check delivery permissions. The consumer must enforce its own source access and execution policies. Keep standing quality tests against owner-approved reference answers. A test pass supports only its tested scope. Preserve source, reviewer, date and exact version. Read back persistent evidence across the workflow. Reviewed learning: new drafts return to human review before an approved release.</desc><defs><marker id="context-infographic-6-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--ink, #000000)"/></marker></defs><g class="m-node m-stage" data-node="definition" data-step="0" data-stage="One definiti <section class="slide type-submission" id="static-submission-template"><p class="eyebrow">Developer view · the input contract</p><h2>Make every submission reviewable.</h2><p class="lead">Use one structured envelope. Let the interface show it as a table. Keep the original source beside the proposed record.</p><div class="submission-layout"><div class="submission-table-region" tabindex="0" role="region" aria-label="Illustrative submission review table"><table class="submission-table"><caption>One proposed record · original evidence remains attached</caption><thead><tr><th scope="col">Field</th><th scope="col">Illustrative value</th><th scope="col">Reviewer check</th></tr></thead><tbody><tr><th scope="row">Submission + workspace</th><td>sub-017 · workspace-ops</td><td>Resolve scope and duplicates.</td></tr><tr><th scope="row">Kind + proposed meaning</th><td>Policy · keep reports for 30 days</td><td>Preserve the dispute exception.</td></tr><tr><th scope="row">Source + version</th><td>policy-v3 · paragraph 4</td><td>Read the original evidence.</td></tr><tr><th scope="row">Validity + uncertainty</th><td>From 2026-09-01 · no conflict declared</td><td>Verify dates and conflicting evidence.</td></tr><tr><th scope="row">Owner + access</th><td>Records owner · operations readers</td><td>Confirm reviewer and permitted audience.</td></tr><tr><th scope="row">Proposed links</th><td>Data / interpretation · input IDs</td><td>Review new IDs and derived meaning.</td></tr></tbody></table></div><div class="items"><article class="item"><h3>Preserve meaning</h3><p>Retain dates, units, negation, exceptions and uncertainty.</p></article><article class="item"><h3>Check before review</h3><p>Reject malformed input. Hold unsupported or conflicting claims.</p></article></div></div><p class="slide-note">Illustrative schema and record. Source content supplies evidence; it cannot change system policy.</p></section>
<section class="slide type-ste has-infographic" id="static-meaning-preserving-ste"><p class="eyebrow">Developer view · the writing layer</p><h2>Clear language carries the original meaning.</h2><p class="lead">This presentation uses STE-inspired writing. The review view preserves the original rule and its exception.</p><div class="ste-example"><div class="example-panel"><span class="label">ORIGINAL · ILLUSTRATIVE</span><p>Reports should be retained for a period of 30 days, except where a dispute remains open, in which case retention continues until the review concludes.</p></div><div class="example-panel"><span class="label">STE-INSPIRED VIEW</span><p>You should keep reports for 30 days. If a dispute remains open, you should keep the report until the review ends.</p></div></div><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram infographic-svg infographic-matrix" role="img" aria-labelledby="context-infographic-7-title context-infographic-7-desc" preserveAspectRatio="xMidYMid meet"><title id="context-infographic-7-title">Four writing rules used in this deck</title><desc id="context-infographic-7-desc">STE-inspired writing supports review. It does not prove correctness or full compliance. Keep sentences short. Preserve necessary conditions and uncertainty. Keep the original source beside the review view. Use active voice. Name the person or component that performs each action. Use the same term for the same concept. Define technical terms when the audience needs them. Give each sentence one main idea. Use diagrams to show relationships and sequence.</desc><defs><marker id="context-infographic-7-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--ink, #000000)"/></marker></defs><g class="m-node m-stage" data-node="short" data-step="0" data-stage="Short sentences" data-stage-detail="Keep sentences short. Preserve necessary conditions and uncertainty. Keep the original source beside the review view."><rect x="20" y="15" width="225" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(36 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h12l6 6v20H7z M19 3v7h6 M11 15h10 M11 20h10 M11 25h7"/></g><text x="74" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Short sentences</text><text x="36" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Keep the report.</text><text x="36" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Keep the condition.</text></g><g class="m-node m-stage" data-node="active" data-step="1" data-stage="Active verbs" data-stage-detail="Use active voice. Name the person or component that performs each action."><rect x="265" y="15" width="225" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(281 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="9" r="6"/><path d="M5 29v-5c0-11 22-11 22 0v5 M10 29v-6 M22 29v-6"/></g><text x="319" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Active verbs</text><text x="281" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Name who acts.</text><text x="281" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">The reviewer approves.</text></g><g class="m-node m-stage" data-node="terms" data-step="2" data-stage="Consistent terms" data-stage-detail="Use the same term for the same concept. Define technical terms when the audience needs them."><rect x="510" y="15" width="225" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(526 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m13 10 4-4a7 7 0 0 1 10 10l-4 4 M19 22l-4 4A7 7 0 0 1 5 16l4-4 M11 21l10-10"/></g><text x="564" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Consistent terms</text><text x="526" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">One concept.</text><text x="526" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">One term.</text></g><g class="m-node m-stage" data-node="idea" data-step="3" data-stage="One main idea" data-stage-detail="Give each sentence one main idea. Use diagrams to show relationships and sequence."><rect x="755" y="15" width="225" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(771 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="24" height="24" rx="4"/><path d="m9 16 5 5 10-11"/></g><text x="809" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">One main idea</text><text x="771" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">State the rule.</text><text x="771" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Then state its exception.</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><details class="presenter-detail"><summary>Presenter detail</summary><div class="items"><article class="item"><h3>Keep two views</h3><p>Store the original text and the clearer review view.</p></article><article class="item"><h3>Keep every condition</h3><p>Preserve the 30-day rule and the dispute exception.</p></article><article class="item"><h3>Review the transformation</h3><p>A fluent rewrite can still change meaning.</p></article><article class="item"><h3>Use one term</h3><p>Use the same term for the same governed concept.</p></article></div></details><p class="slide-note">Presenter statement: “I used STE-inspired writing in this presentation. Each sentence carries one main idea. Full ASD-STE100 compliance has not been checked.”</p></section>
<section class="slide type-governance has-infographic" id="static-human-review-routes"><p class="eyebrow">Developer view · human authority</p><h2>Humans approve the exact version.</h2><p class="lead">The agent proposes a record. The reviewer checks evidence, meaning and access before approval.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 340" class="motion-diagram infographic-svg infographic-matrix" role="img" aria-labelledby="context-infographic-8-title context-infographic-8-desc" preserveAspectRatio="xMidYMid meet"><title id="context-infographic-8-title">Human review checks meaning before admission</title><desc id="context-infographic-8-desc">All new or changed meaning requires review. Approval binds to an exact version. Check sources, dates, scope and unsupported statements. Check definitions, units, assumptions and conflicts. Confirm workspace, permitted audience and purpose. Bind the reviewer decision to the submitted content hash. Send new interpretation through preparation and review. An accountable owner accepts release and pilot evidence.</desc><defs><marker id="context-infographic-8-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--ink, #000000)"/></marker></defs><g class="m-node m-stage" data-node="evidence" data-step="0" data-stage="Evidence" data-stage-detail="Check sources, dates, scope and unsupported statements."><rect x="20" y="15" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(36 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h12l6 6v20H7z M19 3v7h6 M11 15h10 M11 20h10 M11 25h7"/></g><text x="74" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Evidence</text><text x="36" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Source + date + scope</text><text x="36" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Unsupported claims</text></g><g class="m-node m-stage" data-node="meaning" data-step="1" data-stage="Meaning" data-stage-detail="Check definitions, units, assumptions and conflicts."><rect x="350" y="15" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(366 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="24" height="24" rx="4"/><path d="m9 16 5 5 10-11"/></g><text x="404" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Meaning</text><text x="366" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Units + assumptions</text><text x="366" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Conflicts + exceptions</text></g><g class="m-node m-stage" data-node="access" data-step="2" data-stage="Access" data-stage-detail="Confirm workspace, permitted audience and purpose."><rect x="680" y="15" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(696 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3 27 7v9c0 6-5 10- ke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 11A12 12 0 0 0 5 8L2 12 M2 4v8h8 M6 21a12 12 0 0 0 21 3l3-4 M30 28v-8h-8"/></g><text x="404" y="218" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">New claims</text><text x="366" y="251" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Prepare the draft</text><text x="366" y="274" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Return to review</text></g><g class="m-node m-stage" data-node="release" data-step="5" data-stage="Release owner" data-stage-detail="An accountable owner accepts release and pilot evidence."><rect x="680" y="185" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(696 197) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="9" r="6"/><path d="M5 29v-5c0-11 22-11 22 0v5 M10 29v-6 M22 29v-6"/></g><text x="734" y="218" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Release owner</text><text x="696" y="251" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Accept release evidence</text><text x="696" y="274" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Accountable decision</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><details class="presenter-detail"><summary>Presenter detail</summary><div class="items"><article class="item"><h3>Evidence review</h3><p>Check sources, dates, scope and unsupported statements.</p></article><article class="item"><h3>Meaning review</h3><p>Check definitions, units, assumptions and conflicts.</p></article><article class="item"><h3>Access review</h3><p>Confirm workspace, permitted audience and purpose.</p></article><article class="item"><h3>Version-bound approval</h3><p>Bind the reviewer decision to the submitted content hash.</p></article><article class="item"><h3>Derived claims</h3><p>Send new interpretation through preparation and review.</p></article><article class="item"><h3>Release ownership</h3><p>An accountable owner accepts release and pilot evidence.</p></article></div></details><p class="slide-note">HITL means human in the loop. All new or changed meaning requires review in this proposed admission workflow.</p></section>
<section class="slide type-contract has-infographic" id="static-context-contract"><p class="eyebrow">Developer view · identity and version</p><h2>Stable identities connect every layer.</h2><p class="lead">A Metric Passport links a metric to its native definition and review history. The canonical ID stays stable as versions change.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 340" class="motion-diagram infographic-svg infographic-hub" role="img" aria-labelledby="context-infographic-9-title context-infographic-9-desc" preserveAspectRatio="xMidYMid meet"><title id="context-infographic-9-title">A Metric Passport links source, meaning, review and access</title><desc id="context-infographic-9-desc">Illustrative metric identity. A passport references native logic; it does not replace it. Bind the metric to the approved LookML model, Explore, view, measure and Git revision. Reference the native formula or certified SQL revision. Keep the population, grain, unit, time window and exceptions together. Grain means the level represented by one data record. Record the responsible reviewer and the exact approved version. Retain source evidence, validity and audit history. Resolve identity before creating another canonical ID. An ID grants no access. Recheck permissions for each consumer and source query.</desc><defs><marker id="context-infographic-9-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--ink, #000000)"/></marker></defs><g class="m-edge m-stage" data-step="0" data-edge="record-link-0"><path id="context-infographic-9-record-link-0" d="M330 72 H368 V145 H385" fill="none" stroke="var(--line, #D8DADA)" stroke-width="2" /></g><g class="m-edge m-stage" data-step="1" data-edge="record-link-1"><path id="context-infographic-9-record-link-1" d="M670 72 H6 -stage-detail="Resolve identity before creating another canonical ID. An ID grants no access. Recheck permissions for each consumer and source query."><rect x="20" y="216" width="310" height="104" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(36 228) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3 27 7v9c0 6-5 10-11 13C10 26 5 22 5 16V7z"/><rect x="11" y="13" width="10" height="9" rx="2"/><path d="M13 13v-3a3 3 0 0 1 6 0v3 M16 17v2"/></g><text x="74" y="249" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Access rules</text><text x="36" y="282" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Workspace + consumer</text><text x="36" y="305" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Check each request</text></g><g class="infographic-center" data-center="record"><rect x="385" y="124" width="230" height="88" rx="12" fill="var(--mist, #F6F6F6)" stroke="var(--red, #EE001E)" stroke-width="1.5"/><text x="500" y="151" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="middle">Metric Passport</text><text x="500" y="173" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="middle">metric:sample@3</text><text x="500" y="193" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="middle">Canonical ID + version</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><details class="presenter-detail"><summary>Presenter detail</summary><div class="items"><article class="item"><h3>Resolve identity</h3><p>Match the existing object before creating another canonical ID.</p></article><article class="item"><h3>Bind the semantic source</h3><p>For metrics, map the LookML model, Explore, view and measure to a Git revision.</p></article><article class="item"><h3>Version the meaning</h3><p>Keep the owner, approval, population, grain, unit, time window and exceptions with each version.</p></article><article class="item"><h3>Enforce permissions</h3><p>An ID locates a record. Recheck access for each consumer and source query.</p></article></div></details><p class="slide-note">Illustrative record. Canonical means the agreed identity for an object. The passport references approved LookML logic. The consumer still checks source access.</p></section>
<section class="slide type-product-flow" id="static-semantic-layers"><p class="eyebrow">Developer view · the context workspace</p><h2>Separate facts, measures, concepts and interpretation.</h2><p class="lead">Each layer answers a different question. Canonical IDs join the layers inside a controlled workspace.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-10-title context-product-flow-10-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-10-title">Four semantic layers share governed identities</title><desc id="context-product-flow-10-desc">The Data layer records source facts, fields and values. It preserves source versions, dates and units. The Metric layer references the approved LookML measure or certified SQL revision. It records population, grain, unit and period, and links Data IDs. It does not replace native calculation logic. An ontology defines concepts and their relationships. It connects aliases to governed entity IDs. The Interpretation layer explains what the records mean under stated assumptions. Reviewers approve new derived claims. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-10-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="data" data-step="0" data-stage="Data" data-stage-detail="The Data layer records source facts, fields and values. It preserves source versions, dates and units."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Data</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Facts + source fields</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Values + evidence</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-10-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-10-arrow)"/></g><g class="m-node m-stage" data-node="metric" data-step="1" data-stage="Metric" data-stage-detail="The Metric layer references the approved LookML measure or certified SQL revision. It records population, grain, unit and period, and links Data IDs. It does not replace native calculation logic."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Metric</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Formula + population</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Unit + time window</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-10-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-10-arrow)"/></g><g class="m-node m-stage" data-node="ontology" data-step="2" data-stage="Ontology" data-stage-detail="An ontology defines concepts and their relationships. It connects aliases to governed entity IDs."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Ontology</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Concepts + relations</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Names + entity IDs</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-10-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-10-arrow)"/></g><g class="m-node m-stage" data-node="interpretation" data-step="3" data-stage="Interpretation" data-stage-detail="The Interpretation layer explains what the records mean under stated assumptions. Reviewers approve new derived claims."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Interpretation</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Meaning + assumptions</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Limits + review</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Semantic layers</h3><p>These are categories of meaning, not a requirement for four databases.</p></article><article class="item"><h3>Governed links</h3><p>Derived records reference approved input IDs and versions.</p></article></div><p class="slide-note">The arrows show relationships between categories. They do not require every submission to pass through all four layers.</p></section>
<section class="slide type-router" id="static-bounded-decision-router"><p class="eyebrow">Developer view · your model and harness</p><h2>Typed decisions. Human authority.</h2><p class="lead">A harness is application code that checks model outputs and limits allowed operations.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-router-11-title context-router-11-desc" class="motion-diagram motion-diagram-router" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-router-11-title">A chosen model returns typed decisions inside an externally governed harness</title><desc id="context-router-11-desc">The application asks a defined judgment. A chosen model returns Choice, yes/no or rubric Score. The harness checks the schema, evidence and allowed operations. A model output cannot grant permission or approve new meaning. Calibration requires evaluation. This is a proposed decision interface.</desc><defs><marker id="context-router-11-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker><marker id="context-router-11-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><rect x="16" y="118" width="488" height="251" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="64" y="108" width="392" height="24" rx="12" fill="var(--canvas, #eaf2f8)" stroke="none" stroke-width="1.5" /><text x="260" y="127" text-anchor="middle" fill="var(--ink, #000000)" font-family="Consolas, monospace" font-size="15" font-weight="600">GUARD POLICY · OUTSIDE THE MODEL</text><g class="m-edge m-stage" data-step="1"><path id="context-router-11-request-decision" d="M260 95 L260 152" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-router-11-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-router-11-decision-memory" d="M260 218 V247 H96 V283" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-router-11-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-router-11-decision-tool" d="M260 218 L260 283" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-router-11-arrow)"/></g><g class="m-edge m-stage" data-step="4"><path id="context-router-11-decision-reasoning" d="M260 218 V247 H424 V283" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-router-11-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Define the judgment" data-stage-detail="Specify the question, allowed output values and evidence. Keep policy authority outside the model."><rect x="111" y="34" width="298" height="61" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="260" y="59" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Defined judgment</text><text x="260" y="81" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Evidence · schema · allowed values</text></g><g class="m-node m-stage" data-step="1" data-stage="Bounded model interface" data-stage-detail="The chosen model returns a typed judgment. Application code validates the schema, evidence and allowed operations."><rect x="132" y="152" width="256" height="66" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="260" y="177" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Model + harness</text><text x="260" y="199" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Checked typed outputs</text></g><g class="m-node m-stage" data-step="2" data-stage="Choice signal" data-stage-detail="Select one label from an allowed list, such as a semantic layer. A selected label is a proposal rather than human approval."><rect x="27" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="96" y="308" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Choice</text><text x="96" y="330" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">One category</text></g><g class="m-node m-stage" data-step="3" data-stage="Yes/no signal" data-stage-detail="Judge a defined condition against evidence. Deterministic application policy still enforces authorization."><rect x="191" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="260" y="307" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Yes / no</text><text x="260" y="330" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Defined condition</text></g><g class="m-node m-stage" data-step="4" data-stage="Rubric score" data-stage-detail="Rate a property against stated criteria. A score is not automatically a probability. Reported probabilities require calibration checks."><rect x="355" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="424" y="308" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Rubric score</text><text x="424" y="330" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Stated criteria</text></g><text x="260" y="362" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">A model cannot grant itself permission.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Choice</h3><p>Select one category from an allowed list.</p></article><article class="item"><h3>Yes / no</h3><p>Judge a defined condition. Policy checks still enforce access.</p></article><article class="item"><h3>Rubric score</h3><p>Rate a property against stated criteria. A score is not a probability.</p></article><article class="item"><h3>Calibration</h3><p>Check reported probabilities against observed outcomes before using risk thresholds.</p></article></div></div><p class="slide-note">For familiar questions, deliver certified query references for native execution after access checks. New questions use expert drafts and review. The three decision types remain proposed; JEV parity and calibration are unverified.</p></section>
<section class="slide type-memory" id="static-layered-memory"><p class="eyebrow">Developer view · durable memory</p><h2>Keep records durable. Keep task context bounded.</h2><p class="lead">A context vault is a workspace with controlled records and access rules. A consumer receives a permitted view, not the whole vault.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-memory-12-title context-memory-12-desc" class="motion-diagram motion-diagram-memory" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-memory-12-title">Four memory layers with correction and invalidation</title><desc id="context-memory-12-desc">Original sources supply structured memory, rebuildable indexes and summaries, and the working task context. Correction or invalidation starts by checking the source, preserves original records, and rebuilds affected derived views under existing access and retention rules. Authority applies at every layer; a rebuilt view cannot grant permission. This is an unimplemented architecture proposal.</desc><defs><marker id="context-memory-12-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker><marker id="context-memory-12-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><text x="260" y="26" text-anchor="middle" fill="var(--ink, #000000)" font-family="Consolas, monospace" font-size="15" font-weight="600">AUTHORITY ENFORCED AT EVERY LAYER</text><path d="M48 53 H31 V351 H48" fill="none" stroke="var(--gold, #efb94e)" stroke-width="3"/><g class="m-edge m-stage" data-step="1"><path id="context-memory-12-source-structured" d="M246 298 L246 271" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-memory-12-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-memory-12-structured-views" d="M246 216 L246 189" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-memory-12-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-memory-12-views-context" d="M246 134 L246 107" fill="none" stroke="var(--blue, #000000)" stroke-width="2"  marker-end="url(#context-memory-12-arrow)"/></g><g class="m-edge m-stage" data-step="4"><path id="context-memory-12-correction" d="M420 80 H487 V326 H420" fill="none" stroke="var(--gold, #efb94e)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#context-memory-12-gold)"/></g><g class="m-node m-stage" data-step="0" data-stage="Original sources" data-stage-detail="Keep permitted source records under explicit retention rules. Preserve their versions to check generated memory."><rect x="71" y="298" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="245.5" y="323" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Original sources</text><text x="245.5" y="345" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Owned records · versions</text></g><g class="m-node m-stage" data-step="1" data-stage="Structured memory" data-stage-detail="Link claims, dates, status, and unresolved conflicts to source evidence. A model&apos;s assertion is not proof."><rect x="71" y="216" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="245.5" y="241" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Structured memory</text><text x="245.5" y="263" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Claims · provenance · status</text></g><g class="m-node m-stage" data-step="2" data-stage="Rebuildable views" data-stage-detail="Derive indexes, summaries, and caches from structured memory. Invalidate them when sources or access change."><rect x="71" y="134" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="245.5" y="159" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Rebuildable views</text><text x="245.5" y="181" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Indexes · summaries · caches</text></g><g class="m-node m-stage" data-step="3" data-stage="Working context" data-stage-detail="Select permitted evidence for the current goal and constraints. Keep it within the model&apos;s input limit."><rect x="71" y="52" width="349" height="55" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5" /><text x="245.5" y="77" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Working context</text><text x="245.5" y="99" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Goal + selected evidence</text></g><text x="450" y="203" transform="rotate(90 450 203)" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15">Correct / invalidate</text><g class="m-node m-stage" data-step="4" data-stage="Correct or invalidate" data-stage-detail="Check the source while preserving original records, then rebuild affected derived views under existing access and retention rules."><rect x="424" y="276" width="80" height="32" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" /><text x="464" y="289" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="500">Check source</text><text x="464" y="301" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="500">Rebuild views</text></g><text x="260" y="372" text-anchor="middle" fill="var(--ink, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Rebuilding a view cannot grant permission.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #000000)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Canonical records</h3><p>Keep sources, approved versions, status and review history.</p></article><article class="item"><h3>Derived views</h3><p>Build search indexes, graphs or caches when a use case needs them.</p></article><article class="item"><h3>Working context</h3><p>Load relevant subject matter expert (SME) knowledge within the request budget.</p></article><article class="item"><h3>Corrections</h3><p>Invalidate dependent views when inputs expire, change or lose access.</p></article></div></div><p class="slide-note">The semantic layers describe meaning. This storage lifecycle describes persistence and retrieval. A cache is never an approval authority.</p></section>
<section class="slide type-product-flow" id="static-secure-delivery"><p class="eyebrow">Developer view · output contract</p><h2>Deliver context through an explicit access boundary.</h2><p class="lead">The MCP server exposes permitted context. The server must enforce the product’s record and workspace policies.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-13-title context-product-flow-13-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-13-title">A context request crosses explicit access checks</title><desc id="context-product-flow-13-desc">Authenticate the caller. Resolve the requested workspace and purpose. Authentication establishes identity. Authorization decides which records the caller may access. Check current approval, expiry and withdrawal. Return only permitted records and evidence references. Include version, validity and unresolved limits. Enforce a response budget. MCP means Model Context Protocol. It connects the server to consuming applications. Application actions remain under consumer authority. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-13-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="identify" data-step="0" data-stage="Identify caller" data-stage-detail="Authenticate the caller. Resolve the requested workspace and purpose. Authentication establishes identity."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Identify caller</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">User + workspace</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Purpose + request</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-13-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-13-arrow)"/></g><g class="m-node m-stage" data-node="authorize" data-step="1" data-stage="Authorize records" data-stage-detail="Authorization decides which records the caller may access. Check current approval, expiry and withdrawal."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Authorize records</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Per-record permissions</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Current approved versions</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-13-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-13-arrow)"/></g><g class="m-node m-stage" data-node="assemble" data-step="2" data-stage="Assemble output" data-stage-detail="Return only permitted records and evidence references. Include version, validity and unresolved limits. Enforce a response budget."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Assemble output</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">IDs + versions + evidence</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Bounded context bundle</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-13-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-13-arrow)"/></g><g class="m-node m-stage" data-node="consume" data-step="3" data-stage="Deliver through MCP" data-stage-detail="MCP means Model Context Protocol. It connects the server to consuming applications. Application actions remain under consumer authority."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Deliver through MCP</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Context exchange</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Independent consumer</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Structured output</h3><p>Return IDs, versions, evidence, validity and unresolved limits.</p></article><article class="item"><h3>Access at use</h3><p>Recheck permissions for each resource or tool request.</p></article></div><p class="slide-note">MCP defines context exchange. Authentication and application authorization still require implementation. The protocol alone does not make a product secure.</p></section>
<section class="slide type-product-flow" id="static-controlled-evolution"><p class="eyebrow">Developer view · adapting to new technology</p><h2>Keep the knowledge. Qualify each replacement.</h2><p class="lead">Versioned contracts let us evaluate new models, retrieval systems and interfaces while preserving governed context.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 180" class="motion-diagram product-flow-svg" role="img" aria-labelledby="context-product-flow-14-title context-product-flow-14-desc" preserveAspectRatio="xMidYMid meet"><title id="context-product-flow-14-title">Replace components through a qualification gate</title><desc id="context-product-flow-14-desc">Treat governed records and their contracts as durable assets. A new adapter must preserve meaning, evidence and access rules. Introduce a candidate behind the same interface. Record its version and configuration. Do not assume a familiar interface preserves behavior. Evaluate the candidate on held-out cases, boundary failures and complete task cost. Keep development cases separate. Release only after the owner accepts the evidence. Retain the prior compatible release on failure. Invalidate affected caches when dependencies change. Proposed design, not a running product.</desc><defs><marker id="context-product-flow-14-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #000000)"/></marker></defs><g class="m-node m-stage" data-node="contract" data-step="0" data-stage="Keep the contract" data-stage-detail="Treat governed records and their contracts as durable assets. A new adapter must preserve meaning, evidence and access rules."><rect x="20" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="34" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Keep the contract</text><text x="34" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">IDs + meaning + evidence</text><text x="34" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Access + version rules</text></g><g class="m-edge m-stage" data-step="1"><path id="context-product-flow-14-edge-1" d="M240 83 H270" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-14-arrow)"/></g><g class="m-node m-stage" data-node="candidate" data-step="1" data-stage="Connect a candidate" data-stage-detail="Introduce a candidate behind the same interface. Record its version and configuration. Do not assume a familiar interface preserves behavior."><rect x="270" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="284" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Connect a candidate</text><text x="284" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Model, index or adapter</text><text x="284" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Versioned configuration</text></g><g class="m-edge m-stage" data-step="2"><path id="context-product-flow-14-edge-2" d="M490 83 H520" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-14-arrow)"/></g><g class="m-node m-stage" data-node="evaluate" data-step="2" data-stage="Compare outcomes" data-stage-detail="Evaluate the candidate on held-out cases, boundary failures and complete task cost. Keep development cases separate."><rect x="520" y="28" width="220" height="110" rx="10" fill="var(--navy, #172b4d)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="534" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--white, #ffffff)" font-weight="650">Compare outcomes</text><text x="534" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Held-out cases + failures</text><text x="534" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--white, #ffffff)" font-weight="500">Full cost + quality</text></g><g class="m-edge m-stage" data-step="3"><path id="context-product-flow-14-edge-3" d="M740 83 H770" fill="none" stroke="var(--blue, #000000)" stroke-width="2" marker-end="url(#context-product-flow-14-arrow)"/></g><g class="m-node m-stage" data-node="release" data-step="3" data-stage="Release or retain" data-stage-detail="Release only after the owner accepts the evidence. Retain the prior compatible release on failure. Invalidate affected caches when dependencies change."><rect x="770" y="28" width="220" height="110" rx="10" fill="var(--white, #ffffff)" stroke="var(--blue, #000000)" stroke-width="1.5"/><text x="784" y="55" font-family="Segoe UI,Arial,sans-serif" font-size="18" fill="var(--ink, #000000)" font-weight="650">Release or retain</text><text x="784" y="82" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Owner acceptance</text><text x="784" y="105" font-family="Segoe UI,Arial,sans-serif" font-size="15" fill="var(--blue, #000000)" font-weight="500">Rollback + invalidation</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Durable asset</h3><p>Meaning, evidence and approved identities survive component changes.</p></article><article class="item"><h3>Qualification cost</h3><p>Budget evaluation, migration, rollback and maintenance.</p></article></div><p class="slide-note">Adaptability is a design objective. No architecture can guarantee that future technology will never surpass it.</p></section>
<section class="slide type-token-cost" id="static-call-cost-anatomy"><p class="eyebrow">Cost mechanism · one task can contain many calls</p><h2>A question is only part of each model call.</h2><p class="lead">A call can include instructions, permitted records, history and tool results. Repeated calls can send that input again.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 340" class="motion-diagram infographic-svg token-cost-svg" role="img" aria-labelledby="context-token-volume-15-title context-token-volume-15-desc" preserveAspectRatio="xMidYMid meet" data-scale-max="21000"><title id="context-token-volume-15-title">Illustrative token volume for one task</title><desc id="context-token-volume-15-desc">Each call returns 500 output tokens. First-call input is 4,000 tokens. These counts are invented. One call: 1 calls, 4000 input tokens, 500 output tokens, 4500 total tokens. One call sends 4,000 input tokens and returns 500 output tokens. Total volume is 4,500 tokens. No price or saving is implied. Four repeated calls: 4 calls, 16000 input tokens, 2000 output tokens, 18000 total tokens. Four calls each send the same 4,000 input tokens and return 500 output tokens. Total volume is 18,000 tokens. This workload assumes repeated input. Four calls + history: 4 calls, 19000 input tokens, 2000 output tokens, 21000 total tokens. Each later call also sends earlier 500-token answers. Inputs total 4,000+4,500+5,000+5,500=19,000 tokens. Outputs total 2,000 tokens. Total volume is 21,000 tokens. Other state and history strategies can behave differently. All three bars use the same token scale. Illustrative token volume, not price.</desc><g class="m-node m-stage" data-node="one" data-step="0" data-stage="One call" data-stage-detail="One call sends 4,000 input tokens and returns 500 output tokens. Total volume is 4,500 tokens. No price or saving is implied."><rect x="20" y="12" width="960" height="91" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><text x="40" y="39" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)">One call</text><text x="40" y="64" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)">1 call · 4,500 tokens</text><g class="token-bar"><rect class="token-bar-input" data-token-part="input" data-value="4000" x="335" y="36" width="118.09523809523809" height="20" fill="var(--ink, #000000)"/><rect class="token-bar-output" data-token-part="output" data-value="500" x="453.0952380952381" y="36" width="14.761904761904761" height="20" fill="var(--red, #EE001E)"/></g><text x="335" y="82" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)">Input 4,000  +  output 500</text></g><g class="m-node m-stage" data-node="repeat" data-step="1" data-stage="Four repeated calls" data-stage-detail="Four calls each send the same 4,000 input tokens and return 500 output tokens. Total volume is 18,000 tokens. This workload assumes repeated input."><rect x="20" y="109" width="960" height="91" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><text x="40" y="136" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)">Four repeated calls</text><text x="40" y="161" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)">4 calls · 18,000 tokens</text><g class="token-bar"><rect class="token-bar-input" data-token-part="input" data-value="16000" x="335" y="133" width="472.38095238095235" height="20" fill="var(--ink, #000000)"/><rect class="token-bar-output" data-token-part="output" data-value="2000" x="807.3809523809523" y="133" width="59.047619047619044" height="20" fill="var(--red, #EE001E)"/></g><text x="335" y="179" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)">Input 16,000  +  output 2,000</text></g><g class="m-node m-stage" data-node="history" data-step="2" data-stage="Four calls + history" data-stage-detail="Each later call also sends earlier 500-token answers. Inputs total 4,000+4,500+5,000+5,500=19,000 tokens. Outputs total 2,000 tokens. Total volume is 21,000 tokens. Other state and history strategies can behave differently."><rect x="20" y="206" width="960" height="91" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><text x="40" y="233" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)">Four calls + history</text><text x="40" y="258" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)">4 calls · 21,000 tokens</text><g class="token-bar"><rect class="token-bar-input" data-token-part="input" data-value="19000" x="335" y="230" width="560.952380952381" height="20" fill="var(--ink, #000000)"/><rect class="token-bar-output" data-token-part="output" data-value="2000" x="895.952380952381" y="230" width="59.047619047619044" height="20" fill="var(--red, #EE001E)"/></g><text x="335" y="276" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)">Input 19,000  +  output 2,000</text></g><rect x="28" y="318" width="13" height="13" fill="var(--ink, #000000)"/><text x="48" y="330" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="var(--ink, #000000)">Input</text><rect x="111" y="318" width="13" height="13" fill="var(--red, #EE001E)"/><text x="131" y="330" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="var(--ink, #000000)">Output</text><text x="260" y="330" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)">Illustrative token volume, not price</text></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it
