<section class="slide type-cover" id="static-opening-thesis"><div class="cover-grid"><div><p class="eyebrow">Industry briefing · development proposal</p><h1>Connect the context. Keep control.</h1><p class="lead">One context layer. Four different workflows. Link the right evidence, preserve its meaning and keep authority with the right owner.</p><div class="items"><article class="item"><h3>Industry evidence</h3><p>Four primary-source signals anchor the problem.</p></article><article class="item"><h3>A solution to test</h3><p>Separate vaults, shared checks and reviewable outputs.</p></article></div></div><div class="industry-hero-visual"><figure class="mechanism-figure"><svg viewBox="0 0 720 510" role="img" aria-labelledby="industry-atlas-1-title industry-atlas-1-desc" class="motion-diagram industry-svg industry-svg-atlas" preserveAspectRatio="xMidYMid meet"><title id="industry-atlas-1-title">Four industries connect to shared context checks in separate vaults</title><desc id="industry-atlas-1-desc">Telecom, electricity utilities, healthcare and hospitality have different pressures. Each task needs its own evidence, time, scope and responsible owner. Connections illustrate shared design checks, not data sharing between industries. Industry metrics appear with dates and sources on the following slides. Proposed architecture, not implemented.</desc><defs><marker id="industry-atlas-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #147dfa)"/></marker></defs><path d="M360 38V475M35 255H685" stroke="#254963" stroke-dasharray="2 8" fill="none"/><circle cx="360" cy="255" r="151" fill="none" stroke="#254963" stroke-dasharray="3 8"/><circle cx="360" cy="255" r="118" fill="none" stroke="#345e78"/><g class="m-edge m-stage" data-step="0"><path id="industry-atlas-1-telecom" d="M270 94 C348 94 302 172 336 206" fill="none" stroke="var(--telecom, #16a9c3)" stroke-width="2.5" marker-end="url(#indus <section class="slide type-industry-overview" id="static-industry-pressure"><p class="eyebrow">Four signals · four different populations</p><h2>Different pressures. A shared need for context.</h2><p class="lead">Read each figure in its own scope. These metrics describe industry pressure; they do not measure context errors.</p><div class="industry-overview-grid"><article class="industry-metric" data-sector="telecom" style="--sector:#16a9c3"><h3 class="sector-name">Telecommunications</h3><strong class="metric-value">+23%</strong><p class="metric-label">Mobile network data traffic growth</p><svg viewBox="0 0 440 155" role="img" aria-labelledby="industry-metric-2-title industry-metric-2-desc" class="insight-chart" preserveAspectRatio="xMidYMid meet" data-sector="telecom"><title id="industry-metric-2-title">Telecommunications: +23%. Mobile network data traffic growth</title><desc id="industry-metric-2-desc">Global mobile networks, including fixed wireless access. Q2 2025 → Q2 2026. Traffic growth does not measure incident rates or missing context. Indexed chart: Q2 2025 = 100. Fixed wireless access delivers broadband to a fixed location through a mobile network.</desc><text x="5" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">Q2 2025</text><rect class="chart-fill" data-value="100" x="110" y="26" width="223.0769230769231" height="27" rx="4" fill="#9eafbe"/><text x="338.0769230769231" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">100</text><text x="5" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">Q2 2026</text><rect class="chart-fill" data-value="123" x="110" y="74" width="274.38461538461536" height="27" rx="4" fill="#16a9c3"/><text x="389.38461538461536" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight <section class="slide type-industry-case" id="static-utilities-context"><p class="eyebrow">Electricity utilities · industry evidence → design response</p><h2>A queue needs current engineering evidence</h2><p class="lead">Connection reviews need current engineering evidence and a clear decision history.</p><div class="industry-case" data-sector="utilities" style="--sector:#efaa28"><div class="industry-case-intro"><article class="industry-metric" data-sector="utilities" style="--sector:#efaa28"><strong class="metric-value">≥1,700 GW</strong><p class="metric-label">Advanced-stage renewables awaiting connection</p><svg viewBox="0 0 440 155" role="img" aria-labelledby="industry-metric-8-title industry-metric-8-desc" class="insight-chart" preserveAspectRatio="xMidYMid meet" data-sector="utilities"><title id="industry-metric-8-title">Electricity utilities: ≥1,700 GW. Advanced-stage renewables awaiting connection</title><desc id="industry-metric-8-desc">Global renewable project capacity. Utility-scale batteries are reported separately. Queue snapshot: 2025 · IEA report: 2026. A lower-bound capacity snapshot, not a project count or capacity this system can connect. GW means gigawatts, a unit of power capacity. Each plotted node represents 100 GW of the reported lower bound.</desc><circle class="capacity-node" cx="28" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="73" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="118" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="163" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="208" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="253" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="298" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="343" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="388" cy="38" r="12" fill="#efaa28"/><circle class="capacity-node" cx="28" cy="82" r="12" fill="#efaa28"/><circle cla <section class="slide type-industry-case" id="static-healthcare-context"><p class="eyebrow">Healthcare · industry evidence → design response</p><h2>Received data still needs a usable handoff</h2><p class="lead">Receiving a record and integrating it are different capabilities.</p><div class="industry-case" data-sector="healthcare" style="--sector:#ed607d"><div class="industry-case-intro"><article class="industry-metric" data-sector="healthcare" style="--sector:#ed607d"><strong class="metric-value">93% / 79%</strong><p class="metric-label">Receive / integrate outside summary records</p><svg viewBox="0 0 440 155" role="img" aria-labelledby="industry-metric-10-title industry-metric-10-desc" class="insight-chart" preserveAspectRatio="xMidYMid meet" data-sector="healthcare"><title id="industry-metric-10-title">Healthcare: 93% / 79%. Receive / integrate outside summary records</title><desc id="industry-metric-10-desc">U.S. non-federal acute-care hospitals. Weighted hospital-level survey estimates. 2025 survey · ONC update: February 2026. Capability rates, not patient outcomes. These aggregate measures do not identify which hospitals lack integration. Integrate means the electronic health record incorporates an outside summary without manual entry.</desc><text x="4" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">Receive</text><rect x="112" y="22" width="275" height="28" rx="4" fill="#e1e7ed"/><rect class="chart-fill" data-value="93" x="112" y="22" width="255.75" height="28" rx="4" fill="#ed607d"/><text x="395" y="43" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">93%</text><text x="4" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">Integrate</text><rect x="112" y="70" width="275" height="28" rx="4" fill="#e1e7ed"/><rect class="chart-fill" data-value="79" x="112" y="70" width="217.25" height="28" rx="4" fill="#ed607d"/><text x="395" y="91" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">79%</text><text x="112" y="133" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">0</text><text x="387" y="133" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="end" fill="var(--ink, #102d3e)">100%</text><text x="112" y="152" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start" fill="var(--muted, #50677b)">Hospital-level capability rates</text></svg><p class="metric-period">2025 survey · ONC update: February 2026</p><p class="metric-scope">U.S. non-federal acute-care hospitals. Weighted hospital-level survey estimates.</p><a class="industry-citation" href="https://healthit.gov/data/quickstats/electronic-health-information-exchange-hospitals/">ONC · Health IT Quick Stat 66</a></article><div class="industry-story"><article class="industry-story-block"><h3>The context problem</h3><p>A handoff still needs the correct patient, dates, source status and unresolved conflicts.</p></article><article class="industry-story-block"><h3>The proposed solution</h3><p>Prepare a cited handoff that distinguishes current evidence, conflicts and unknowns. Keep clinical decisions with the clinician.</p></article><p class="industry-owner-note">The responsible clinician verifies content and makes clinical decisions. Privacy and access controls must hold.</p><p class="industry-term">Integrate means the electronic health record incorporates an outside summary without manual entry.</p></div></div><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Industry workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 900 240" role="img" aria-labelledby="industry ext x="360" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#102d3e">Governed</text><text x="360" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#102d3e">context</text><text x="360" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2f5aa6">EVIDENCE + OWNER</text></g><text x="360" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#c5dbea">Shared checks do not mean shared private records.</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="static-bridge-cases"><article><h3>Telecom</h3><p>Investigate a congestion alert.</p><p>Incident brief with sources, unknowns and proposed next checks.</p><strong>Network operator</strong></article><article><h3>Utilities</h3><p>Review a renewable connection application.</p><p>Connection review brief with study references and unresolved engineering questions.</p><strong>Grid engineer / operator</strong></article><article><h3>Healthcare</h3><p>Prepare a draft care handoff.</p><p>Draft handoff with source links and clear review questions.</p><strong>Responsible clinician</strong></article><article><h3>Hospitality</h3><p>Hand over an open room-maintenance request.</p><p>Shift brief with verified status, owner, next action and escalation condition.</p><strong>Duty manager / staff</strong></article></div></div><p class="slide-note">Choose an industry to follow its proposed workflow. This illustration performs no retrieval or external action.</p></section>
<section class="slide type-problem" id="static-fragmented-context"><p class="eyebrow">The problem</p><h2>Stored information does not become useful context by itself</h2><p class="lead">A personal agent must find the right evidence, interpret its conditions and carry the current task forward.</p><div class="items"><article class="item"><h3>Fragmentation</h3><p>Facts, decisions and goals sit in separate notes, files and chats.</p></article><article class="item"><h3>Stale memory</h3><p>An earlier statement can remain active after circumstances change.</p></article><article class="item"><h3>Conflicting evidence</h3><p>Different sources can disagree. The newest statement is not automatically authoritative.</p></article><article class="item"><h3>Lost intent</h3><p>A summary can remove a condition, exception or unresolved decision that changes the answer.</p></article></div><p class="slide-note">Sources: longmemeval, tangle. Project incidence has not been measured.</p></section>
<section class="slide type-foundation" id="static-durable-foundation"><p class="eyebrow">Architecture principle</p><h2>Keep commitments durable and components replaceable</h2><p class="lead">Resilience means controlled replacement with evidence and recovery. It is not a guarantee against future failure.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-cover-15-title context-cover-15-desc" class="motion-diagram motion-diagram-cover" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-cover-15-title">Evidence becomes working context within a permission boundary</title><desc id="context-cover-15-desc">Original sources link to structured memory, which supplies the current task context. Replaceable model, search and tool adapters consume this context. A permission boundary governs every layer. This is an unimplemented architecture proposal.</desc><defs><marker id="context-cover-15-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #2f5aa6)"/></marker><marker id="context-cover-15-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><rect x="28" y="30" width="464" height="333" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="134" y="17" width="252" height="26" rx="12" fill="var(--canvas, #eaf2f8)" stroke="none" stroke-width="1.5" /><text x="260" y="36" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Consolas, monospace" font-size="15" font-weight="600">PERMISSION BOUNDARY</text><g class="m-edge m-stage" data-step="1"><path id="context-cover-15-source-memory" d="M260 111 L260 130" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-cover-15-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-cover-15-memory-context" d="M260 186 L260 205" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-cover-15-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-cover-15-context-adapters" d="M260 261 L260 280" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-cover-15-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Original sources" data-stage-detail="Keep owned, versioned source records as the evidence base."><rect x="71" y="55" width="378" height="56" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="80" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Original sources</text><text x="260" y="102" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Versioned records · ownership</text></g><g class="m-node m-stage" data-step="1" data-stage="Evidence-linked memory" data-stage-detail="Link claims to their source evidence and retain provenance and uncertainty."><rect x="71" y="130" width="378" height="56" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="155" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Evidence-linked memory</text><text x="260" y="177" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Claims · provenance · uncertainty</text></g><g class="m-node m-stage" data-step="2" data-stage="Working task context" data-stage-detail="Select permitted evidence relevant to the current task and goal."><rect x="71" y="205" width="378" height="56" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="230" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Working task context</text><text x="260" y="252" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Current goal · relevant evidence</text></g><g class="m-node m-stage" data-step="3" data-stage="Replaceable adapters" data-stage-detail="Pass permitted task context to model, search, or authorized tool adapters."><rect x="71" y="280" width="378" height="56" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="305" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Replaceable adapters</text><text x="260" y="327" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Models · search · authorized tools</text></g><text x="260" y="354" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Authority applies across every layer.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Preserve</h3><p>Permitted originals, source identity, history, uncertainty, goals and verified outcomes.</p></article><article class="item"><h3>Enforce</h3><p>Project scope, access and action authority in trusted application code.</p></article><article class="item"><h3>Replace</h3><p>Models, parsers, frameworks, embeddings, indexes, storage engines and selection methods.</p></article><article class="item"><h3>Prove each change</h3><p>Export, compare, rebuild, restore and roll back against representative tasks.</p></article></div></div><p class="slide-note">Invariants are rules that each replacement must continue to satisfy. Sources: prov, nist.</p></section>
<section class="slide type-contract" id="static-context-contract"><p class="eyebrow">The stable boundary</p><h2>Define a versioned context contract</h2><p class="lead">The contract defines the records, meanings and rules that components exchange. Changes require compatible behavior or an explicit migration.</p><div class="diagram-grid"><pre class="contract-card">record: claim-017
source: policy-v3, paragraph 4
project: example-project
valid_from: 2026-09-01
status: supported
claim: Keep reports for 30 days.
exception: Keep disputed reports
           until review ends.
authority: read-only

Format can change through migration.
Meaning and permissions must survive.</pre><div class="items"><article class="item"><h3>Source record</h3><p>Stable ID, permitted original, revision, origin, scope and access rules.</p></article><article class="item"><h3>Claim record</h3><p>Statement, source references, conditions, uncertainty and competing claims.</p></article><article class="item"><h3>Time and dependencies</h3><p>Observed and valid dates; the inputs and versions used by each derived view.</p></article><article class="item"><h3>Task and authority</h3><p>Goal, constraints, pending decisions, permissions and intended, attempted or verified actions.</p></article></div></div><p class="slide-note">Evidence traceability explains origin and transformation. It does not prove a source is true. Source: prov.</p></section>
<section class="slide type-pipeline" id="static-governed-ingestion"><p class="eyebrow">From source to usable evidence</p><h2>Ingest through explicit gates</h2><p class="lead">A source enters the vault only within its approved scope. Extraction creates reviewable memory proposals.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-pipeline-16-title context-pipeline-16-desc" class="motion-diagram motion-diagram-pipeline" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-pipeline-16-title">Evidence admission: capture, propose, validate and commit</title><desc id="context-pipeline-16-desc">Capture preserves the original source. Propose creates candidate claims, not verified facts. A policy gate controls validation. Validate checks evidence, conflicts and scope before commit stores admitted claims with status. This is an unimplemented architecture proposal.</desc><defs><marker id="context-pipeline-16-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #2f5aa6)"/></marker><marker id="context-pipeline-16-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><text x="260" y="28" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Consolas, monospace" font-size="15" font-weight="600">EVIDENCE ADMISSION</text><g class="m-edge m-stage" data-step="1"><path id="context-pipeline-16-capture-propose" d="M221 108 L299 108" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-pipeline-16-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-pipeline-16-propose-validate" d="M398 152 L398 234" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-pipeline-16-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-pipeline-16-validate-commit" d="M299 280 L221 280" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-pipeline-16-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Capture" data-stage-detail="Preserve the original source and its version before proposing claims."><rect x="24" y="58" width="197" height="94" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="41" y="82" text-anchor="start" fill="var(--blue, #2f5aa6)" font-family="Consolas, monospace" font-size="15" font-weight="500">01</text><text x="72" y="82" text-anchor="start" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Capture</text><text x="122.5" y="111" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Original stays original</text><text x="122.5" y="134" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Retain source + version</text></g><g class="m-node m-stage" data-step="1" data-stage="Propose" data-stage-detail="Create candidate claims whose evidence and status still require validation."><rect x="299" y="58" width="197" height="94" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="316" y="82" text-anchor="start" fill="var(--blue, #2f5aa6)" font-family="Consolas, monospace" font-size="15" font-weight="500">02</text><text x="347" y="82" text-anchor="start" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Propose</text><text x="397.5" y="111" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Candidate claims</text><text x="397.5" y="134" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Proposal ≠ verified fact</text></g><g class="m-node m-stage" data-step="2" data-stage="Validate" data-stage-detail="Check evidence, conflicts, scope, and permission through the policy gate."><rect x="299" y="234" width="197" height="94" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="316" y="258" text-anchor="start" fill="var(--blue, #2f5aa6)" font-family="Consolas, monospace" font-size="15" font-weight="500">03</text><text x="347" y="258" text-anchor="start" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Validate</text><text x="397.5" y="287" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Evidence · conflicts</text><text x="397.5" y="310" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Scope + permission</text></g><g class="m-node m-stage" data-step="3" data-stage="Commit" data-stage-detail="Store admitted claims with status and a reference to their source evidence."><rect x="24" y="234" width="197" height="94" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="41" y="258" text-anchor="start" fill="var(--cyan, #53c8d8)" font-family="Consolas, monospace" font-size="15" font-weight="500">04</text><text x="72" y="258" text-anchor="start" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Commit</text><text x="122.5" y="287" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Admit with status</text><text x="122.5" y="310" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Link back to evidence</text></g><g class="m-node m-stage" data-step="2"><rect x="324" y="178" width="148" height="34" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" /><text x="398" y="201" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Consolas, monospace" font-size="15" font-weight="600">POLICY GATE</text></g><text x="201" y="188" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Claims require</text><text x="201" y="210" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">admission checks.</text><text x="260" y="356" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">A source reference remains with each admitted claim.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Admit and preserve</h3><p>Check scope and access. Retain exact phrases, numbers, conditions and history in the original.</p></article><article class="item"><h3>Extract and reconcile</h3><p>Link candidate claims to evidence. Preserve dates, exceptions and unresolved conflicts.</p></article><article class="item"><h3>Publish derived views</h3><p>Create clear summaries and searchable views with dependencies and transformation versions.</p></article><article class="item"><h3>Correct and invalidate</h3><p>Apply corrections, revocation and deletion to affected views under an explicit retention policy.</p></article></div></div><p class="slide-note">A memory proposal is not an established fact. Backup and restore behavior must prevent removed context from silently returning.</p></section>
<section class="slide type-memory" id="static-layered-memory"><p class="eyebrow">Memory stack</p><h2>Separate durable evidence from working context</h2><p class="lead">The controller selects a bounded context packet for the active task. Each selected item keeps a reason and source reference.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-memory-17-title context-memory-17-desc" class="motion-diagram motion-diagram-memory" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-memory-17-title">Four memory layers with correction and invalidation</title><desc id="context-memory-17-desc">Original sources supply structured memory, rebuildable indexes and summaries, and the working task context. Correction or invalidation starts by checking the source, preserves original records, and rebuilds affected derived views under existing access and retention rules. Authority applies at every layer; a rebuilt view cannot grant permission. This is an unimplemented architecture proposal.</desc><defs><marker id="context-memory-17-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #2f5aa6)"/></marker><marker id="context-memory-17-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><text x="260" y="26" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Consolas, monospace" font-size="15" font-weight="600">AUTHORITY ENFORCED AT EVERY LAYER</text><path d="M48 53 H31 V351 H48" fill="none" stroke="var(--gold, #efb94e)" stroke-width="3"/><g class="m-edge m-stage" data-step="1"><path id="context-memory-17-source-structured" d="M246 298 L246 271" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-memory-17-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-memory-17-structured-views" d="M246 216 L246 189" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-memory-17-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-memory-17-views-context" d="M246 134 L246 107" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-memory-17-arrow)"/></g><g class="m-edge m-stage" data-step="4"><path id="context-memory-17-correction" d="M420 80 H487 V326 H420" fill="none" stroke="var(--gold, #efb94e)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#context-memory-17-gold)"/></g><g class="m-node m-stage" data-step="0" data-stage="Original sources" data-stage-detail="Keep permitted source records under explicit retention rules. Preserve their versions to check generated memory."><rect x="71" y="298" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="245.5" y="323" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Original sources</text><text x="245.5" y="345" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Owned records · versions</text></g><g class="m-node m-stage" data-step="1" data-stage="Structured memory" data-stage-detail="Link claims, dates, status, and unresolved conflicts to source evidence. A model&apos;s assertion is not proof."><rect x="71" y="216" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="245.5" y="241" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Structured memory</text><text x="245.5" y="263" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Claims · provenance · status</text></g><g class="m-node m-stage" data-step="2" data-stage="Rebuildable views" data-stage-detail="Derive indexes, summaries, and caches from structured memory. Invalidate them when sources or access change."><rect x="71" y="134" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="245.5" y="159" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Rebuildable views</text><text x="245.5" y="181" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Indexes · summaries · caches</text></g><g class="m-node m-stage" data-step="3" data-stage="Working context" data-stage-detail="Select permitted evidence for the current goal and constraints. Keep it within the model&apos;s input limit."><rect x="71" y="52" width="349" height="55" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="245.5" y="77" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Working context</text><text x="245.5" y="99" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Goal + selected evidence</text></g><text x="450" y="203" transform="rotate(90 450 203)" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15">Correct / invalidate</text><g class="m-node m-stage" data-step="4" data-stage="Correct or invalidate" data-stage-detail="Check the source while preserving original records, then rebuild affected derived views under existing access and retention rules."><rect x="424" y="276" width="80" height="32" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" /><text x="464" y="289" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="500">Check source</text><text x="464" y="301" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="500">Rebuild views</text></g><text x="260" y="372" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Rebuilding a view cannot grant permission.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Evidence vault</h3><p>Permitted originals and structured claims preserve history, scope and unresolved disagreements.</p></article><article class="item"><h3>Rebuildable views</h3><p>Search indexes, embeddings, caches, graphs and summaries derive from authorized evidence.</p></article><article class="item"><h3>Working task context</h3><p>Current goal, constraints, useful evidence, pending decisions and tool results fit the model input limit.</p></article><article class="item"><h3>Candidate foundations</h3><p>Compare OpenViking, Graphiti, Letta Code and Mem0 against actual tasks. No stack is selected.</p></article></div></div><p class="slide-note">Local runtime, provider behavior and integration remain unverified. Sources: openviking, graphiti, letta, mem0.</p></section>
<section class="slide type-router" id="static-bounded-decision-router"><p class="eyebrow">Jev-style decisions</p><h2>Ask a small, bounded question</h2><p class="lead">The router can judge relevance, choose a category, flag a possible conflict or recommend escalation.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-router-18-title context-router-18-desc" class="motion-diagram motion-diagram-router" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-router-18-title">A bounded request router governed outside the model</title><desc id="context-router-18-desc">A request with a goal and constraints enters a bounded decision. Guard policy outside the model restricts routes to permitted memory access, authorized tools or labeled reasoning. A model cannot grant itself permission. This is an unimplemented architecture proposal.</desc><defs><marker id="context-router-18-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #2f5aa6)"/></marker><marker id="context-router-18-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><rect x="16" y="118" width="488" height="251" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="64" y="108" width="392" height="24" rx="12" fill="var(--canvas, #eaf2f8)" stroke="none" stroke-width="1.5" /><text x="260" y="127" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Consolas, monospace" font-size="15" font-weight="600">GUARD POLICY · OUTSIDE THE MODEL</text><g class="m-edge m-stage" data-step="1"><path id="context-router-18-request-decision" d="M260 95 L260 152" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-router-18-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-router-18-decision-memory" d="M260 218 V247 H96 V283" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-router-18-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-router-18-decision-tool" d="M260 218 L260 283" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-router-18-arrow)"/></g><g class="m-edge m-stage" data-step="4"><path id="context-router-18-decision-reasoning" d="M260 218 V247 H424 V283" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-router-18-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Request" data-stage-detail="Establish the goal, scope, constraints, and existing permissions for the request."><rect x="111" y="34" width="298" height="61" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="59" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Request + goal</text><text x="260" y="81" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Scope · constraints · permissions</text></g><g class="m-node m-stage" data-step="1" data-stage="Bounded decision" data-stage-detail="External guard policy restricts the available branch alternatives for this request."><rect x="132" y="152" width="256" height="66" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="177" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Bounded decision</text><text x="260" y="199" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Only permitted routes</text></g><g class="m-node m-stage" data-step="2" data-stage="Memory option" data-stage-detail="Memory lookup is a permitted branch alternative, not a required step before tools or reasoning."><rect x="27" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="96" y="308" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Memory</text><text x="96" y="330" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Evidence lookup</text></g><g class="m-node m-stage" data-step="3" data-stage="Tool option" data-stage-detail="An authorized tool is a scoped branch alternative, not a mandatory next step after memory."><rect x="191" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="307" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Authorized tool</text><text x="260" y="330" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Scoped action</text></g><g class="m-node m-stage" data-step="4" data-stage="Reasoning option" data-stage-detail="Labeled reasoning is a branch alternative, not a mandatory step after the other options."><rect x="355" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="424" y="308" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Reasoning</text><text x="424" y="330" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Label inference</text></g><text x="260" y="362" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">A model cannot grant itself permission.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Typed inputs and outputs</h3><p>Supply bounded options and evidence. Use Choice, yes/no probability or a described score rubric.</p></article><article class="item"><h3>Preserve abstention</h3><p>Insufficient evidence must remain a valid route. Evaluate truncation, label order and uncertainty.</p></article><article class="item"><h3>Compare candidates</h3><p>Start with Mapika decider-2b, decider-4b and Laya typed-decisions. Test on our context decisions.</p></article><article class="item"><h3>Keep authority external</h3><p>Probability does not grant permission or establish truth. Application rules control actions.</p></article></div></div><p class="slide-note">Confidence fields differ across runtimes. Calibration and complete request latency need local measurement. Sources: mapika, laya.</p></section>
<section class="slide type-ste" id="static-meaning-preserving-ste"><p class="eyebrow">STE-inspired context compiler</p><h2>Simplify language while preserving meaning</h2><p class="lead">The compiler creates a clear task view and checks it against the original evidence.</p><div class="ste-example"><div class="example-panel"><span class="label">ORIGINAL · ILLUSTRATIVE</span><p>Reports should be retained for a period of 30 days, except where a dispute remains open, in which case retention continues until the review concludes.</p></div><div class="example-panel"><span class="label">STE-INSPIRED VIEW</span><p>Keep reports for 30 days. If a dispute remains open, keep the report until the review ends.</p></div></div><div class="items"><article class="item"><h3>Check meaning</h3><p>Preserve negation, conditions, exceptions, numbers, units, dates and uncertainty.</p></article><article class="item"><h3>Keep exact evidence</h3><p>Use exact quotations when wording matters. Link every derived claim to its source.</p></article><article class="item"><h3>Reject unsafe rewrites</h3><p>Flag meaning changes or unsupported additions. Keep the original available.</p></article><article class="item"><h3>Test both forms</h3><p>Compare decisions from original and rewritten context on representative and difficult cases.</p></article></div><p class="slide-note">Meaning-checking workflow proposed; implementation and ASD-STE100 compliance unverified.</p></section>
<section class="slide type-governance" id="static-fifteen-responsibilities"><p class="eyebrow">Planning breakdown</p><h2>15 responsibilities: 12 lifecycle and 3 governance</h2><p class="lead">These are logical responsibilities. They do not require 15 agents or services.</p><div class="items"><article class="item"><h3>1–3 · Capture sources</h3><p>Register sources; capture and version originals; parse and segment material.</p></article><article class="item"><h3>4–6 · Validate proposals</h3><p>Classify scope and content; extract memory proposals; check evidence, time, conflicts and uncertainty.</p></article><article class="item"><h3>7–9 · Maintain usable state</h3><p>Persist labeled memory and history; maintain derived indexes; resolve the active goal and constraints.</p></article><article class="item"><h3>10–12 · Support the task</h3><p>Retrieve and rank permitted evidence; assemble and check STE-inspired context; apply feedback, corrections and forgetting.</p></article><article class="item"><h3>13–15 · Govern the lifecycle</h3><p>Enforce policy and permissions; audit provenance; evaluate quality and reliability.</p></article></div><p class="slide-note">Planning count, not a universal architecture rule. Retention applies across the lifecycle. Full external-action execution needs separate acceptance checks.</p></section>
<section class="slide type-governance" id="static-human-review-routes"><p class="eyebrow">Six human review routes</p><h2>Review consequential choices at setup, milestones and exceptions</h2><p class="lead">Routine requests can proceed within approved rules. Human review handles material changes or uncertainty.</p><div class="items"><article class="item"><h3>Source scope</h3><p>Approve initial sources and material expansion of access.</p></article><article class="item"><h3>Evidence conflict</h3><p>Resolve disagreements that materially affect a decision.</p></article><article class="item"><h3>Goal or authority ambiguity</h3><p>Clarify material uncertainty about intent or permitted action.</p></article><article class="item"><h3>Retention or deletion</h3><p>Approve consequential choices about originals, derived views and backups.</p></article><article class="item"><h3>Policy or permission change</h3><p>Review changes to trusted rules, access or action authority.</p></article><article class="item"><h3>Acceptance or autonomy</h3><p>Accept milestone evidence and approve any broader autonomous scope.</p></article></div><p class="slide-note">Retrieved instructions cannot change trusted policy or create permission.</p></section>
<section class="slide type-upgrade" id="static-upgrade-example"><p class="eyebrow">Interactive design example</p><h2>Replace a model without losing the task</h2><p class="lead">Explore an illustrative upgrade: export the vault, change one component, rebuild its views and apply the same acceptance gates.</p><div class="diagram-grid"><pre class="contract-card">record: claim-017
source: policy-v3, paragraph 4
project: example-project
valid_from: 2026-09-01
status: supported

           until review ends.

Format can change through migration.
Meaning and permissions must survive.</pre><div><div class="item"><h3>Illustrative contract checks</h3><p>The browser example accepts a change that preserves the record. It rejects missing evidence, a removed exception, or expanded permission. These checks do not call a model. Enable JavaScript to run the four examples.</p></div><div class="items"><article class="item"><h3>Compare</h3><p>Check evidence recovery, correctness, abstention, meaning, context size, latency and cost.</p></article><article class="item"><h3>Approve or reject</h3><p>Promote only within approved scope after agreed gates pass.</p></article><article class="item"><h3>Recover</h3><p>Roll back a failed candidate and resume with goals, history and verified outcomes intact.</p></article></div></div></div><p class="slide-note">This browser example checks one fixed record. Real model comparison, migration, recovery and performance tests remain unverified.</p></section>
<section class="slide type-roadmap" id="static-development-gates"><p class="eyebrow">Completion plan</p><h2>Develop through usable outcomes and acceptance gates</h2><p class="lead">Agree thresholds from the first vault and its actual tasks. No dates or performance targets are committed.</p><div class="items"><article class="item"><h3>1 · Define the boundary</h3><p>Agree runtime, privacy, sources, authority and contract. Gate: review concrete records and cases.</p></article><article class="item"><h3>2 · Build the evidence vault</h3><p>Ingest and export a small approved corpus. Gate: restore scope, history and references.</p></article><article class="item"><h3>3 · Prove memory behavior</h3><p>Test restart, project separation, updates and conflicts. Gate: supported answers or explicit uncertainty.</p></article><article class="item"><h3>4 · Prove context selection</h3><p>Compare decision candidates and STE views. Gate: agreed correctness, calibration and meaning checks.</p></article><article class="item"><h3>5 · Prove governance</h3><p>Test hostile source instructions, correction, revocation and deletion. Gate: authority and retention rules hold.</p></article><article class="item"><h3>6 · Prove change and recovery</h3><p>Swap components and roll back. Gate: resume tasks and preserve verified state.</p></article></div><p class="slide-note">All runtime gates are currently unverified. Expand only when a demonstrated requirement justifies it.</p></section>
<section class="slide type-evidence" id="static-evidence-boundary"><p class="eyebrow">What is known</p><h2>Research supports candidates, not system acceptance</h2><p class="lead">Public artifacts and documentation provide a starting point. The proposed layer still needs implementation and local proof.</p><div class="items"><article class="item"><h3>Source-level evidence</h3><p>Model artifacts, author code, documented memory capabilities and research-informed checks were reviewed.</p></article><article class="item"><h3>Local proof pending</h3><p>No weights, installation, inference, benchmark, personal-source ingestion or agent integration was run.</p></article><article class="item"><h3>Limits remain</h3><p>Provenance does not prove truth. A format guarantee does not prove correctness. A tool attempt does not prove success.</p></article><article class="item"><h3>Evaluate changes</h3><p>Keep fitting and final evaluation cases separate. Add cases when new failures appear.</p></article></div><p class="slide-note">Evidence checkpoint: research-shortlist.md, 2026-10-05. Sources: longmemeval, tangle, prov, nist.</p></section>
<section class="slide type-decisions" id="static-next-decisions"><p class="eyebrow">Next concrete decisions</p><h2>Define the first vault before choosing the stack</h2><p class="lead">The next deliverable is a reviewable context contract and acceptance set for one approved use case.</p><div class="items"><article class="item"><h3>Runtime and privacy</h3><p>Choose fully local Windows/WSL or local memory with approved hosted inference.</p></article><article class="item"><h3>Initial sources</h3><p>Select files, notes, chats or an existing vault; define project separation and retention.</p></article><article class="item"><h3>Acceptance and authority</h3><p>Choose representative tasks, material failure cases and permitted actions.</p></article><article class="item"><h3>Candidate feasibility</h3><p>Check hardware, provider behavior, licenses and export/recovery before selection.</p></article></div><p class="slide-note">No framework or model decision is locked.</p></section>
