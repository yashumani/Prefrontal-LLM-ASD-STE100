<section class="slide type-cover" id="static-opening-thesis"><div class="cover-grid"><div><p class="eyebrow">Prefrontal · enterprise AI context</p><h1>Put the right context behind every AI task.</h1><p class="lead">A governed context product for your AI workflows. Reuse organizational knowledge. Control the task. Prove the value.</p><div class="items"><article class="item"><h3>A reusable product</h3><p>One context foundation across domain-specific workflows.</p></article><article class="item"><h3>A measured pilot</h3><p>Agree the baseline, quality gates and benefit owner.</p></article></div></div><div class="industry-hero-visual"><figure class="mechanism-figure"><svg viewBox="0 0 720 510" role="img" aria-labelledby="industry-product-1-title industry-product-1-desc" class="motion-diagram industry-svg industry-svg-atlas product-map" preserveAspectRatio="xMidYMid meet"><title id="industry-product-1-title">Prefrontal connects cost, performance, accuracy and trust through governed context</title><desc id="industry-product-1-desc">Four product objectives surround one proposed governed context layer. Cost, performance, accuracy and trust need agreed pilot measurements. This diagram reports no achieved result.</desc><defs><marker id="industry-product-1-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #147dfa)"/></marker></defs><path d="M360 38V475M35 255H685" stroke="#254963" stroke-dasharray="2 8" fill="none"/><circle cx="360" cy="255" r="151" fill="none" stroke="#254963" stroke-dasharray="3 8"/><circle cx="360" cy="255" r="118" fill="none" stroke="#345e78"/><g class="m-edge m-stage" data-step="0"><path id="industry-product-1-cost" d="M270 94 C348 94 302 172 336 206" fill="none" stroke="var(--cost, #16a9c3)" stroke-width="2.5" marker-end="url(#industry-product-1-arrow)"/></g><g class="m-edge m-stage" data-step="1"><path id="industry-product-1-performance" d="M450 94 C372 94 418 172 384 <section class="slide type-problem" id="static-fragmented-context"><p class="eyebrow">The buyer problem</p><h2>Every task pays for missing context.</h2><p class="lead">Teams spend effort finding evidence, reconciling changes and reviewing AI work. A shared context product targets that repeated work.</p><div class="items"><article class="item"><h3>Repeated setup</h3><p>People explain definitions, ownership and exceptions again for each workflow.</p></article><article class="item"><h3>Avoidable work</h3><p>Irrelevant context, retries and manual reconciliation can add cost and delay.</p></article><article class="item"><h3>Uncertain answers</h3><p>Missing dates or conditions can make an answer unsuitable for the task.</p></article><article class="item"><h3>Unclear accountability</h3><p>Teams need to see which evidence, permissions and review decisions support a result.</p></article></div><p class="slide-note">Buyer problem hypotheses. Measure their frequency and cost in the first workflow; industry pressure figures do not quantify them.</p></section>
<section class="slide type-pitch-insights" id="static-enterprise-lessons"><p class="eyebrow">Why this product · enterprise field insights</p><h2>Enterprise value needs an operating model.</h2><p class="lead">Enterprise conference field notes connect business meaning, appropriate methods and lifecycle control. Prefrontal brings those ideas into one proposed context product.</p><div class="conference-insights"><div class="conference-grid"><article class="conference-insight"><span class="design-label">FIELD INSIGHT · EXHIBITS 08, 15, 17</span><h3>Make knowledge reusable</h3><p>Data access needs business definitions, relationships and expert interpretation.</p><h4>Product implication</h4><p>Capture approved knowledge once. Carry its sources and conditions into each relevant task.</p></article><article class="conference-insight"><span class="design-label">FIELD INSIGHT · EXHIBITS 12, 13, 14</span><h3>Choose a capable path</h3><p>A task can use rules, retrieval, a small model or deeper reasoning.</p><h4>Product implication</h4><p>Compare complete task cost and quality. Route within permissions and freshness limits.</p></article><article class="conference-insight"><span class="design-label">FIELD INSIGHT · EXHIBITS 05, 07, 09, 20</span><h3>Prove the operating model</h3><p>Production work needs ownership, evaluation, lifecycle controls and recovery.</p><h4>Product implication</h4><p>Start with a bounded workflow. Establish a baseline and agreed expansion gates.</p></article></div><p class="conference-scope">1 September 2026 · 20 exhibits. Independent field report: 19 conference reconstructions and one personal synthesis. These are not official slides or product benchmarks.</p><a class="conference-citation" href="https://ai-enterprise-journey-2026.yashumani.chatgpt.site/">AI Enterprise Conference 2026 — Yashu Sharma’s Field Report</a></div><p class="slide-note">Source: Yashu Sharma’s independent field report, 1 September 2026. Vendor savings claims are not used as Prefrontal results.</p></section>
<section class="slide type-pitch-value" id="static-buyer-value"><p class="eyebrow">The value proposition</p><h2>Four outcomes. One accountable pilot.</h2><p class="lead">Design for cost, performance, accuracy and trust together. Agree how each outcome will be measured before implementation.</p><div class="value-grid"><article class="value-lens" data-lens="cost" style="--sector:#16a9c3"><span class="value-name">Cost</span><h3>Control cost per accepted task</h3><p class="value-mechanism">Bound context size. Reuse valid views. Choose a capable route.</p><h4>Measure</h4><p class="value-measure">All-in recurring cost per accepted task, plus one-time setup cost.</p><p class="value-guardrail">Include review, rework, retrieval and operations. Token savings alone do not establish value.</p></article><article class="value-lens" data-lens="performance" style="--sector:#efaa28"><span class="value-name">Performance</span><h3>Keep routine work responsive</h3><p class="value-mechanism">Use bounded decisions and fast paths. Escalate when the task needs more work.</p><h4>Measure</h4><p class="value-measure">End-to-end median and p95 latency, throughput and retries at agreed load.</p><p class="value-guardrail">p95 is the time within which 95% of measured tasks finish. Compare the same workload and quality gates.</p></article><article class="value-lens" data-lens="accuracy" style="--sector:#ed607d"><span class="value-name">Accuracy</span><h3>Preserve the meaning behind the answer</h3><p class="value-mechanism">Carry source links, dates, conditions and conflicts. Check derived statements.</p><h4>Measure</h4><p class="value-measure">Domain-reviewed task acceptance, supported claims and appropriate abstention.</p><p class="value-guardrail">Abstention means withholding a conclusion when evidence is insufficient. A correct format does not prove a correct answer.</p></article><article class="value-lens" data-lens="trust" style="--sector:#8c67db"><span class="value-name">Trust</span><h3>Make control visible</h3><p class="value-mechanism">Enforce scope and permission. Show the evidence, owner and review decision.</p><h4>Measure</h4><p class="value-measure">Boundary-test results, audit coverage, owner approval and user confidence.</p><p class="value-guardrail">Measure user confidence separately from correctness. Model confidence cannot create authority.</p></article></div><p class="slide-note">Product objectives and proposed mechanisms. No improvement, benchmark or trust score has been established for Prefrontal.</p></section>
<section class="slide type-foundation" id="static-durable-foundation"><p class="eyebrow">The product</p><h2>A context foundation around your AI workflows.</h2><p class="lead">Prefrontal is designed to organize approved knowledge, assemble task context and preserve control as components change.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-cover-2-title context-cover-2-desc" class="motion-diagram motion-diagram-cover" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-cover-2-title">Evidence becomes working context within a permission boundary</title><desc id="context-cover-2-desc">Original sources link to structured memory, which supplies the current task context. Replaceable model, search and tool adapters consume this context. A permission boundary governs every layer. This is an unimplemented architecture proposal.</desc><defs><marker id="context-cover-2-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #2f5aa6)"/></marker><marker id="context-cover-2-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><rect x="28" y="30" width="464" height="333" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="134" y="17" width="252" height="26" rx="12" fill="var(--canvas, #eaf2f8)" stroke="none" stroke-width="1.5" /><text x="260" y="36" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Consolas, monospace" font-size="15" font-weight="600">PERMISSION BOUNDARY</text><g class="m-edge m-stage" data-step="1"><path id="context-cover-2-source-memory" d="M260 111 L260 130" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-cover-2-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-cover-2-memory-context" d="M260 186 L260 205" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-cover-2-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-cover-2-context-adapters" d="M260 261 L260 280" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-cover-2-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Original sources" data-stage-detail="Keep owned, versioned source records as the evidence base."><rect x="71" y="55" width="378" height="56" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="80" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Original sources</text><text x="260" y="102" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Versioned records · ownership</text></g><g class="m-node m-stage" data-step="1" data-stage="Evidence-linked memory" data-stage-detail="Link claims to their source evidence and retain provenance and uncertainty."><rect x="71" y="130" width="378" height="56" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="155" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Evidence-linked memory</text><text x="260" y="177" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Claims · provenance · uncertainty</text></g><g class="m-node m-stage" data-step="2" data-stage="Working task context" data-stage-detail="Select permitted evidence relevant to the current task and goal."><rect x="71" y="205" width="378" height="56" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="230" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Working task context</text><text x="260" y="252" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Current goal · relevant evidence</text></g><g class="m-node m-stage" data-step="3" data-stage="Replaceable adapters" data-stage-detail="Pass permitted task context to model, search, or authorized tool adapters."><rect x="71" y="280" width="378" height="56" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="305" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Replaceable adapters</text><text x="260" y="327" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Models · search · authorized tools</text></g><text x="260" y="354" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Authority applies across every layer.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Connect your knowledge</h3><p>Adapt approved documents, records and tools to shared context rules.</p></article><article class="item"><h3>Keep meaning and ownership</h3><p>Carry source identity, dates, exceptions, uncertainty and the responsible owner.</p></article><article class="item"><h3>Fit your model strategy</h3><p>Use adapters around models, retrieval and tools. Keep the context contract explicit.</p></article><article class="item"><h3>Qualify each workflow</h3><p>Configure domain definitions, permissions, review and acceptance cases for each customer.</p></article></div></div><p class="slide-note">Proposed product architecture. Integrations and runtime behavior require implementation and customer-specific qualification.</p></section>
<section class="slide type-pipeline" id="static-governed-ingestion"><p class="eyebrow">How it works</p><h2>Turn approved evidence into useful task context.</h2><p class="lead">One lifecycle carries the source, its meaning and its authority into the task. Corrections flow into the affected views.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-pipeline-3-title context-pipeline-3-desc" class="motion-diagram motion-diagram-pipeline" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-pipeline-3-title">Evidence admission: capture, propose, validate and commit</title><desc id="context-pipeline-3-desc">Capture preserves the original source. Propose creates candidate claims, not verified facts. A policy gate controls validation. Validate checks evidence, conflicts and scope before commit stores admitted claims with status. This is an unimplemented architecture proposal.</desc><defs><marker id="context-pipeline-3-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #2f5aa6)"/></marker><marker id="context-pipeline-3-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><text x="260" y="28" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Consolas, monospace" font-size="15" font-weight="600">EVIDENCE ADMISSION</text><g class="m-edge m-stage" data-step="1"><path id="context-pipeline-3-capture-propose" d="M221 108 L299 108" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-pipeline-3-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-pipeline-3-propose-validate" d="M398 152 L398 234" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-pipeline-3-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-pipeline-3-validate-commit" d="M299 280 L221 280" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-pipeline-3-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Capture" data-stage-detail="Preserve the original source and its version before proposing claims."><rect x="24" y="58" width="197" height="94" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="41" y="82" text-anchor="start" fill="var(--blue, #2f5aa6)" font-family="Consolas, monospace" font-size="15" font-weight="500">01</text><text x="72" y="82" text-anchor="start" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Capture</text><text x="122.5" y="111" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Original stays original</text><text x="122.5" y="134" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Retain source + version</text></g><g class="m-node m-stage" data-step="1" data-stage="Propose" data-stage-detail="Create candidate claims whose evidence and status still require validation."><rect x="299" y="58" width="197" height="94" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="316" y="82" text-anchor="start" fill="var(--blue, #2f5aa6)" font-family="Consolas, monospace" font-size="15" font-weight="500">02</text><text x="347" y="82" text-anchor="start" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Propose</text><text x="397.5" y="111" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Candidate claims</text><text x="397.5" y="134" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Proposal ≠ verified fact</text></g><g class="m-node m-stage" data-step="2" data-stage="Validate" data-stage-detail="Check evidence, conflicts, scope, and permission through the policy gate."><rect x="299" y="234" width="197" height="94" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="316" y="258" text-anchor="start" fill="var(--blue, #2f5aa6)" font-family="Consolas, monospace" font-size="15" font-weight="500">03</text><text x="347" y="258" text-anchor="start" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Validate</text><text x="397.5" y="287" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Evidence · conflicts</text><text x="397.5" y="310" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Scope + permission</text></g><g class="m-node m-stage" data-step="3" data-stage="Commit" data-stage-detail="Store admitted claims with status and a reference to their source evidence."><rect x="24" y="234" width="197" height="94" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="41" y="258" text-anchor="start" fill="var(--cyan, #53c8d8)" font-family="Consolas, monospace" font-size="15" font-weight="500">04</text><text x="72" y="258" text-anchor="start" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600">Commit</text><text x="122.5" y="287" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Admit with status</text><text x="122.5" y="310" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Link back to evidence</text></g><g class="m-node m-stage" data-step="2"><rect x="324" y="178" width="148" height="34" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" /><text x="398" y="201" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Consolas, monospace" font-size="15" font-weight="600">POLICY GATE</text></g><text x="201" y="188" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">Claims require</text><text x="201" y="210" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500">admission checks.</text><text x="260" y="356" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">A source reference remains with each admitted claim.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Admit</h3><p>Check source scope and access. Keep permitted originals and revisions.</p></article><article class="item"><h3>Reconcile</h3><p>Link claims to evidence. Preserve time, exceptions and unresolved conflicts.</p></article><article class="item"><h3>Prepare</h3><p>Create searchable and clear task views. Keep their dependencies visible.</p></article><article class="item"><h3>Maintain</h3><p>Apply corrections, access revocation and retention rules to derived views.</p></article></div></div><p class="slide-note">Proposed lifecycle. A memory proposal becomes usable only through the agreed evidence and policy checks.</p></section>
<section class="slide type-router" id="static-bounded-decision-router"><p class="eyebrow">Cost and performance</p><h2>Choose a capable path for each task.</h2><p class="lead">Routine work may use valid cached context, retrieval or a bounded decision. Escalate when evidence or complexity requires more.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-router-4-title context-router-4-desc" class="motion-diagram motion-diagram-router" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-router-4-title">A bounded request router governed outside the model</title><desc id="context-router-4-desc">A request with a goal and constraints enters a bounded decision. Guard policy outside the model restricts routes to permitted memory access, authorized tools or labeled reasoning. A model cannot grant itself permission. This is an unimplemented architecture proposal.</desc><defs><marker id="context-router-4-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #2f5aa6)"/></marker><marker id="context-router-4-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><rect x="16" y="118" width="488" height="251" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" stroke-dasharray="7 5"/><rect x="64" y="108" width="392" height="24" rx="12" fill="var(--canvas, #eaf2f8)" stroke="none" stroke-width="1.5" /><text x="260" y="127" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Consolas, monospace" font-size="15" font-weight="600">GUARD POLICY · OUTSIDE THE MODEL</text><g class="m-edge m-stage" data-step="1"><path id="context-router-4-request-decision" d="M260 95 L260 152" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-router-4-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-router-4-decision-memory" d="M260 218 V247 H96 V283" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-router-4-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-router-4-decision-tool" d="M260 218 L260 283" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-router-4-arrow)"/></g><g class="m-edge m-stage" data-step="4"><path id="context-router-4-decision-reasoning" d="M260 218 V247 H424 V283" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-router-4-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Request" data-stage-detail="Establish the goal, scope, constraints, and existing permissions for the request."><rect x="111" y="34" width="298" height="61" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="59" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Request + goal</text><text x="260" y="81" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Scope · constraints · permissions</text></g><g class="m-node m-stage" data-step="1" data-stage="Bounded decision" data-stage-detail="External guard policy restricts the available branch alternatives for this request."><rect x="132" y="152" width="256" height="66" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="177" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Bounded decision</text><text x="260" y="199" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Only permitted routes</text></g><g class="m-node m-stage" data-step="2" data-stage="Memory option" data-stage-detail="Memory lookup is a permitted branch alternative, not a required step before tools or reasoning."><rect x="27" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="96" y="308" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Memory</text><text x="96" y="330" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Evidence lookup</text></g><g class="m-node m-stage" data-step="3" data-stage="Tool option" data-stage-detail="An authorized tool is a scoped branch alternative, not a mandatory next step after memory."><rect x="191" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="260" y="307" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">Authorized tool</text><text x="260" y="330" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Scoped action</text></g><g class="m-node m-stage" data-step="4" data-stage="Reasoning option" data-stage-detail="Labeled reasoning is a branch alternative, not a mandatory step after the other options."><rect x="355" y="283" width="138" height="62" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="424" y="308" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Reasoning</text><text x="424" y="330" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Label inference</text></g><text x="260" y="362" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">A model cannot grant itself permission.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Bound the work</h3><p>Limit inputs and options to the active task. Keep uncertainty visible.</p></article><article class="item"><h3>Reuse with conditions</h3><p>Check source versions, freshness, scope and permissions before using a cached view.</p></article><article class="item"><h3>Measure the complete path</h3><p>Include retrieval, reasoning, tools, retries and review in cost and latency.</p></article><article class="item"><h3>Protect quality</h3><p>A lower-cost path must meet the same acceptance and authority gates.</p></article></div></div><p class="slide-note">Routing is a design proposal. No method is always cheapest; local workload measurements decide. Candidate decision models remain unqualified.</p></section>
<section class="slide type-ste" id="static-meaning-preserving-ste"><p class="eyebrow">Accuracy and clarity</p><h2>Clear language. Preserved meaning.</h2><p class="lead">Give the agent and reviewer a concise task view. Carry the conditions that determine the correct decision.</p><div class="ste-example"><div class="example-panel"><span class="label">ORIGINAL · ILLUSTRATIVE</span><p>Reports should be retained for a period of 30 days, except where a dispute remains open, in which case retention continues until the review concludes.</p></div><div class="example-panel"><span class="label">STE-INSPIRED VIEW</span><p>Keep reports for 30 days. If a dispute remains open, keep the report until the review ends.</p></div></div><div class="items"><article class="item"><h3>Preserve the decision</h3><p>Keep negation, conditions, exceptions, numbers, units, dates and uncertainty.</p></article><article class="item"><h3>Keep evidence available</h3><p>Link derived statements to source records. Retain exact wording where it matters.</p></article><article class="item"><h3>Check the rewrite</h3><p>Detect omitted conditions and unsupported additions. Flag unresolved meaning.</p></article><article class="item"><h3>Measure both forms</h3><p>Compare task decisions from original and simplified context on difficult cases.</p></article></div><p class="slide-note">STE-inspired approach. Full ASD-STE100 compliance and meaning preservation require validation; concise writing alone cannot guarantee accuracy.</p></section>
<section class="slide type-governance" id="static-human-review-routes"><p class="eyebrow">Trust and accountability</p><h2>Put authority where the responsibility sits.</h2><p class="lead">Use routine automation within approved rules. Give owners clear review points for consequential decisions and exceptions.</p><div class="items"><article class="item"><h3>Source scope</h3><p>Approve initial sources and material expansion of access.</p></article><article class="item"><h3>Evidence conflict</h3><p>Resolve disagreements that materially affect a decision.</p></article><article class="item"><h3>Goal or authority ambiguity</h3><p>Clarify material uncertainty about intent or permitted action.</p></article><article class="item"><h3>Retention or deletion</h3><p>Approve consequential choices about originals, derived views and backups.</p></article><article class="item"><h3>Policy or permission change</h3><p>Review changes to trusted rules, access or action authority.</p></article><article class="item"><h3>Acceptance or autonomy</h3><p>Accept milestone evidence and approve any broader autonomous scope.</p></article></div><p class="slide-note">Proposed controls. Trusted policy enforces permission; retrieved instructions and model confidence cannot change it.</p></section>

<section class="slide type-industry-case" id="static-telecom-context"><p class="eyebrow">Telecom · application example</p><h2>Turn alerts into reviewable incident briefs.</h2><p class="lead">For network operations, connect an alert to the service, recent changes and approved next checks.</p><div class="industry-case" data-sector="telecom" style="--sector:#16a9c3"><div class="industry-case-intro"><article class="industry-metric" data-sector="telecom" style="--sector:#16a9c3"><strong class="metric-value">+23%</strong><p class="metric-label">Mobile network data traffic growth</p><svg viewBox="0 0 440 155" role="img" aria-labelledby="industry-metric-9-title industry-metric-9-desc" class="insight-chart" preserveAspectRatio="xMidYMid meet" data-sector="telecom"><title id="industry-metric-9-title">Telecommunications: +23%. Mobile network data traffic growth</title><desc id="industry-metric-9-desc">Global mobile networks, including fixed wireless access. Q2 2025 → Q2 2026. Traffic growth does not measure incident rates or missing context. Indexed chart: Q2 2025 = 100. Fixed wireless access delivers broadband to a fixed location through a mobile network.</desc><text x="5" y="44" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">Q2 2025</text><rect class="chart-fill" data-value="100" x="110" y="26" width="223.0769230769231" height="27" rx="4" fill="#9eafbe"/><text x="338.0769230769231" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">100</text><text x="5" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="var(--ink, #102d3e)">Q2 2026</text><rect class="chart-fill" data-value="123" x="110" y="74" width="274.38461538461536" height="27" rx="4" fill="#16a9c3"/><text x="389.38461538461536" y="94" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text- ions: proposed evidence-to-review workflow</title><desc id="industry-flow-10-desc">Investigate a congestion alert. Link the evidence. The network operator approves any configuration change. The agent cannot grant itself access. Prepare: Incident brief with sources, unknowns and proposed next checks. This is an illustrative, unimplemented workflow.</desc><defs><marker id="industry-flow-10-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #147dfa)"/></marker></defs><text x="22" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" fill="var(--muted, #50677b)">PROPOSED WORKFLOW · REVIEWABLE OUTPUT</text><g class="m-edge m-stage" data-step="1"><path id="industry-flow-10-task-context" d="M188 121H238" fill="none" stroke="var(--telecom, #16a9c3)" stroke-width="2.5" marker-end="url(#industry-flow-10-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="industry-flow-10-context-check" d="M520 121H567" fill="none" stroke="var(--telecom, #16a9c3)" stroke-width="2.5" marker-end="url(#industry-flow-10-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="industry-flow-10-check-draft" d="M697 121H746" fill="none" stroke="var(--telecom, #16a9c3)" stroke-width="2.5" marker-end="url(#industry-flow-10-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Task arrives" data-stage-detail="Investigate a congestion alert."><rect x="22" y="66" width="166" height="110" rx="14" fill="var(--white, #fff)" stroke="var(--telecom, #16a9c3)" stroke-width="1.5"/><text x="105" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="var(--ink, #102d3e)">Task</text><text x="105" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="middle" fill="var(--ink, #102d3e)">Goal + entity</text></g><g class="m-node m-stage" data-step="1" data-stage="Lin <section class="slide type-industry-bridge" id="static-industry-linked-context"><p class="eyebrow">Cross-industry product fit</p><h2>Reuse the foundation. Adapt the workflow.</h2><p class="lead">Follow one task from its evidence to its responsible owner. Domain knowledge changes; the core checks remain consistent.</p><div class="industry-bridge-grid"><figure class="mechanism-figure"><svg viewBox="0 0 720 510" role="img" aria-labelledby="industry-atlas-17-title industry-atlas-17-desc" class="motion-diagram industry-svg industry-svg-atlas" preserveAspectRatio="xMidYMid meet"><title id="industry-atlas-17-title">Four industries connect to shared context checks in separate vaults</title><desc id="industry-atlas-17-desc">Telecom, electricity utilities, healthcare and hospitality have different pressures. Each task needs its own evidence, time, scope and responsible owner. Connections illustrate shared design checks, not data sharing between industries. Industry metrics appear with dates and sources on the case slides. Proposed architecture, not implemented.</desc><defs><marker id="industry-atlas-17-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #147dfa)"/></marker></defs><path d="M360 38V475M35 255H685" stroke="#254963" stroke-dasharray="2 8" fill="none"/><circle cx="360" cy="255" r="151" fill="none" stroke="#254963" stroke-dasharray="3 8"/><circle cx="360" cy="255" r="118" fill="none" stroke="#345e78"/><g class="m-edge m-stage" data-step="0"><path id="industry-atlas-17-telecom" d="M270 94 C348 94 302 172 336 206" fill="none" stroke="var(--telecom, #16a9c3)" stroke-width="2.5" marker-end="url(#industry-atlas-17-arrow)"/></g><g class="m-edge m-stage" data-step="1"><path id="industry-atlas-17-utilities" d="M450 94 C372 94 418 172 384 206" fill="none" stroke="var(--utilities, #efaa28)" stroke-width="2.5" marker-end="url(#industry-atlas-17-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="industry-atlas-17-healthcare" d="M270 414 C348 414 302 330 336 306" fill="none" stroke="var(--healthcare, #ed607d)" stroke-width="2.5" marker-end="url(#industry-atlas-17-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="industry-atlas-17-hospitality" d="M450 414 C372 414 418 330 384 306" fill="none" stroke="var(--hospitality, #8c67db)" stroke-width="2.5" marker-end="url(#industry-atlas-17-arrow)"/></g><g class="m-node m-stage" data-step="0" data-stage="Telecommunications" data-stage-detail="Link the alert to the right service, recent changes and current runbook. Draft cited options and prerequisites."><rect x="30" y="38" width="240" height="112" rx="14" fill="#12324a" stroke="var(--telecom, #16a9c3)" stroke-width="1.5"/><text x="47" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="var(--telecom, #16a9c3)">TELECOM</text><text x="47" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f3f8ff">+23%</text><text x="47" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#c5dbea">Traffic growth</text></g><g class="m-node m-stage" data-step="1" data-stage="Electricity utilities" data-stage-detail="Assemble a traceable review brief. Flag conflicting revisions and missing prerequisites before engineering review."><rect x="450" y="38" width="240" height="112" rx="14" fill="#12324a" stroke="var(--utilities, #efaa28)" stroke-width="1.5"/><text x="467" y="65" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="var(--utilities, #efaa28)">UTILITIES</text><text x="467" y="107" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f3f8ff">≥1,700 GW</text><text x="467" y="132" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#c5dbea">Queued renewables</text></g><g class="m-node m-stage" data-step="2" data-stage="Healthcare" data-stage-detail="Prepare a cited handoff that distinguishes current evidence, conflicts and unknowns. Keep clinical decisions with the clinician."><rect x="30" y="356" width="240" height="112" rx="14" fill="#12324a" stroke="var(--healthcare, #ed607d)" stroke-width="1.5"/><text x="47" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="var(--healthcare, #ed607d)">HEALTHCARE</text><text x="47" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f3f8ff">93% / 79%</text><text x="47" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#c5dbea">Receive / integrate</text></g><g class="m-node m-stage" data-step="3" data-stage="Hospitality" data-stage-detail="Link the guest request, room update and maintenance ticket. Draft a shift brief that marks unverified completion."><rect x="450" y="356" width="240" height="112" rx="14" fill="#12324a" stroke="var(--hospitality, #8c67db)" stroke-width="1.5"/><text x="467" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" fill="var(--hospitality, #8c67db)">HOSPITALITY</text><text x="467" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" fill="#f3f8ff">65%</text><text x="467" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start" fill="#c5dbea">Staffing shortages</text></g><g class="m-node m-stage" data-step="4" data-stage="Shared checks, separate vaults" data-stage-detail="Link evidence for one authorized task. Preserve time, conditions and authority. Keep industry and project records separate."><rect x="267" y="206" width="186" height="100" rx="22" fill="#e8f4fc" stroke="var(--cyan, #53c8d8)" stroke-width="1.5"/><text x="360" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#102d3e">Governed</text><text x="360" y="269" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#102d3e">context</text><text x="360" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#2f5aa6">EVIDENCE + OWNER</text></g><text x="360" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" text-anchor="middle" fill="#c5dbea">Shared checks do not mean shared private records.</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="static-bridge-cases"><article><h3>Telecom</h3><p>Investigate a congestion alert.</p><p>Incident brief with sources, unknowns and proposed next checks.</p><strong>Network operator</strong></article><article><h3>Utilities</h3><p>Review a renewable connection application.</p><p>Connection review brief with study references and unresolved engineering questions.</p><strong>Grid engineer / operator</strong></article><article><h3>Healthcare</h3><p>Prepare a draft care handoff.</p><p>Draft handoff with source links and clear review questions.</p><strong>Responsible clinician</strong></article><article><h3>Hospitality</h3><p>Hand over an open room-maintenance request.</p><p>Shift brief with verified status, owner, next action and escalation condition.</p><strong>Duty manager / staff</strong></article></div></div><p class="slide-note">Designed for cross-industry reuse. Each deployment needs its own integrations, permissions and acceptance evidence.</p></section>
<section class="slide type-pitch-calculator" id="static-value-assumptions"><p class="eyebrow">The business case · editable example</p><h2>Make the economics inspectable.</h2><p class="lead">Compare the same accepted-task target. Change the assumptions and see recurring cost, handling effort and one-time setup separately.</p><div class="business-case-static"><div class="business-case-grid"><table class="assumption-table"><caption>Invented example assumptions · USD</caption><tbody><tr><th scope="row">Accepted tasks / month</th><td data-assumption="target" data-value="1000">1000</td></tr><tr><th scope="row">Handling cost / hour ($)</th><td data-assumption="hourly" data-value="60">60</td></tr><tr><th scope="row">One-time setup ($)</th><td data-assumption="setup" data-value="5000">5000</td></tr><tr><th scope="row">Current digital cost / attempt ($)</th><td data-assumption="baselineCost" data-value="1.2">1.2</td></tr><tr><th scope="row">Proposed digital cost / attempt ($)</th><td data-assumption="candidateCost" data-value="0.7">0.7</td></tr><tr><th scope="row">Current handling minutes / attempt</th><td data-assumption="baselineMinutes" data-value="4">4</td></tr><tr><th scope="row">Proposed handling minutes / attempt</th><td data-assumption="candidateMinutes" data-value="2">2</td></tr><tr><th scope="row">Current accepted attempts (%)</th><td data-assumption="baselineAcceptance" data-value="80">80</td></tr><tr><th scope="row">Proposed accepted attempts (%)</th><td data-assumption="candidateAcceptance" data-value="80">80</td></tr><tr><th scope="row">Current fixed cost / month ($)</th><td data-assumption="baselineFixed" data-value="0">0</td></tr><tr><th scope="row">Proposed fixed cost / month ($)</th><td data-assumption="candidateFixed" data-value="1000">1000</td></tr></tbody></table><div class="business-case-results" data-outcome="lower-cost"><div class="business-case-result"><span>Current recurring / month</span><strong data-result="baseline" data-value="6500">$6,500.00</strong></div><div class="business-case-result"><span>Proposed recurring / month</span><strong data-result="candidate" data-value="4375">$4,375.00</strong></div><div class="business-case-result"><span>Recurring difference / month</span><strong data-result="difference" data-value="2125">$2,125.00</strong></div><div class="business-case-result"><span>Year-one net difference</span><strong data-result="yearOne" data-value="20500">$20,500.00</strong></div><div class="business-case-result"><span>Current cost / accepted task</span><strong data-result="baselineUnit" data-value="6.5">$6.50</strong></div><div class="business-case-result"><span>Proposed cost / accepted task</span><strong data-result="candidateUnit" data-value="4.375">$4.38</strong></div></div></div><p class="business-case-definition">Compare the same monthly number of accepted tasks. Accepted means the result passes the buyer’s task and quality criteria.</p><p class="business-case-formula">Attempts = accepted-task target ÷ acceptance rate. Monthly recurring cost = attempts × (digital cost + handling minutes × hourly rate ÷ 60) + fixed cost. Year-one net difference = 12 × monthly difference − one-time setup.</p><p class="business-case-scope">Digital cost includes inference, retrieval, tools and variable infrastructure. Handling includes review, rework and escalation. Fixed cost includes licensing and operations. Setup is shown separately.</p><p class="business-case-note">Invented example assumptions, not measured product savings or a price quote. Rates and workload stay constant for the year-one estimate. Validate them in a pilot. Positive economics do not override quality or permission gates.</p></div><p class="slide-note">Planning worksheet only. It runs arithmetic in this browser; it does not call a model or predict a customer result.</p></section>
<section class="slide type-pitch-proof" id="static-pilot-acceptance"><p class="eyebrow">Proof before expansion</p><h2>Agree the scorecard before the pilot.</h2><p class="lead">A lower bill is useful only when the workflow also meets its performance, quality and control requirements.</p><div class="proof-grid"><article class="proof-card" data-lens="cost"><h3>Cost</h3><h4>Measure</h4><p>Recurring cost per accepted task; one-time setup; maintenance effort.</p><h4>Trial</h4><p>Run baseline and candidate on the same accepted-task target. Include digital costs and human handling.</p><h4>Expansion gate</h4><p class="proof-decision">Expand only when the agreed economic case holds after full cost readback.</p></article><article class="proof-card" data-lens="performance"><h3>Performance</h3><h4>Measure</h4><p>Median and p95 completion time; throughput; retries; recovery time.</p><h4>Trial</h4><p>Use the same workload, load and quality standard. Include retrieval, tools and review queues.</p><h4>Expansion gate</h4><p class="proof-decision">Meet the owner’s service target without hiding tail latency or failed tasks.</p></article><article class="proof-card" data-lens="accuracy"><h3>Accuracy</h3><h4>Measure</h4><p>Task acceptance; source correctness; stale/conflict detection; abstention.</p><h4>Trial</h4><p>Keep held-out cases separate from development cases. Use domain review and deterministic checks.</p><h4>Expansion gate</h4><p class="proof-decision">Meet agreed quality gates. Investigate failures before expanding scope.</p></article><article class="proof-card" data-lens="trust"><h3>Trust</h3><h4>Measure</h4><p>Scope isolation; permission enforcement; evidence coverage; reviewer decisions.</p><h4>Trial</h4><p>Test hostile source instructions, revoked access, cross-vault retrieval and audit readback.</p><h4>Expansion gate</h4><p class="proof-decision">Hold release for a material boundary failure. Assess user confidence separately.</p></article></div><p class="slide-note">Thresholds need buyer agreement. No product performance, accuracy, certification or realized saving is claimed.</p></section>
<section class="slide type-upgrade" id="static-upgrade-example"><p class="eyebrow">Protect the investment · interactive design example</p><h2>Keep the context contract when models change.</h2><p class="lead">Explore a small contract example. Compare a replacement against the same evidence, meaning and authority checks.</p><div class="diagram-grid"><pre class="contract-card">record: claim-017
source: policy-v3, paragraph 4

Format can change through migration.
Meaning and permissions must survive.</pre><div><div class="item"><h3>Illustrative contract checks</h3><p>The browser example accepts a change that preserves the record. It rejects missing evidence, a removed exception, or expanded permission. These checks do not call a model. Enable JavaScript to run the four examples.</p></div><div class="items"><article class="item"><h3>Compare</h3><p>Check evidence recovery, correctness, abstention, meaning, context size, latency and cost.</p></article><article class="item"><h3>Approve or reject</h3><p>Promote only within approved scope after agreed gates pass.</p></article><article class="item"><h3>Recover</h3><p>Roll back a failed candidate and resume with goals, history and verified outcomes intact.</p></article></div></div></div><p class="slide-note">Browser demonstration on one fixed record. Real model migration, recovery and performance qualification remain pending.</p></section>
<section class="slide type-roadmap" id="static-development-gates"><p class="eyebrow">The pilot proposal</p><h2>Start with one workflow. Expand after proof.</h2><p class="lead">Scope the first implementation around an accountable owner and a repeatable task. Agree deliverables and exit criteria before work starts.</p><div class="items"><article class="item"><h3>Frame the pilot</h3><p>Choose workflow, sources, data boundary, permitted actions and benefit owner.</p></article><article class="item"><h3>Establish the baseline</h3><p>Record accepted-task cost, latency, review effort and failure cases.</p></article><article class="item"><h3>Build the context path</h3><p>Implement approved adapters, memory, task views and review boundaries.</p></article><article class="item"><h3>Evaluate together</h3><p>Use held-out cases and agreed load. Review quality, controls and complete costs.</p></article><article class="item"><h3>Prove maintenance</h3><p>Exercise source updates, access revocation, model replacement and recovery.</p></article><article class="item"><h3>Decide the rollout</h3><p>Review measured results and residual risks. Expand, revise or stop against agreed gates.</p></article></div><p class="slide-note">Proposed pilot scope. Dates, pricing, integration effort and success thresholds require agreement; runtime capabilities are not yet delivered.</p></section>
<section class="slide type-decisions" id="static-next-decisions"><p class="eyebrow">The next conversation</p><h2>Bring one workflow. Agree the proof.</h2><p class="lead">Partner on a measured Prefrontal pilot. Start where repeated context work matters and a responsible owner can judge the result.</p><div class="items"><article class="item"><h3>Choose the workflow</h3><p>Name the user, task, current process and business consequence.</p></article><article class="item"><h3>Bring the baseline</h3><p>Identify current costs, time, review effort and accepted-output criteria.</p></article><article class="item"><h3>Set the boundary</h3><p>Approve sources, privacy, permissions, human review and retention.</p></article><article class="item"><h3>Agree the decision</h3><p>Define pilot deliverables, commercial terms and evidence needed to expand.</p></article></div><p class="slide-note">Product concept and pilot-partner invitation. Customer value is measured in the pilot; no production service or price is represented as available today.</p></section>
<section class="slide type-contract" id="static-context-contract"><p class="eyebrow">Appendix · the product contract</p><h2>Define a versioned context contract</h2><p class="lead">The contract defines the records, meanings and rules that components exchange. Changes require compatible behavior or an explicit migration.</p><div class="diagram-grid"><pre class="contract-card">record: claim-017
source: policy-v3, paragraph 4
project: example-project
valid_from: 2026-09-01
status: supported
claim: Keep reports for 30 days.
exception: Keep disputed reports
           until review ends.
authority: read-only

Format can change through migration.
Meaning and permissions must survive.</pre><div class="items"><article class="item"><h3>Source record</h3><p>Stable ID, permitted original, revision, origin, scope and access rules.</p></article><article class="item"><h3>Claim record</h3><p>Statement, source references, conditions, uncertainty and competing claims.</p></article><article class="item"><h3>Time and dependencies</h3><p>Observed and valid dates; the inputs and versions used by each derived view.</p></article><article class="item"><h3>Task and authority</h3><p>Goal, constraints, pending decisions, permissions and intended, attempted or verified actions.</p></article></div></div><p class="slide-note">Evidence traceability explains origin and transformation. It does not prove a source is true. Source: prov.</p></section>
<section class="slide type-memory" id="static-layered-memory"><p class="eyebrow">Appendix · memory architecture</p><h2>Keep evidence durable and task context bounded.</h2><p class="lead">The proposed memory design separates permitted evidence from derived views and the current task. Each selected item keeps its source and selection reason.</p><div class="diagram-grid"><figure class="mechanism-figure"><svg viewBox="0 0 520 400" role="img" aria-labelledby="context-memory-18-title context-memory-18-desc" class="motion-diagram motion-diagram-memory" width="100%" preserveAspectRatio="xMidYMid meet"><title id="context-memory-18-title">Four memory layers with correction and invalidation</title><desc id="context-memory-18-desc">Original sources supply structured memory, rebuildable indexes and summaries, and the working task context. Correction or invalidation starts by checking the source, preserves original records, and rebuilds affected derived views under existing access and retention rules. Authority applies at every layer; a rebuilt view cannot grant permission. This is an unimplemented architecture proposal.</desc><defs><marker id="context-memory-18-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="var(--blue, #2f5aa6)"/></marker><marker id="context-memory-18-gold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--gold, #efb94e)"/></marker></defs><text x="260" y="26" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Consolas, monospace" font-size="15" font-weight="600">AUTHORITY ENFORCED AT EVERY LAYER</text><path d="M48 53 H31 V351 H48" fill="none" stroke="var(--gold, #efb94e)" stroke-width="3"/><g class="m-edge m-stage" data-step="1"><path id="context-memory-18-source-structured" d="M246 298 L246 271" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-memory-18-arrow)"/></g><g class="m-edge m-stage" data-step="2"><path id="context-memory-18-structured-views" d="M246 216 L246 189" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-memory-18-arrow)"/></g><g class="m-edge m-stage" data-step="3"><path id="context-memory-18-views-context" d="M246 134 L246 107" fill="none" stroke="var(--blue, #2f5aa6)" stroke-width="2"  marker-end="url(#context-memory-18-arrow)"/></g><g class="m-edge m-stage" data-step="4"><path id="context-memory-18-correction" d="M420 80 H487 V326 H420" fill="none" stroke="var(--gold, #efb94e)" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#context-memory-18-gold)"/></g><g class="m-node m-stage" data-step="0" data-stage="Original sources" data-stage-detail="Keep permitted source records under explicit retention rules. Preserve their versions to check generated memory."><rect x="71" y="298" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="245.5" y="323" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Original sources</text><text x="245.5" y="345" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Owned records · versions</text></g><g class="m-node m-stage" data-step="1" data-stage="Structured memory" data-stage-detail="Link claims, dates, status, and unresolved conflicts to source evidence. A model&apos;s assertion is not proof."><rect x="71" y="216" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="245.5" y="241" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Structured memory</text><text x="245.5" y="263" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Claims · provenance · status</text></g><g class="m-node m-stage" data-step="2" data-stage="Rebuildable views" data-stage-detail="Derive indexes, summaries, and caches from structured memory. Invalidate them when sources or access change."><rect x="71" y="134" width="349" height="55" rx="12" fill="var(--white, #ffffff)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="245.5" y="159" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Rebuildable views</text><text x="245.5" y="181" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Indexes · summaries · caches</text></g><g class="m-node m-stage" data-step="3" data-stage="Working context" data-stage-detail="Select permitted evidence for the current goal and constraints. Keep it within the model&apos;s input limit."><rect x="71" y="52" width="349" height="55" rx="12" fill="var(--navy, #172b4d)" stroke="var(--blue, #2f5aa6)" stroke-width="1.5" /><text x="245.5" y="77" text-anchor="middle" fill="var(--white, #ffffff)" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="600">Working context</text><text x="245.5" y="99" text-anchor="middle" fill="var(--cyan, #53c8d8)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Goal + selected evidence</text></g><text x="450" y="203" transform="rotate(90 450 203)" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15">Correct / invalidate</text><g class="m-node m-stage" data-step="4" data-stage="Correct or invalidate" data-stage-detail="Check the source while preserving original records, then rebuild affected derived views under existing access and retention rules."><rect x="424" y="276" width="80" height="32" rx="12" fill="var(--canvas, #eaf2f8)" stroke="var(--gold, #efb94e)" stroke-width="1.5" /><text x="464" y="289" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="500">Check source</text><text x="464" y="301" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="500">Rebuild views</text></g><text x="260" y="372" text-anchor="middle" fill="var(--ink, #102d3e)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Rebuilding a view cannot grant permission.</text><text x="260" y="390" text-anchor="middle" fill="var(--blue, #2f5aa6)" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="500">Architecture proposal · not implemented</text></svg><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><div class="items"><article class="item"><h3>Evidence vault</h3><p>Permitted originals and structured claims preserve history, scope and unresolved disagreements.</p></article><article class="item"><h3>Rebuildable views</h3><p>Search indexes, embeddings, caches, graphs and summaries derive from authorized evidence.</p></article><article class="item"><h3>Working task context</h3><p>Current goal, constraints, useful evidence, pending decisions and tool results fit the model input limit.</p></article><article class="item"><h3>Candidate foundations</h3><p>Compare OpenViking, Graphiti, Letta Code and Mem0 against actual tasks. No stack is selected.</p></article></div></div><p class="slide-note">Local runtime, provider behavior and integration remain unverified. Sources: openviking, graphiti, letta, mem0.</p></section>
<section class="slide type-governance" id="static-fifteen-responsibilities"><p class="eyebrow">Appendix · implementation responsibilities</p><h2>15 responsibilities: 12 lifecycle and 3 governance</h2><p class="lead">These are logical responsibilities. They do not require 15 agents or services.</p><div class="items"><article class="item"><h3>1–3 · Capture sources</h3><p>Register sources; capture and version originals; parse and segment material.</p></article><article class="item"><h3>4–6 · Validate proposals</h3><p>Classify scope and content; extract memory proposals; check evidence, time, conflicts and uncertainty.</p></article><article class="item"><h3>7–9 · Maintain usable state</h3><p>Persist labeled memory and history; maintain derived indexes; resolve the active goal and constraints.</p></article><article class="item"><h3>10–12 · Support the task</h3><p>Retrieve and rank permitted evidence; assemble and check STE-inspired context; apply feedback, corrections and forgetting.</p></article><article class="item"><h3>13–15 · Govern the lifecycle</h3><p>Enforce policy and permissions; audit provenance; evaluate quality and reliability.</p></article></div><p class="slide-note">Planning count, not a universal architecture rule. Retention applies across the lifecycle. Full external-action execution needs separate acceptance checks.</p></section>
<section class="slide type-evidence" id="static-evidence-boundary"><p class="eyebrow">Appendix · product maturity</p><h2>A clear view of what is ready and what comes next.</h2><p class="lead">The presentation and interactive examples are available. The context product still needs implementation and a qualified pilot.</p><div class="items"><article class="item"><h3>Available today</h3><p>Research-informed product story, source-backed industry examples and browser design demonstrations.</p></article><article class="item"><h3>Pilot implementation</h3><p>Approved data adapters, memory behavior, context selection and review workflows remain to be built.</p></article><article class="item"><h3>Proof to earn</h3><p>Demonstrate accepted-task economics, latency, accuracy, boundaries and recovery on the buyer’s workload.</p></article><article class="item"><h3>Expansion decision</h3><p>Use measured outcomes and owner approval. Qualify new domains and integrations before broader operation.</p></article></div><p class="slide-note">This pitch does not claim deployed context infrastructure, operational results, full compliance or future-proof performance.</p></section>

<section class="slide type-industry-sources" id="static-industry-evidence-sources"><p class="eyebrow">Appendix · industry evidence</p><h2>Inspect the four industry signals.</h2><p class="lead">Each figure keeps its primary source, date, population and unit. These are application context, not product benchmarks.</p><div class="source-grid"><article class="source-card"><a href="https://www.ericsson.com/en/reports-and-papers/mobility-report/dataforecasts/mobile-traffic-update">Ericsson Mobility Report · Q2 2026</a><p>+23% · Q2 2025 → Q2 2026. Global mobile networks, including fixed wireless access. Traffic growth does not measure incident rates or missing context. Indexed chart: Q2 2025 = 100.</p></article><article class="source-card"><a href="https://www.iea.org/reports/modernising-grids-in-the-age-of-electricity/executive-summary">IEA · Modernising Grids in the Age of Electricity</a><p>≥1,700 GW · Queue snapshot: 2025 · IEA report: 2026. Global renewable project capacity. Utility-scale batteries are reported separately. A lower-bound capacity snapshot, not a project count or capacity this system can connect.</p></article><article class="source-card"><a href="https://healthit.gov/data/quickstats/electronic-health-information-exchange-hospitals/">ONC · Health IT Quick Stat 66</a><p>93% / 79% · 2025 survey · ONC update: February 2026. U.S. non-federal acute-care hospitals. Weighted hospital-level survey estimates. Capability rates, not patient outcomes. These aggregate measures do not identify which hospitals lack integration.</p></article><article class="source-card"><a href="https://www.ahla.com/news/65-surveyed-hotels-report-staffing-shortages">AHLA / Hireology · Front Desk Feedback survey</a><p>65% · 6 Dec 2024–3 Jan 2025 · published February 2025. U.S.-focused AHLA survey of 282 hotelier respondents. Self-reported; not a census. A dated respondent result, not a current estimate for all hotels. The context layer does not create staff.</p></article></div><p class="slide-note">Readback: October 2026. Sources support the pressure metrics; proposed workflows and benefits still need acceptance evidence.</p></section>
