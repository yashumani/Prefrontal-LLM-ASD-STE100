rd summary. Token counts use words divided by 0.75. Cost bars apply the illustrative 4.5-times output price; they do not show the selected model bill.</desc><text x="8" y="20" class="cl-bold" >Tokens: 2,000 words in → 500 words out</text><text x="95" y="51" class="" text-anchor="end">Document</text><rect x="110" y="36" width="257.81" height="19" rx="3" class="cl-fill-dark"/><text x="408" y="51" class="cl-bold" >2,667</text><text x="95" y="90" class="" text-anchor="end">Summary</text><rect x="110" y="75" width="64.47666666666666" height="19" rx="3" class="cl-fill-red"/><text x="408" y="90" class="cl-bold" >667</text><text x="8" y="123" class="cl-bold" >Cost units: output rate = 4.5 × input rate</text><text x="95" y="154" class="" text-anchor="end">Document</text><rect x="110" y="139" width="257.81" height="19" rx="3" class="cl-fill-dark"/><text x="408" y="154" class="cl-bold" >2,667</text><text x="95" y="193" class="" text-anchor="end">Summary</text><rect x="110" y="178" width="290" height="19" rx="3" class="cl-fill-red"/><text x="408" y="193" class="cl-bold" >3,000</text><text x="8" y="226" class="cl-muted" >Illustration from v7. This rate ratio is not a price quote.</text></svg></div></figure></div><div class="cl-inline-metrics"><span>Input: <b data-cost-value="input-tokens" data-number="7120.666666666666">7,121 tokens</b></span><span>Output: <b data-cost-value="output-tokens" data-number="4333.333333333333">4,333 tokens</b></span><span>Cached reads: <b data-cost-value="cached-tokens" data-number="1936.8333333333333">1,937 tokens</b></span><span>Cache write: <b data-cost-value="cache-write" data-number="0.00237525">$0.0024</b></span></div></div><p class="cl-scope">Example assumptions. Model token cost only. Add licenses, data queries, review, setup, and operations in the full-cost worksheet. No model calls run here.</p><details class="cl-details"><summary>Default estimate assumptions</summary><div class="cl-default-summary">Question words: 30 · Instruction tokens: 500 · Tool definition tokens: 0 · Document and data tokens: 2667 · Messages per task: 2 · Calls per message: 1 · Tool result tokens per step: 0 · Tool call output tokens: 0 · Thinking tokens per call: 1500 · Answer words: 500 · Expected retry uplift (%): 5 · Eligible input cached (%): 50 · Input rate: 3 · Cache read rate: 0.3 · Output rate: 15 · Cache write multiplier: 1.25 · Tokenizer factor: 1 · Batch factor: 1 · Region factor: 1</div><p>Expected retry uplift applies to base cost. The first call can add a separate cache-write surcharge. Repeated input receives a cache discount only when eligible.</p></details><details class="cl-details cl-reference"><summary>Developer reference: rates, settings, and task choices</summary><p>These examples come from the supplied v7 reference. Verify each setting for your model and API. Test the recommendation on your task.</p><p>Supplied example rates. Not checked against current provider prices. All rates are editable.</p><ul><li>Cache share is an assumption. Confirm eligible prefixes, expiry, writes and storage with your provider.</li><li>The retry input adds an expected cost allowance. It does not simulate additional calls.</li><li>The source simple comparison prices the question and answer only. It excludes tools, context, history and thinking.</li><li>The source Flash example uses a future full rate. Its Pro example omits the stated long-context tier. Enter the rate that applies to your workload.</li><li>All non-question input is cache-eligible in the source calculation. Check each real provider prefix. The first-call write premium uses the full instructions, tools and document prefix.</li><li>Instruction, document and tool token fields are baseline estimates. Set the tokenizer factor to 1 for measured target-model token counts.</li><li>The question-and-answer comparison applies the selected tokenizer and region factors consistently. This corrects omissions in the source comparison. It is not a return-on-investment baseline.</li></ul><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Editable example model rate reference"><table><thead><tr><th>Example model</th><th>Input / 1M</th><th>Cache read / 1M</th><th>Output / 1M</th><th>Write multiplier</th><th>Tokenizer factor</th></tr></thead><tbody><tr><th>Claude Opus 5.5</th><td>4</td><td>0.2</td><td>20</td><td>1.25</td><td>1.2</td></tr><tr><th>Claude Opus 4.8</th><td>5</td><td>0.5</td><td>25</td><td>1.25</td><td>1.2</td></tr><tr><th>Claude Sonnet 5.5</th><td>2</td><td>0.2</td><td>10</td><td>1.25</td><td>1.3</td></tr><tr><th>Claude Sonnet 4.6</th><td>3</td><td>0.3</td><td>15</td><td>1.25</td><td>1</td></tr><tr><th>Claude Haiku 4.5</th><td>1</td><td>0.1</td><td>5</td><td>1.25</td><td>1</td></tr><tr><th>Gemini 3.1 Pro (preview)</th><td>2</td><td>0.2</td><td>12</td><td>1</td><td>1</td></tr><tr><th>Gemini 3.8 Flash</th><td>1.5</td><td>0.15</td><td>7.5</td><td>1</td><td>1</td></tr><tr><th>Gemini 3.1 Flash-Lite</th><td>0.25</td><td>No discount assumed</td><td>1.5</td><td>1</td><td>1</td></tr></tbody></table></div><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Model setting reference"><table><thead><tr><th>Setting</th><th>Purpose</th><th>Cost effect</th><th>Claude example</th><th>Gemini example</th><th>CLI example</th></tr></thead><tbody><tr><th>Model</th><td>Which model writes the answer.</td><td>Compare the applicable input and output rates. Qualify each model on the task before changing its size.</td><td>Source example — verify: Haiku 4.5 (small), Sonnet (medium), Opus (large).</td><td>Source example — verify: Flash-Lite (small), Flash (medium), Pro (large).</td><td>Source example — verify: /model. Set model: haiku for simple subagents.</td></tr><tr><th>Thinking depth</th><td>How much the model reasons before it answers.</td><td>Thinking tokens are billed as output tokens, even when you do not see them.</td><td>Source example — verify: effort: low, medium, high, xhigh, max. Default: medium on Opus 5.5, high on Sonnet 5.5. Thinking is always on for these models.</td><td>Source example — verify: thinking_level: minimal, low, medium, high. Default: high on 3.1 Pro and Flash, minimal on 3.1 Flash-Lite.</td><td>Source example — verify: /effort or CLAUDE_CODE_EFFORT_LEVEL. MAX_THINKING_TOKENS on models with a fixed budget.</td></tr><tr><th>Output limit</th><td>The maximum number of tokens that the model can write.</td><td>Limits the worst case. It does not make answers shorter. Ask for the length in the prompt. If the limit is too low, the answer stops early and you pay for a retry.</td><td>Source example — verify: max_tokens (required). A hard limit on thinking plus answer. For xhigh or max effort, start at 64k.</td><td>Source example — verify: maxOutputTokens.</td><td>Source example — verify: CLAUDE_CODE_MAX_OUTPUT_TOKENS.</td></tr><tr><th>Temperature</th><td>How random the word choice is.</td><td>No direct effect on the price.</td><td>Source example — verify: Range 0 to 1, default 1. Opus 4.7 and later and Sonnet 5.5 reject any other value (error 400). Sonnet 4.6 and Haiku 4.5 accept it.</td><td>Source example — verify: Range 0 to 2. On Gemini 3, keep 1.0. A lower value can cause loops, and loops cost tokens.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Top-P</th><td>Uses only the most likely words that together reach probability P.</td><td>No direct effect on the price.</td><td>Source example — verify: Same model rules as temperature. Do not set temperature and top_p together.</td><td>Source example — verify: topP.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Top-K</th><td>Uses only the K most likely next tokens.</td><td>No direct effect on the price.</td><td>Source example — verify: Same model rules as temperature.</td><td>Source example — verify: topK.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Stop sequences</th><td>Stops the answer at a text that you specify.</td><td>Fewer output tokens when the model would continue past the part that you need.</td><td>Source example — verify: stop_sequences.</td><td>Source example — verify: stopSequences.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Number of answers</th><td>How many answers the model writes for one request.</td><td>Additional candidates can add output cost. Check billing and task quality before changing the count.</td><td>Source example — verify: One answer for each request.</td><td>Source example — verify: candidateCount.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Output format</th><td>Makes the answer follow a JSON schema.</td><td>A schema can reduce format errors. Validate the result. Keep an explicit retry policy.</td><td>Source example — verify: output_config.format (structured outputs).</td><td>Source example — verify: responseMimeType and responseJsonSchema.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Image and PDF resolution</th><td>How many tokens each image or PDF page uses.</td><td>Resolution can change input token use. Measure the cost and task accuracy. The supplied token counts and medium-resolution advice are unverified examples.</td><td>Source example — verify: Image tokens grow with the image size. Send smaller images.</td><td>Source example — verify: media_resolution: low, medium, high, ultra_high.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Caching</th><td>Keeps the start of the prompt so the next request reads it at a low price.</td><td>Read, write and storage charges differ by provider and lifetime. Enter the applicable rates. Verify eligibility, expiry and hit rate.</td><td>Source example — verify: cache_control. Lifetime 5 minutes by default, or 1 hour.</td><td>Source example — verify: Implicit caching is on by default. Context caching for a fixed context. Gemini 3.x Flash caches only prompts of 4,096 tokens or more.</td><td>Source example — verify: Automatic. /usage shows the cache hit rate.</td></tr><tr><th>Batch</th><td>Sends many requests to run within 24 hours.</td><td>The source assumes a 0.5 price multiplier. Verify applicable pricing, deadlines and support before using it.</td><td>Source example — verify: Message Batches API.</td><td>Source example — verify: Batch Mode.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Speed and region</th><td>Faster answers or a fixed data region.</td><td>The source assumes optional multipliers. Verify the applicable product, region, speed and contract charges.</td><td>Source example — verify: Fast mode on Opus 5.5: $8 input and $40 output (2 times). US data residency: 1.1 times.</td><td>Source example — verify: Not in this table.</td><td>Source example — verify: Fast mode, when your plan has it.</td></tr><tr><th>Seed and penalties</th><td>Repeatable answers, or fewer repeated words.</td><td>No direct effect on the price.</td><td>Source example — verify: Not available.</td><td>Source example — verify: seed, presencePenalty, frequencyPenalty.</td><td>Source example — verify: Not a setting.</td></tr></tbody></table></div><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Example task setting recommendations"><table><thead><tr><th>Task</th><th>Model</th><th>Thinking</th><th>Output limit</th><th>Sampling</th><th>Format</th></tr></thead><tbody><tr><th>Extract or classify</th><td>Small: Claude Haiku 4.5 or Gemini Flash-Lite</td><td>Off or minimal</td><td>50 to 300 tokens</td><td>Lower sampling may reduce variation where supported. It does not guarantee identical answers. Test the provider setting.</td><td>JSON schema</td></tr><tr><th>Summarize</th><td>Medium: Claude Sonnet or Gemini Flash</td><td>Low</td><td>About 2 times the length that you ask for</td><td>Default</td><td>Bullets with a length limit. Use STE-inspired writing unless full compliance is checked.</td></tr><tr><th>Data question (SQL)</th><td>Medium</td><td>Medium</td><td>1,000 to 2,000 tokens</td><td>Default, or 0 on models that accept it</td><td>JSON that contains the SQL</td></tr><tr><th>Analysis agent</th><td>Large model to plan, small model for simple steps</td><td>Medium. High only for difficult steps.</td><td>16k to 64k tokens (thinking needs room)</td><td>Default</td><td>Structured tool calls and a step limit</td></tr><tr><th>Draft text for people</th><td>Medium</td><td>Low</td><td>About 2 times the length that you ask for</td><td>Default</td><td>Text with a word limit</td></tr><tr><th>Coding with Claude Code</th><td>Sonnet by default, Opus for architecture, Haiku for subagents</td><td>/effort medium. High for difficult problems.</td><td>Default</td><td>Not a setting</td><td>Not applicable</td></tr></tbody></table></div></details></div><p class="slide-note">The v7 planner is reproduced here with editable rates and shared settings. Every amount is an estimate. Model rates, cache eligibility and task volumes need validation.</p></section>

172" height="0" rx="0" class="cl-fill-dark"/><rect x="195" y="93.1749355846719" width="172" height="0.9078449646400966" rx="0" class="cl-fill-red-light"/><rect x="195" y="44.00000000000001" width="172" height="49.17493558467189" rx="0" class="cl-fill-red"/><text x="282.5" y="203" class="cl-muted" text-anchor="middle">2</text><text x="20" y="232" class="cl-muted" >Gray = context. Red = question + output.</text><text x="20" y="255" class="cl-muted" >Bars show tokens before retry uplift.</text></svg></div></figure><figure class="cl-figure"><figcaption>Where the estimate comes from</figcaption><div class="cl-chart-scroll" tabindex="0" role="region" aria-label="Where the estimate comes from"><svg class="cl-chart" data-chart="cost-breakdown" viewBox="0 0 430 270" role="img" aria-label="All nine cost categories and cache write"><title>All nine cost categories and cache write</title><desc>Category costs sum to the task estimate. Cache-write surcharge appears separately. Expected retry uplift is not a count of observed retries.</desc><text x="4" y="22" class="" >Question</text><rect x="200" y="8" width="0.7040000000000001" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="22" class="cl-bold" text-anchor="end">$0.0002</text><text x="4" y="47" class="" >Answer</text><rect x="200" y="33" width="58.66666666666667" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="47" class="cl-bold" text-anchor="end">$0.0200</text><text x="4" y="72" class="" >Instructions</text><rect x="200" y="58" width="6.82" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="72" class="cl-bold" text-anchor="end">$0.0023</text><text x="4" y="97" class="" >Tool list</text><rect x="200" y="83" width="0" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="97" class="cl-bold" text-anchor="end">$0.0000</text><text x="4" y="122" class="" >Documents and data</text><rect x="200" y="108" width="36.37788" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="122" class="cl-bold" text-anchor="end">$0.0124</text><text x="4" y="147" class="" >Repeated history</text><rect x="200" y="133" width="3.4202666666666666" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="147" class="cl-bold" text-anchor="end">$0.0012</text><text x="4" y="172" class="" >Tool steps and results</text><rect x="200" y="158" width="0" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="172" class="cl-bold" text-anchor="end">$0.0000</text><text x="4" y="197" class="" >Thinking</text><rect x="200" y="183" width="132" height="17" rx="3" class="cl-fill-red"/><text x="423" y="197" class="cl-bold" text-anchor="end">$0.0450</text><text x="4" y="222" class="" >Expected retries</text><rect x="200" y="208" width="12.247810666666668" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="222" class="cl-bold" text-anchor="end">$0.0042</text><text x="4" y="247" class="" >Cache-write surcharge</text><rect x="200" y="233" width="6.967400000000001" height="17" rx="3" class="cl-fill-dark"/><text x="423" y="247" class="cl-bold" text-anchor="end">$0.0024</text></svg></div></figure></div></div><p class="cl-scope">Example assumptions. Model token cost only. Add licenses, data queries, review, setup, and operations in the full-cost worksheet. No model calls run here.</p><details class="cl-details"><summary>Default estimate assumptions</summary><div class="cl-default-summary">Question words: 30 · Instruction tokens: 500 · Tool definition tokens: 0 · Document and data tokens: 2667 · Messages per task: 2 · Calls per message: 1 · Tool result tokens per step: 0 · Tool call output tokens: 0 · Thinking tokens per call: 1500 · Answer words: 500 · Expected retry uplift (%): 5 · Eligible input cached (%): 50 · Input rate: 3 · Cache read rate: 0.3 · Output rate: 15 · Cache write multiplier: 1.25 · Tokenizer factor: 1 · Batch factor: 1 · Region factor: 1</div><p>Expected retry uplift applies to base cost. The first call can add a separate cache-write surcharge. Repeated input receives a cache discount only when eligible.</p></details><details class="cl-details cl-reference"><summary>Developer reference: rates, settings, and task choices</summary><p>These examples come from the supplied v7 reference. Verify each setting for your model and API. Test the recommendation on your task.</p><p>Supplied example rates. Not checked against current provider prices. All rates are editable.</p><ul><li>Cache share is an assumption. Confirm eligible prefixes, expiry, writes and storage with your provider.</li><li>The retry input adds an expected cost allowance. It does not simulate additional calls.</li><li>The source simple comparison prices the question and answer only. It excludes tools, context, history and thinking.</li><li>The source Flash example uses a future full rate. Its Pro example omits the stated long-context tier. Enter the rate that applies to your workload.</li><li>All non-question input is cache-eligible in the source calculation. Check each real provider prefix. The first-call write premium uses the full instructions, tools and document prefix.</li><li>Instruction, document and tool token fields are baseline estimates. Set the tokenizer factor to 1 for measured target-model token counts.</li><li>The question-and-answer comparison applies the selected tokenizer and region factors consistently. This corrects omissions in the source comparison. It is not a return-on-investment baseline.</li></ul><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Editable example model rate reference"><table><thead><tr><th>Example model</th><th>Input / 1M</th><th>Cache read / 1M</th><th>Output / 1M</th><th>Write multiplier</th><th>Tokenizer factor</th></tr></thead><tbody><tr><th>Claude Opus 5.5</th><td>4</td><td>0.2</td><td>20</td><td>1.25</td><td>1.2</td></tr><tr><th>Claude Opus 4.8</th><td>5</td><td>0.5</td><td>25</td><td>1.25</td><td>1.2</td></tr><tr><th>Claude Sonnet 5.5</th><td>2</td><td>0.2</td><td>10</td><td>1.25</td><td>1.3</td></tr><tr><th>Claude Sonnet 4.6</th><td>3</td><td>0.3</td><td>15</td><td>1.25</td><td>1</td></tr><tr><th>Claude Haiku 4.5</th><td>1</td><td>0.1</td><td>5</td><td>1.25</td><td>1</td></tr><tr><th>Gemini 3.1 Pro (preview)</th><td>2</td><td>0.2</td><td>12</td><td>1</td><td>1</td></tr><tr><th>Gemini 3.8 Flash</th><td>1.5</td><td>0.15</td><td>7.5</td><td>1</td><td>1</td></tr><tr><th>Gemini 3.1 Flash-Lite</th><td>0.25</td><td>No discount assumed</td><td>1.5</td><td>1</td><td>1</td></tr></tbody></table></div><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Model setting reference"><table><thead><tr><th>Setting</th><th>Purpose</th><th>Cost effect</th><th>Claude example</th><th>Gemini example</th><th>CLI example</th></tr></thead><tbody><tr><th>Model</th><td>Which model writes the answer.</td><td>Compare the applicable input and output rates. Qualify each model on the task before changing its size.</td><td>Source example — verify: Haiku 4.5 (small), Sonnet (medium), Opus (large).</td><td>Source example — verify: Flash-Lite (small), Flash (medium), Pro (large).</td><td>Source example — verify: /model. Set model: haiku for simple subagents.</td></tr><tr><th>Thinking depth</th><td>How much the model reasons before it answers.</td><td>Thinking tokens are billed as output tokens, even when you do not see them.</td><td>Source example — verify: effort: low, medium, high, xhigh, max. Default: medium on Opus 5.5, high on Sonnet 5.5. Thinking is always on for these models.</td><td>Source example — verify: thinking_level: minimal, low, medium, high. Default: high on 3.1 Pro and Flash, minimal on 3.1 Flash-Lite.</td><td>Source example — verify: /effort or CLAUDE_CODE_EFFORT_LEVEL. MAX_THINKING_TOKENS on models with a fixed budget.</td></tr><tr><th>Output limit</th><td>The maximum number of tokens that the model can write.</td><td>Limits the worst case. It does not make answers shorter. Ask for the length in the prompt. If the limit is too low, the answer stops early and you pay for a retry.</td><td>Source example — verify: max_tokens (required). A hard limit on thinking plus answer. For xhigh or max effort, start at 64k.</td><td>Source example — verify: maxOutputTokens.</td><td>Source example — verify: CLAUDE_CODE_MAX_OUTPUT_TOKENS.</td></tr><tr><th>Temperature</th><td>How random the word choice is.</td><td>No direct effect on the price.</td><td>Source example — verify: Range 0 to 1, default 1. Opus 4.7 and later and Sonnet 5.5 reject any other value (error 400). Sonnet 4.6 and Haiku 4.5 accept it.</td><td>Source example — verify: Range 0 to 2. On Gemini 3, keep 1.0. A lower value can cause loops, and loops cost tokens.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Top-P</th><td>Uses only the most likely words that together reach probability P.</td><td>No direct effect on the price.</td><td>Source example — verify: Same model rules as temperature. Do not set temperature and top_p together.</td><td>Source example — verify: topP.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Top-K</th><td>Uses only the K most likely next tokens.</td><td>No direct effect on the price.</td><td>Source example — verify: Same model rules as temperature.</td><td>Source example — verify: topK.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Stop sequences</th><td>Stops the answer at a text that you specify.</td><td>Fewer output tokens when the model would continue past the part that you need.</td><td>Source example — verify: stop_sequences.</td><td>Source example — verify: stopSequences.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Number of answers</th><td>How many answers the model writes for one request.</td><td>Additional candidates can add output cost. Check billing and task quality before changing the count.</td><td>Source example — verify: One answer for each request.</td><td>Source example — verify: candidateCount.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Output format</th><td>Makes the answer follow a JSON schema.</td><td>A schema can reduce format errors. Validate the result. Keep an explicit retry policy.</td><td>Source example — verify: output_config.format (structured outputs).</td><td>Source example — verify: responseMimeType and responseJsonSchema.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Image and PDF resolution</th><td>How many tokens each image or PDF page uses.</td><td>Resolution can change input token use. Measure the cost and task accuracy. The supplied token counts and medium-resolution advice are unverified examples.</td><td>Source example — verify: Image tokens grow with the image size. Send smaller images.</td><td>Source example — verify: media_resolution: low, medium, high, ultra_high.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Caching</th><td>Keeps the start of the prompt so the next request reads it at a low price.</td><td>Read, write and storage charges differ by provider and lifetime. Enter the applicable rates. Verify eligibility, expiry and hit rate.</td><td>Source example — verify: cache_control. Lifetime 5 minutes by default, or 1 hour.</td><td>Source example — verify: Implicit caching is on by default. Context caching for a fixed context. Gemini 3.x Flash caches only prompts of 4,096 tokens or more.</td><td>Source example — verify: Automatic. /usage shows the cache hit rate.</td></tr><tr><th>Batch</th><td>Sends many requests to run within 24 hours.</td><td>The source assumes a 0.5 price multiplier. Verify applicable pricing, deadlines and support before using it.</td><td>Source example — verify: Message Batches API.</td><td>Source example — verify: Batch Mode.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Speed and region</th><td>Faster answers or a fixed data region.</td><td>The source assumes optional multipliers. Verify the applicable product, region, speed and contract charges.</td><td>Source example — verify: Fast mode on Opus 5.5: $8 input and $40 output (2 times). US data residency: 1.1 times.</td><td>Source example — verify: Not in this table.</td><td>Source example — verify: Fast mode, when your plan has it.</td></tr><tr><th>Seed and penalties</th><td>Repeatable answers, or fewer repeated words.</td><td>No direct effect on the price.</td><td>Source example — verify: Not available.</td><td>Source example — verify: seed, presencePenalty, frequencyPenalty.</td><td>Source example — verify: Not a setting.</td></tr></tbody></table></div><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Example task setting recommendations"><table><thead><tr><th>Task</th><th>Model</th><th>Thinking</th><th>Output limit</th><th>Sampling</th><th>Format</th></tr></thead><tbody><tr><th>Extract or classify</th><td>Small: Claude Haiku 4.5 or Gemini Flash-Lite</td><td>Off or minimal</td><td>50 to 300 tokens</td><td>Lower sampling may reduce variation where supported. It does not guarantee identical answers. Test the provider setting.</td><td>JSON schema</td></tr><tr><th>Summarize</th><td>Medium: Claude Sonnet or Gemini Flash</td><td>Low</td><td>About 2 times the length that you ask for</td><td>Default</td><td>Bullets with a length limit. Use STE-inspired writing unless full compliance is checked.</td></tr><tr><th>Data question (SQL)</th><td>Medium</td><td>Medium</td><td>1,000 to 2,000 tokens</td><td>Default, or 0 on models that accept it</td><td>JSON that contains the SQL</td></tr><tr><th>Analysis agent</th><td>Large model to plan, small model for simple steps</td><td>Medium. High only for difficult steps.</td><td>16k to 64k tokens (thinking needs room)</td><td>Default</td><td>Structured tool calls and a step limit</td></tr><tr><th>Draft text for people</th><td>Medium</td><td>Low</td><td>About 2 times the length that you ask for</td><td>Default</td><td>Text with a word limit</td></tr><tr><th>Coding with Claude Code</th><td>Sonnet by default, Opus for architecture, Haiku for subagents</td><td>/effort medium. High for difficult problems.</td><td>Default</td><td>Not a setting</td><td>Not applicable</td></tr></tbody></table></div></details></div><p class="slide-note">The same task settings carry across the cost slides. Cache writes have their own cost line. Retries are a cost allowance. These estimates do not prove product savings.</p></section>

d" text-anchor="middle">Model rate</text><circle cx="157" cy="40" r="25" class="cl-dial"/><path d="M157 40 L140.42 28.82" class="cl-needle"/><text x="157" y="93" class="cl-bold" text-anchor="middle">Thinking</text><circle cx="263" cy="40" r="25" class="cl-dial"/><path d="M263 40 L263.00 20.00" class="cl-needle"/><text x="263" y="93" class="cl-bold" text-anchor="middle">Answer</text><circle cx="369" cy="40" r="25" class="cl-dial"/><path d="M369 40 L350.26 46.98" class="cl-needle"/><text x="369" y="93" class="cl-bold" text-anchor="middle">Context</text></svg></div></figure><figure class="cl-figure"><figcaption>Qualify the route before you change it</figcaption><div class="cl-chart-scroll" tabindex="0" role="region" aria-label="Qualify the route before you change it"><svg class="cl-chart" data-chart="model-routing" viewBox="0 0 425 103" role="img" aria-label="Match the model to the work"><title>Match the model to the work</title><desc>Try a qualified small model on simple work. Use deeper reasoning for difficult work. Escalate uncertain cases. Measure quality before changing the route.</desc><rect x="8" y="28" width="118" height="50" rx="8" class="cl-fill-dark"/><text x="67" y="49" class="cl-white cl-bold" text-anchor="middle">Task + checks</text><text x="67" y="70" class="cl-white" text-anchor="middle">Choose a route</text><path d="M126 53 H176 V24 H198 M176 53 V78 H198" class="cl-edge"/><rect x="198" y="2" width="218" height="44" rx="8" class="cl-fill-soft"/><text x="210" y="21" class="cl-bold" >Simple → small model</text><text x="210" y="40" class="cl-muted" >Keep the quality gate</text><rect x="198" y="57" width="218" height="44" rx="8" class="cl-fill-red"/><text x="210" y="76" class="cl-white cl-bold" >Difficult → deeper work</text><text x="210" y="96" class="cl-white" >Escalate uncertainty</text></svg></div></figure></div></div><div class="cl-budget-actions"><span><b>Budget owner:</b> monthly limit.</span><span><b>Weekly review:</b> actual usage.</span><span><b>Monthly adjustment:</b> routes and limits.</span></div></div><p class="cl-scope">Example assumptions. Model token cost only. Add licenses, data queries, review, setup, and operations in the full-cost worksheet. No model calls run here.</p><details class="cl-details"><summary>Default estimate assumptions</summary><div class="cl-default-summary">Question words: 30 · Instruction tokens: 500 · Tool definition tokens: 0 · Document and data tokens: 2667 · Messages per task: 2 · Calls per message: 1 · Tool result tokens per step: 0 · Tool call output tokens: 0 · Thinking tokens per call: 1500 · Answer words: 500 · Expected retry uplift (%): 5 · Eligible input cached (%): 50 · Input rate: 3 · Cache read rate: 0.3 · Output rate: 15 · Cache write multiplier: 1.25 · Tokenizer factor: 1 · Batch factor: 1 · Region factor: 1</div><p>Expected retry uplift applies to base cost. The first call can add a separate cache-write surcharge. Repeated input receives a cache discount only when eligible.</p></details><details class="cl-details cl-reference"><summary>Developer reference: rates, settings, and task choices</summary><p>These examples come from the supplied v7 reference. Verify each setting for your model and API. Test the recommendation on your task.</p><p>Supplied example rates. Not checked against current provider prices. All rates are editable.</p><ul><li>Cache share is an assumption. Confirm eligible prefixes, expiry, writes and storage with your provider.</li><li>The retry input adds an expected cost allowance. It does not simulate additional calls.</li><li>The source simple comparison prices the question and answer only. It excludes tools, context, history and thinking.</li><li>The source Flash example uses a future full rate. Its Pro example omits the stated long-context tier. Enter the rate that applies to your workload.</li><li>All non-question input is cache-eligible in the source calculation. Check each real provider prefix. The first-call write premium uses the full instructions, tools and document prefix.</li><li>Instruction, document and tool token fields are baseline estimates. Set the tokenizer factor to 1 for measured target-model token counts.</li><li>The question-and-answer comparison applies the selected tokenizer and region factors consistently. This corrects omissions in the source comparison. It is not a return-on-investment baseline.</li></ul><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Editable example model rate reference"><table><thead><tr><th>Example model</th><th>Input / 1M</th><th>Cache read / 1M</th><th>Output / 1M</th><th>Write multiplier</th><th>Tokenizer factor</th></tr></thead><tbody><tr><th>Claude Opus 5.5</th><td>4</td><td>0.2</td><td>20</td><td>1.25</td><td>1.2</td></tr><tr><th>Claude Opus 4.8</th><td>5</td><td>0.5</td><td>25</td><td>1.25</td><td>1.2</td></tr><tr><th>Claude Sonnet 5.5</th><td>2</td><td>0.2</td><td>10</td><td>1.25</td><td>1.3</td></tr><tr><th>Claude Sonnet 4.6</th><td>3</td><td>0.3</td><td>15</td><td>1.25</td><td>1</td></tr><tr><th>Claude Haiku 4.5</th><td>1</td><td>0.1</td><td>5</td><td>1.25</td><td>1</td></tr><tr><th>Gemini 3.1 Pro (preview)</th><td>2</td><td>0.2</td><td>12</td><td>1</td><td>1</td></tr><tr><th>Gemini 3.8 Flash</th><td>1.5</td><td>0.15</td><td>7.5</td><td>1</td><td>1</td></tr><tr><th>Gemini 3.1 Flash-Lite</th><td>0.25</td><td>No discount assumed</td><td>1.5</td><td>1</td><td>1</td></tr></tbody></table></div><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Model setting reference"><table><thead><tr><th>Setting</th><th>Purpose</th><th>Cost effect</th><th>Claude example</th><th>Gemini example</th><th>CLI example</th></tr></thead><tbody><tr><th>Model</th><td>Which model writes the answer.</td><td>Compare the applicable input and output rates. Qualify each model on the task before changing its size.</td><td>Source example — verify: Haiku 4.5 (small), Sonnet (medium), Opus (large).</td><td>Source example — verify: Flash-Lite (small), Flash (medium), Pro (large).</td><td>Source example — verify: /model. Set model: haiku for simple subagents.</td></tr><tr><th>Thinking depth</th><td>How much the model reasons before it answers.</td><td>Thinking tokens are billed as output tokens, even when you do not see them.</td><td>Source example — verify: effort: low, medium, high, xhigh, max. Default: medium on Opus 5.5, high on Sonnet 5.5. Thinking is always on for these models.</td><td>Source example — verify: thinking_level: minimal, low, medium, high. Default: high on 3.1 Pro and Flash, minimal on 3.1 Flash-Lite.</td><td>Source example — verify: /effort or CLAUDE_CODE_EFFORT_LEVEL. MAX_THINKING_TOKENS on models with a fixed budget.</td></tr><tr><th>Output limit</th><td>The maximum number of tokens that the model can write.</td><td>Limits the worst case. It does not make answers shorter. Ask for the length in the prompt. If the limit is too low, the answer stops early and you pay for a retry.</td><td>Source example — verify: max_tokens (required). A hard limit on thinking plus answer. For xhigh or max effort, start at 64k.</td><td>Source example — verify: maxOutputTokens.</td><td>Source example — verify: CLAUDE_CODE_MAX_OUTPUT_TOKENS.</td></tr><tr><th>Temperature</th><td>How random the word choice is.</td><td>No direct effect on the price.</td><td>Source example — verify: Range 0 to 1, default 1. Opus 4.7 and later and Sonnet 5.5 reject any other value (error 400). Sonnet 4.6 and Haiku 4.5 accept it.</td><td>Source example — verify: Range 0 to 2. On Gemini 3, keep 1.0. A lower value can cause loops, and loops cost tokens.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Top-P</th><td>Uses only the most likely words that together reach probability P.</td><td>No direct effect on the price.</td><td>Source example — verify: Same model rules as temperature. Do not set temperature and top_p together.</td><td>Source example — verify: topP.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Top-K</th><td>Uses only the K most likely next tokens.</td><td>No direct effect on the price.</td><td>Source example — verify: Same model rules as temperature.</td><td>Source example — verify: topK.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Stop sequences</th><td>Stops the answer at a text that you specify.</td><td>Fewer output tokens when the model would continue past the part that you need.</td><td>Source example — verify: stop_sequences.</td><td>Source example — verify: stopSequences.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Number of answers</th><td>How many answers the model writes for one request.</td><td>Additional candidates can add output cost. Check billing and task quality before changing the count.</td><td>Source example — verify: One answer for each request.</td><td>Source example — verify: candidateCount.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Output format</th><td>Makes the answer follow a JSON schema.</td><td>A schema can reduce format errors. Validate the result. Keep an explicit retry policy.</td><td>Source example — verify: output_config.format (structured outputs).</td><td>Source example — verify: responseMimeType and responseJsonSchema.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Image and PDF resolution</th><td>How many tokens each image or PDF page uses.</td><td>Resolution can change input token use. Measure the cost and task accuracy. The supplied token counts and medium-resolution advice are unverified examples.</td><td>Source example — verify: Image tokens grow with the image size. Send smaller images.</td><td>Source example — verify: media_resolution: low, medium, high, ultra_high.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Caching</th><td>Keeps the start of the prompt so the next request reads it at a low price.</td><td>Read, write and storage charges differ by provider and lifetime. Enter the applicable rates. Verify eligibility, expiry and hit rate.</td><td>Source example — verify: cache_control. Lifetime 5 minutes by default, or 1 hour.</td><td>Source example — verify: Implicit caching is on by default. Context caching for a fixed context. Gemini 3.x Flash caches only prompts of 4,096 tokens or more.</td><td>Source example — verify: Automatic. /usage shows the cache hit rate.</td></tr><tr><th>Batch</th><td>Sends many requests to run within 24 hours.</td><td>The source assumes a 0.5 price multiplier. Verify applicable pricing, deadlines and support before using it.</td><td>Source example — verify: Message Batches API.</td><td>Source example — verify: Batch Mode.</td><td>Source example — verify: Not a setting.</td></tr><tr><th>Speed and region</th><td>Faster answers or a fixed data region.</td><td>The source assumes optional multipliers. Verify the applicable product, region, speed and contract charges.</td><td>Source example — verify: Fast mode on Opus 5.5: $8 input and $40 output (2 times). US data residency: 1.1 times.</td><td>Source example — verify: Not in this table.</td><td>Source example — verify: Fast mode, when your plan has it.</td></tr><tr><th>Seed and penalties</th><td>Repeatable answers, or fewer repeated words.</td><td>No direct effect on the price.</td><td>Source example — verify: Not available.</td><td>Source example — verify: seed, presencePenalty, frequencyPenalty.</td><td>Source example — verify: Not a setting.</td></tr></tbody></table></div><div class="cl-table-scroll" tabindex="0" role="region" aria-label="Example task setting recommendations"><table><thead><tr><th>Task</th><th>Model</th><th>Thinking</th><th>Output limit</th><th>Sampling</th><th>Format</th></tr></thead><tbody><tr><th>Extract or classify</th><td>Small: Claude Haiku 4.5 or Gemini Flash-Lite</td><td>Off or minimal</td><td>50 to 300 tokens</td><td>Lower sampling may reduce variation where supported. It does not guarantee identical answers. Test the provider setting.</td><td>JSON schema</td></tr><tr><th>Summarize</th><td>Medium: Claude Sonnet or Gemini Flash</td><td>Low</td><td>About 2 times the length that you ask for</td><td>Default</td><td>Bullets with a length limit. Use STE-inspired writing unless full compliance is checked.</td></tr><tr><th>Data question (SQL)</th><td>Medium</td><td>Medium</td><td>1,000 to 2,000 tokens</td><td>Default, or 0 on models that accept it</td><td>JSON that contains the SQL</td></tr><tr><th>Analysis agent</th><td>Large model to plan, small model for simple steps</td><td>Medium. High only for difficult steps.</td><td>16k to 64k tokens (thinking needs room)</td><td>Default</td><td>Structured tool calls and a step limit</td></tr><tr><th>Draft text for people</th><td>Medium</td><td>Low</td><td>About 2 times the length that you ask for</td><td>Default</td><td>Text with a word limit</td></tr><tr><th>Coding with Claude Code</th><td>Sonnet by default, Opus for architecture, Haiku for subagents</td><td>/effort medium. High for difficult problems.</td><td>Default</td><td>Not a setting</td><td>Not applicable</td></tr></tbody></table></div></details></div><p class="slide-note">The source settings and task recommendations are reference examples, not approved policy. Provider settings differ. The full-cost worksheet follows this model-only estimate.</p></section>
<section class="slide type-problem has-infographic" id="static-operating-cost"><p class="eyebrow">The investment · where the money goes</p><h2>Count the full cost of an accepted task.</h2><p class="lead">Token cost is one part of the total. Include platform use, human work, operations and setup.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 340" class="motion-diagram infographic-svg infographic-hub" role="img" aria-labelledby="context-infographic-16-title context-infographic-16-desc" preserveAspectRatio="xMidYMid meet"><title id="context-infographic-16-title">The full cost of one accepted task</title><desc id="context-infographic-16-desc">Cost categories have no assumed weight. Use measured utilization and agreed allocation. Record contract, source mapping, adapters, deployment and acceptance tests. Tokens, warehouse queries, storage, tools, delivery and monitoring. Submission review, conflict resolution, corrections and incident handling. Licenses, seats, source updates, access changes, upgrades and recovery.</desc><defs><marker id="context-infographic-16-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--ink, #000000)"/></marker></defs><g class="m-edge m-stage" data-step="0" data-edge="record-link-0"><path id="context-infographic-16-record-link-0" d="M330 72 H368 V145 H385" fill="none" stroke="var(--line, #D8DADA)" stroke-width="2" /></g><g class="m-edge m-stage" data-step="1" data-edge="record-link-1"><path id="context-infographic-16-record-link-1" d="M670 72 H632 V145 H615" fill="none" stroke="var(--line, #D8DADA)" stroke-width="2" /></g><g class="m-edge m-stage" data-step="2" data-edge="record-link-2"><path id="context-infographic-16-record-link-2" d="M670 268 H632 V191 H615" fill="none" stroke="var(--line, #D8DADA)" stroke-width="2" />< 000000)" text-anchor="start">Platform use</text><text x="686" y="86" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Tokens + queries + storage</text><text x="686" y="109" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Tools + delivery</text></g><g class="m-node m-stage" data-node="people" data-step="2" data-stage="Human work" data-stage-detail="Submission review, conflict resolution, corrections and incident handling."><rect x="670" y="216" width="310" height="104" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(686 228) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="9" r="6"/><path d="M5 29v-5c0-11 22-11 22 0v5 M10 29v-6 M22 29v-6"/></g><text x="724" y="249" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Human work</text><text x="686" y="282" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Review + corrections</text><text x="686" y="305" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Conflict + incident work</text></g><g class="m-node m-stage" data-node="maintain" data-step="3" data-stage="Ongoing operations" data-stage-detail="Licenses, seats, source updates, access changes, upgrades and recovery."><rect x="20" y="216" width="310" height="104" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(36 228) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 11A12 12 0 0 0 5 8L2 12 M2 4v8h8 M6 21a12 12 0 0 0 21 3l3-4 M30 28v-8h-8"/></g><text x="74" y="249" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Ongoing operations</text><text x="36" y="282" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Seats + licenses</text><text x="36" y="305" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Changes + recovery</text></g><g class="infographic-center" data-center="record"><rect x="385" y="124" width="230" height="88" rx="12" fill="var(--mist, #F6F6F6)" stroke="var(--red, #EE001E)" stroke-width="1.5"/><text x="500" y="151" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="middle">Accepted task</text><text x="500" y="173" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="middle">Full recurring cost</text><text x="500" y="193" font-family="Arial,sans-serif" font-size="14" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="middle">Setup stays separate</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><details class="presenter-detail"><summary>Presenter detail</summary><div class="items"><article class="item"><h3>Setup</h3><p>Record contract, source mapping, adapters, deployment and acceptance tests.</p></article><article class="item"><h3>Recurring platform</h3><p>Tokens, warehouse queries, storage, tools, delivery and monitoring.</p></article><article class="item"><h3>Human operations</h3><p>Submission review, conflict resolution, corrections and incident handling.</p></article><article class="item"><h3>Maintenance</h3><p>Licenses, seats, source updates, access changes, upgrades and recovery.</p></article></div></details><p class="slide-note">Separate existing allocated costs from incremental spending. Include both consistently in the baseline and candidate. Count each cost once.</p></section>
<section class="slide type-governance has-infographic" id="static-cost-discipline"><p class="eyebrow">Cost design · qualify each saving</p><h2>Control the work. Preserve the result.</h2><p class="lead">Choose the method, bound each call and verify reuse. Keep the same quality and access gates.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 340" class="motion-diagram infographic-svg infographic-matrix" role="img" aria-labelledby="context-infographic-17-title context-infographic-17-desc" preserveAspectRatio="xMidYMid meet"><title id="context-infographic-17-title">Six cost controls preserve the task gates</title><desc id="context-infographic-17-desc">Proposed controls. Validate their effect before claiming any saving. Use deterministic logic for defined rules. Keep certified queries unchanged. Review expert drafts before reuse. Limit permitted context, tokens, output, steps and retries. Batch work only when its deadline permits. Check cache version, expiry, access and invalidation. Measure hit rate, writes, reads and storage. Use a smaller model only if it passes the task gates. Escalate uncertain results. Estimate query work. For BigQuery on-demand queries, test maximum bytes billed. A row limit alone may not bound scans. Track tokens, queries, seats, licenses and human review. Assign budget owners. Separate existing and incremental costs.</desc><defs><marker id="context-infographic-17-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--ink, #000000)"/></marker></defs><g class="m-node m-stage" data-node="logic" data-step="0" data-stage="Approved logic" data-stage-detail="Use deterministic logic for defined rules. Keep certified queries unchanged. Review expert drafts before reuse."><rect x="20" y="15" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(36 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m10 8-7 8 7 8 M22 8l7 8-7 8 M19 4l-6 24"/></g><text x="74" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Approved logic</text><text x="36" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Code / SQL first</text><text x="36" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Review expert drafts</text></g><g class="m-node m-stage" data-node="bound" data-step="1" data-stage="Bound each call" data-stage-detail="Limit permitted context, tokens, output, steps and retries. Batch work only when its deadline permits."><rect x="350" y="15" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(366 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 8v9l7 4 M16 3v2 M29 16h-2 M16 29v-2 M3 16h2"/></g><text x="404" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Bound each call</text><text x="366" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Context + output tokens</text><text x="366" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Step + retry limits</text></g><g class="m-node m-stage" data-node="cache" data-step="2" data-stage="Valid cache" data-stage-detail="Check cache version, expiry, access and invalidation. Measure hit rate, writes, reads and storage."><rect x="680" y="15" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(696 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="14" cy="6" rx="10" ry="4"/><path d="M4 6v16c0 5 14 6 19 2 M4 14c0 5 20 5 20 0 M24 6v8 M22 15a8 8 0 1 1-6 14 M22 15v6h6"/></g><text x="734" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Valid cache</text><text x="696" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Version + access checks</text><text x="696" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Expiry + invalidation</text></g><g class="m-node m-stage" data-node="route" data-step="3" data-stage="Qualified route" data-stage-detail="Use a smaller model only if it passes the task gates. Escalate uncertain results."><rect x="20" y="185" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(36 197) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5a5 5 0 0 0-8 5 5 5 0 0 0-1 9 6 6 0 0 0 9 8 M19 5a5 5 0 0 1 8 5 5 5 0 0 1 1 9 6 6 0 0 1-9 8 M16 3v26 M8 11l8 5 8-5 M9 23l7-7 7 7"/><circle cx="16" cy="16" r="3"/></g><text x="74" y="218" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Qualified route</text><text x="36" y="251" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Small model if qualified</text><text x="36" y="274" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Escalate uncertain work</text></g><g class="m-node m-stage" data-node="warehouse" data-step="4" data-stage="Warehouse limit" data-stage-detail="Estimate query work. For BigQuery on-demand queries, test maximum bytes billed. A row limit alone may not bound scans."><rect x="350" y="185" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(366 197) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="16" cy="6" rx="11" ry="4"/><path d="M5 6v19c0 5 22 5 22 0V6 M5 15c0 5 22 5 22 0 M5 23c0 5 22 5 22 0"/></g><text x="404" y="218" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Warehouse limit</text><text x="366" y="251" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">BigQuery query scans</text><text x="366" y="274" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Maximum bytes billed</text></g><g class="m-node m-stage" data-node="total" data-step="5" data-stage="Full cost" data-stage-detail="Track tokens, queries, seats, licenses and human review. Assign budget owners. Separate existing and incremental costs."><rect x="680" y="185" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(696 197) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M21 10h-7a4 4 0 0 0 0 8h4a4 4 0 0 1 0 8h-7 M16 5v23"/></g><text x="734" y="218" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">Full cost</text><text x="696" y="251" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Seats + licenses + review</text><text x="696" y="274" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Existing vs incremental</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><details class="presenter-detail"><summary>Presenter detail</summary><div class="items"><article class="item"><h3>Reuse approved code or SQL</h3><p>Use deterministic logic for defined rules. Keep certified queries unchanged. Review expert drafts before reuse.</p></article><article class="item"><h3>Bound context and output</h3><p>Limit permitted context, tokens, output, steps and retries. Batch work only when its deadline permits.</p></article><article class="item"><h3>Reuse valid context</h3><p>Check cache version, expiry, access and invalidation. Measure hit rate, writes, reads and storage.</p></article><article class="item"><h3>Qualify the model route</h3><p>Use a smaller model only if it passes the task gates. Escalate uncertain results.</p></article><article class="item"><h3>Control warehouse cost</h3><p>Estimate query work. For BigQuery on-demand queries, test maximum bytes billed. A row limit alone may not bound scans.</p></article><article class="item"><h3>Count every cost once</h3><p>Track tokens, queries, seats, licenses and human review. Assign budget owners. Separate existing and incremental costs.</p></article></div></details><p class="slide-note">Keep certified queries unchanged. Review expert drafts before reuse. The supplied v7 guidance is not approved policy. No saving has been measured.</p></section>
<section class="slide type-pitch-calculator" id="static-value-assumptions"><p class="eyebrow">The investment · editable worksheet</p><h2>Change the assumptions. Inspect the return.</h2><p class="lead">Compare the same accepted-task target. The starting example assumes no improvement and therefore shows added cost.</p><div class="business-case-static"><div class="business-case-grid"><table class="assumption-table"><caption>Invented example assumptions · USD</caption><tbody><tr><th scope="row">Accepted tasks / month</th><td data-assumption="target" data-value="1000">1000</td></tr><tr><th scope="row">Handling cost / hour ($)</th><td data-assumption="hourly" data-value="60">60</td></tr><tr><th scope="row">One-time setup ($)</th><td data-assumption="setup" data-value="5000">5000</td></tr><tr><th scope="row">Current digital cost / attempt ($)</th><td data-assumption="baselineCost" data-value="1.2">1.2</td></tr><tr><th scope="row">Proposed digital cost / attempt ($)</th><td data-assumption="candidateCost" data-value="1.2">1.2</td></tr><tr><th scope="row">Current handling minutes / attempt</th><td data-assumption="baselineMinutes" data-value="4">4</td></tr><tr><th scope="row">Proposed handling minutes / attempt</th><td data-assumption="candidateMinutes" data-value="4">4</td></tr><tr><th scope="row">Current accepted attempts (%)</th><td data-assumption="baselineAcceptance" data-value="80">80</td></tr><tr><th scope="row">Proposed accepted attempts (%)</th><td data-assumption="candidateAcceptance" data-value="80">80</td></tr><tr><th scope="row">Current fixed cost / month ($)</th><td data-assumption="baselineFixed" data-value="0">0</td></tr><tr><th scope="row">Proposed fixed cost / month ($)</th><td data-assumption="candidateFixed" data-value="1000">1000</td></tr></tbody></table><div class="business-case-results" data-outcome="higher-cost"><div class="business-case-result"><span>Current recurring / month</span><strong data-result="baseline" data-value="6500">$6,500.00</strong></div><div class="business-case-result"><span>Proposed recurring / month</span><strong data-result="candidate" data-value="7500">$7,500.00</strong></div><div class="business-case-result"><span>Recurring difference / month</span><strong data-result="difference" data-value="-1000">-$1,000.00</strong></div><div class="business-case-result"><span>Year-one net difference</span><strong data-result="yearOne" data-value="-17000">-$17,000.00</strong></div><div class="business-case-result"><span>Current cost / accepted task</span><strong data-result="baselineUnit" data-value="6.5">$6.50</strong></div><div class="business-case-result"><span>Proposed cost / accepted task</span><strong data-result="candidateUnit" data-value="7.5">$7.50</strong></div></div></div><p class="business-case-definition">Compare the same monthly target of accepted tasks. Acceptance means the owner confirms the task and quality criteria.</p><p class="business-case-formula">Attempts = accepted target / acceptance rate. Recurring cost = attempts × (digital cost + handling minutes × hourly rate / 60) + fixed cost. Year-one net = 12 × monthly difference − setup.</p><p class="business-case-scope">Digital cost includes model tokens, retrieval, warehouse queries, tools and variable infrastructure per attempt. Handling includes review, rework and escalation. Fixed cost includes seats, licenses, adapters and operations. Compare existing and incremental costs consistently; count each once. Setup stays separate.</p><p class="business-case-note">Invented example assumptions, not a quote or measured savings. The neutral starting case assumes no improvement. Rates and workload stay constant for the annual estimate. Validate the inputs and all quality gates.</p></div><p class="slide-note">Invented assumptions in USD. Test a positive case and a higher-cost case. Financial results never override quality or permission gates.</p></section>
<section class="slide type-pitch-proof" id="static-pilot-acceptance"><p class="eyebrow">The investment · decision evidence</p><h2>Agree the proof before paying for scale.</h2><p class="lead">Run a baseline and a candidate on the same workload. Use held-out cases and complete cost evidence.</p><div class="proof-grid"><article class="proof-card" data-lens="cost"><h3>Cost</h3><h4>Measure</h4><p>Recurring cost per accepted task; one-time setup; maintenance effort.</p><h4>Trial</h4><p>Compare the same accepted-task target. Record token and query charges, allocated and incremental licenses, adapters, operations and human handling without double counting.</p><h4>Expansion gate</h4><p class="proof-decision">Expand only when the agreed economic case holds after full cost readback.</p></article><article class="proof-card" data-lens="performance"><h3>Performance</h3><h4>Measure</h4><p>Median and p95 completion time; throughput; retries; recovery time.</p><h4>Trial</h4><p>Measure submit-to-approved-delivery latency and consuming-task completion separately. Include review queues and p95 at agreed load.</p><h4>Expansion gate</h4><p class="proof-decision">Meet the owner’s service target without hiding failed, queued or held tasks.</p></article><article class="proof-card" data-lens="accuracy"><h3>Accuracy</h3><h4>Measure</h4><p>Task acceptance; source correctness; stale/conflict detection; abstention.</p><h4>Trial</h4><p>Test held-out questions against approved LookML definitions and owner-reviewed gold truth. Check grain, unit, time window and exceptions.</p><h4>Expansion gate</h4><p class="proof-decision">Meet agreed quality gates. Investigate failures before expanding scope.</p></article><article class="proof-card" data-lens="trust"><h3>Trust</h3><h4>Measure</h4><p>Scope isolation; permission enforcement; evidence coverage; reviewer decisions.</p><h4>Trial</h4><p>Test source and consumer access, revoked permissions, hostile instructions, cross-vault retrieval and exact-version audit readback.</p><h4>Expansion gate</h4><p class="proof-decision">Hold release for a material access failure. Assess user confidence separately.</p></article></div><p class="slide-note">Proposed pilot measurements. No product result has been measured. An accepted task passes owner criteria. p95 covers 95% of measured completion times.</p></section>
<section class="slide type-upgrade" id="static-upgrade-example"><p class="eyebrow">The demo · contract rehearsal</p><h2>See what a component change must preserve.</h2><p class="lead">Run four browser scenarios on one record. Inspect evidence loss, exception loss and expanded permission.</p><div class="diagram-grid"><pre class="contract-card">canonical_id: interpretation:reports-retention
version: 3
workspace: operations
source: policy-v3, paragraph 4
valid_from: 2026-09-01
status: approved
claim: Keep reports for 30 days.
exception: Keep disputed reports
           until review ends.
input_refs: [data:reports-policy@3]
review: owner + exact content hash
access: operations-readers

IDs identify records. IDs grant no access.</pre><div><div class="item"><h3>Illustrative contract checks</h3><p>The browser example accepts a change that preserves the record. It rejects missing evidence, a removed exception, or expanded permission. These checks do not call a model. Enable JavaScript to run the four examples.</p></div><div class="items"><article class="item"><h3>What works today</h3><p>The presentation executes these deterministic example checks.</p></article><article class="item"><h3>What the prototype must add</h3><p>A real submission, review, persisted release and authenticated context read.</p></article></div></div></div><p class="slide-note">A browser rehearsal demonstrates the intended contract. It does not validate a model, server, database or operational outcome.</p></section>

="translate(526 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M28 5 21 12l-5-5 7-7a10 10 0 0 0-13 12L2 25a4 4 0 0 0 5 5l12-10A10 10 0 0 0 28 5z"/></g><text x="564" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">To implement</text><text x="526" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Adapters + durable records</text><text x="526" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Model harness + MCP</text></g><g class="m-node m-stage" data-node="qualify" data-step="3" data-stage="To qualify" data-stage-detail="Live integration, calibration, access isolation, recovery, load and buyer return."><rect x="755" y="15" width="225" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(771 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="m8 16 6 6 11-12"/></g><text x="809" y="48" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #000000)" text-anchor="start">To qualify</text><text x="771" y="81" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Live access + calibration</text><text x="771" y="104" font-family="Arial,sans-serif" font-size="15" font-weight="500" fill="var(--muted, #6F7171)" text-anchor="start">Load + buyer return</text></g></svg></div><p class="diagram-scroll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arro <section class="slide type-governance has-infographic" id="static-plan-alignment"><p class="eyebrow">Plan alignment · existing delivery journey</p><h2>Put the product inside the delivery plan.</h2><p class="lead">The seven-stage plan already provides owners and gates. Use it to govern this pilot.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 340" class="motion-diagram infographic-svg infographic-timeline" role="img" aria-labelledby="context-infographic-19-title context-infographic-19-desc" preserveAspectRatio="xMidYMid meet"><title id="context-infographic-19-title">Seven stages govern delivery</title><desc id="context-infographic-19-desc">Intake/Vetting → Product Requirements → Product Design → Development → Testing → Launch → Maintenance. Name the workflow and sponsor. Check the solution, agent, skill and MCP catalogs before custom development. Map source definitions, current costs and permitted use. Agree technical and business success criteria. Approve the context contract, Metric Passport, review duties, success gates and pilot budget. Build one complete context path. Reuse LookML and verify one consumer adapter. Check owner-approved gold truth, standing QA, permissions and cost. Require security and leadership go/no-go. Publish only the accepted release. Confirm operating owners, support and rollback. Review corrections and drift. Requalify source or model changes before expanding.</desc><defs><marker id="context-infographic-19-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--ink, #000000)"/></marker></defs><g class="m-edge m-stage" data-step="1" data-edge="delivery-1"><path id="context-infographic-19-delivery-1" d="M245 77 H265" fill="none" stroke="var(--ink, #000000)" stroke-width="2" marker-end="url(#context-infographic-19-arrow)"/> <section class="slide type-roadmap" id="static-development-gates"><p class="eyebrow">Build path · one complete vertical slice</p><h2>Build the smallest complete proof of the product.</h2><p class="lead">Begin with one real context record and one consuming application. Complete the whole path before widening coverage.</p><div class="items"><article class="item"><h3>Agree the contract</h3><p>Reuse existing solutions. Set source bindings, reviewer authority, output schema and success gates.</p></article><article class="item"><h3>Implement admission</h3><p>Use one custom-app workflow to submit, review, version and persist an approved record.</p></article><article class="item"><h3>Link and publish</h3><p>Build its layer references and publish an atomic approved release.</p></article><article class="item"><h3>Consume securely</h3><p>Verify one consumer adapter. Check identity, permissions and bounded context delivery.</p></article><article class="item"><h3>Test failure paths</h3><p>Exercise rejection, conflict, withdrawal, expiry and failed publication.</p></article><article class="item"><h3>Measure and decide</h3><p>Compare accepted-task cost, quality and latency. Expand only after owner acceptance.</p></article></div><p class="slide-note">This is a proposed development sequence. Scope, schedule, hosting, pricing and commitments require an agreed pilot contract.</p></section>
<section class="slide type-decisions" id="static-next-decisions"><p class="eyebrow">The offer · a bounded commitment</p><h2>Approve a bounded proof of value.</h2><p class="lead">Approve the pilot scope before development. Start with one governed metric, one reviewer and one existing consuming application.</p><div class="items"><article class="item"><h3>Pilot deliverable</h3><p>A reusable context release linked to LookML, plus replayable acceptance evidence.</p></article><article class="item"><h3>Buyer contribution</h3><p>One workflow, source owner, baseline, reviewer time and permitted test access.</p></article><article class="item"><h3>Investment decision</h3><p>Approve a setup ceiling, recurring budget and named delivery responsibilities.</p></article><article class="item"><h3>Expansion decision</h3><p>Accept the result only when economics, quality and control meet the agreed gates.</p></article></div><p class="slide-note">Approval funds a scoped pilot. Expansion requires a separate evidence-based decision. Price, dates and thresholds remain to agree.</p></section>
<section class="slide type-governance has-infographic" id="static-failure-contracts"><p class="eyebrow">Developer acceptance · failure behavior</p><h2>A failed check must not become approved context.</h2><p class="lead">Reject, hold, invalidate or deny the request. Keep each decision traceable.</p><figure class="mechanism-figure"><div class="diagram-viewport" tabindex="0" role="region" aria-label="Context workflow diagram. Scroll horizontally on a small screen."><svg viewBox="0 0 1000 340" class="motion-diagram infographic-svg infographic-matrix" role="img" aria-labelledby="context-infographic-20-title context-infographic-20-desc" preserveAspectRatio="xMidYMid meet"><title id="context-infographic-20-title">A controlled response for each failure</title><desc id="context-infographic-20-desc">These are proposed acceptance behaviors. Verify durable state and response content. Reject malformed data. Hold unsupported claims for revision. Record the conflict. Ask the responsible reviewer. Require a new version and review. Keep the prior audit history. Invalidate dependent output and cached views. Return a controlled denial. Do not leak restricted record content. Keep the prior release available. Do not expose a partial update.</desc><defs><marker id="context-infographic-20-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="var(--ink, #000000)"/></marker></defs><g class="m-node m-stage" data-node="invalid" data-step="0" data-stage="Missing evidence" data-stage-detail="Reject malformed data. Hold unsupported claims for revision."><rect x="20" y="15" width="300" height="140" rx="12" fill="var(--paper, #ffffff)" stroke="var(--line, #D8DADA)" stroke-width="1.5"/><g class="infographic-icon" transform="translate(36 27) scale(0.875)" fill="none" stroke="var(--red, #EE001E)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h12l6 6v20H7z M19 3v7h6 M11 15h10 M11 ll-hint">Swipe the diagram to follow the workflow. Focus it and use arrow keys to scroll.</p><figcaption class="static-diagram-caption">Static diagram. Follow the arrows and read all stages.</figcaption></figure><details class="presenter-detail"><summary>Presenter detail</summary><div class="items"><article class="item"><h3>Invalid or missing evidence</h3><p>Reject malformed data. Hold unsupported claims for revision.</p></article><article class="item"><h3>Uncertain or conflicting meaning</h3><p>Record the conflict. Ask the responsible reviewer.</p></article><article class="item"><h3>Changed approved record</h3><p>Require a new version and review. Keep the prior audit history.</p></article><article class="item"><h3>Expired or withdrawn input</h3><p>Invalidate dependent output and cached views.</p></article><article class="item"><h3>Denied consumer access</h3><p>Return a controlled denial. Do not leak restricted record content.</p></article><article class="item"><h3>Publication failure</h3><p>Keep the prior release available. Do not expose a partial update.</p></article></div></details><p class="slide-note">Proposed acceptance behaviors. The implementation must prove them with durable readback and failure tests.</p></section>
