name: Publish context layer presentation

on:
  push:
    branches: [feature/context-presentation]
    paths:
      - decisions.html
      - decisions.css
      - decisions.js
      - decision-tree.json
      - cortex-content.json
      - cortex.css
      - cortex.js
      - scripts/build-decisions.cjs
      - scripts/render-cortex.cjs
      - scripts/verify-cortex.cjs
      - scripts/verify-decisions.cjs
      - motion.css
      - hierarchy.css
      - motion-preview.html
      - scripts/render-product-intro.cjs
      - scripts/verify-motion.cjs
      - story.html
      - story.js
      - story.css
      - scripts/verify-story.cjs
      - index.html
      - presentation-shell.html
      - motion-runtime.js
      - mini-architectures.js
      - scripts/original-content-hashes.json
      - scripts/check-coverage.cjs
      - styles.css
      - app.js
      - diagrams.js
      - cost-lab.js
      - cost-lab.css
      - presentation-content.json
      - scripts/check-static.mjs
      - scripts/build-static.cjs
      - scripts/verify-browser.cjs
      - scripts/verify-v7.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out presentation
        uses: actions/checkout@v6
      - name: Validate static presentation
        run: |
          node --check scripts/render-product-intro.cjs
          node --check scripts/verify-motion.cjs
          node --check motion-runtime.js
          node --check mini-architectures.js
          node --check decisions.js
          node --check cortex.js
          node --check scripts/build-decisions.cjs
          node --check scripts/render-cortex.cjs
          node --check scripts/verify-cortex.cjs
          node --check scripts/verify-decisions.cjs
          node --check story.js
          node --check scripts/verify-story.cjs
          node --check app.js
          node --check diagrams.js
          node --check cost-lab.js
          node --check scripts/build-static.cjs
          node --check scripts/verify-browser.cjs
          node --check scripts/verify-v7.cjs
          node scripts/build-static.cjs --check
          node scripts/check-static.mjs
          node scripts/check-coverage.cjs
      - name: Install browser validation tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Validate presentation in Chromium
        run: |
          python3 -m http.server 8893 --bind 127.0.0.1 >/tmp/context-presentation-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/verify-browser.cjs
          node scripts/verify-story.cjs
          node scripts/verify-decisions.cjs
          node scripts/verify-cortex.cjs
          node scripts/verify-motion.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir _site
          cp motion-preview.html decisions.html story.html index.html styles.css app.js diagrams.js cost-lab.js cost-lab.css presentation-content.json _site/
          touch _site/.nojekyll
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v4
