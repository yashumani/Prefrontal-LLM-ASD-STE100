name: Publish context layer presentation

on:
  push:
    branches: [feature/context-presentation]
    paths:
      - index.html
      - styles.css
      - app.js
      - diagrams.js
      - presentation-content.json
      - scripts/check-static.mjs
      - scripts/build-static.cjs
      - scripts/verify-browser.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out presentation
        uses: actions/checkout@v6
      - name: Validate static presentation
        run: |
          node --check app.js
          node --check diagrams.js
          node --check scripts/build-static.cjs
          node --check scripts/verify-browser.cjs
          node scripts/build-static.cjs --check
          node scripts/check-static.mjs
      - name: Install browser validation tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Validate presentation in Chromium
        run: |
          python3 -m http.server 8893 --bind 127.0.0.1 >/tmp/context-presentation-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/verify-browser.cjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html styles.css app.js diagrams.js presentation-content.json _site/
          touch _site/.nojekyll
      - name: Upload public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v4
