name: Validate and publish context workspace

on:
  push:
    branches: [main]
    paths:
      - workspace/**
      - scripts/build-pages.cjs
      - scripts/test-workspace-*.mjs
      - scripts/verify-workspace-*
      - scripts/benchmark-workspace.mjs
      - pilot/composable_model.py
      - pilot/composable_registry.py
      - pilot/composable_search.py
      - pilot/composable_formats.py
      - pilot/browser_workspace.py
      - .gitattributes
      - pyproject.toml
      - best-practices.html
      - best-practices.json
      - practices.css
      - practice-links.js
      - sidebar.css
      - sidebar.js
      - motion-preview-shell.html
      - scripts/render-sidebar.cjs
      - scripts/build-practices.cjs
      - scripts/build-motion-preview.cjs
      - scripts/verify-navigation.cjs
      - decisions.html
      - decisions.css
      - decisions.js
      - decision-tree.json
      - cortex-content.json
      - cortex.css
      - cortex.js
      - scripts/build-decisions.cjs
      - scripts/render-cortex.cjs
      - scripts/verify-cortex.cjs
      - scripts/verify-decisions.cjs
      - motion.css
      - hierarchy.css
      - motion-preview.html
      - scripts/render-product-intro.cjs
      - scripts/verify-motion.cjs
      - story.html
      - story.js
      - story.css
      - scripts/verify-story.cjs
      - index.html
      - presentation-shell.html
      - motion-runtime.js
      - mini-architectures.js
      - scripts/original-content-hashes.json
      - scripts/check-coverage.cjs
      - styles.css
      - app.js
      - diagrams.js
      - cost-lab.js
      - cost-lab.css
      - presentation-content.json
      - scripts/check-static.mjs
      - scripts/build-static.cjs
      - scripts/verify-browser.cjs
      - scripts/verify-v7.cjs
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - workspace/**
      - scripts/build-pages.cjs
      - scripts/test-workspace-*.mjs
      - scripts/verify-workspace-*
      - scripts/benchmark-workspace.mjs
      - pilot/composable_model.py
      - pilot/composable_registry.py
      - pilot/composable_search.py
      - pilot/composable_formats.py
      - pilot/browser_workspace.py
      - .gitattributes
      - pyproject.toml
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Keep browser/font dependencies on the supported, reproducible LTS image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate bounded context workspace
        run: |
          node --version
          node --check workspace/app.mjs
          node --check workspace/core.mjs
          node --check workspace/formats.mjs
          node scripts/test-workspace-core.mjs
          node scripts/test-workspace-formats.mjs
          node scripts/verify-workspace-bridge.mjs
          node scripts/benchmark-workspace.mjs --output .validation/workspace/benchmark.json
      - name: Validate static presentation
        run: |
          node --check scripts/render-product-intro.cjs
          node --check scripts/verify-motion.cjs
          node --check sidebar.js
          node --check practice-links.js
          node --check scripts/build-practices.cjs
          node --check scripts/render-sidebar.cjs
          node --check scripts/build-motion-preview.cjs
          node --check scripts/verify-navigation.cjs
          node --check motion-runtime.js
          node --check mini-architectures.js
          node --check decisions.js
          node --check cortex.js
          node --check scripts/build-decisions.cjs
          node --check scripts/render-cortex.cjs
          node --check scripts/verify-cortex.cjs
          node --check scripts/verify-decisions.cjs
          node --check story.js
          node --check scripts/verify-story.cjs
          node --check app.js
          node --check diagrams.js
          node --check cost-lab.js
          node --check scripts/build-static.cjs
          node --check scripts/verify-browser.cjs
          node --check scripts/verify-v7.cjs
          node scripts/build-static.cjs --check
          node scripts/check-static.mjs
          node scripts/check-coverage.cjs
      - name: Install browser validation tools
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Assemble public workspace and preserved presentation
        run: node scripts/build-pages.cjs --commit ${{ github.sha }}
      - name: Validate workspace in Chromium at the repository subpath
        run: node scripts/verify-workspace-browser.cjs
      - name: Validate presentation in Chromium
        run: |
          python3 -m http.server 8893 --bind 127.0.0.1 >/tmp/context-presentation-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/verify-browser.cjs
          node scripts/verify-story.cjs
          node scripts/verify-decisions.cjs
          node scripts/verify-cortex.cjs
          node scripts/verify-motion.cjs
          node scripts/verify-navigation.cjs
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload public site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Retain workspace acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-context-workspace
          path: .validation/workspace/
          retention-days: 7
          if-no-files-found: warn
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy context workspace
        id: deployment
        uses: actions/deploy-pages@v4
